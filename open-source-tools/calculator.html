<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة مجموع الثانوية العامة 2025 - احسب نسبتك المئوية</title>
    <meta name="description" content="احسب مجموع الثانوية العامة بسهولة — أدخل مجموعك الكلى والدرجة الكلية لتحصل على النسبة المئوية فوراً.">
    <meta name="keywords" content="حاسبة مجموع الثانوية العامة, حساب النسبة المئوية, مجموع الثانوية العامة, نتيجة الثانوية العامة, حساب الدرجات">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="حاسبة مجموع الثانوية العامة">
    <meta property="og:description" content="احسب مجموع الثانوية العامة بسهولة — أدخل مجموعك والدرجة الكلية لتحصل على النسبة المئوية فوراً.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#111118">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0f;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .card {
            background: #111118;
            border-radius: 32px;
            padding: 48px 40px 40px;
            width: 380px;
            border: 1px solid rgba(255,255,255,0.04);
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.02),
                0 30px 80px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 0%, rgba(99,102,241,0.06), transparent 50%);
            pointer-events: none;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 20px;
            padding: 4px 14px;
            color: rgba(255,255,255,0.25);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }
        .field {
            margin-bottom: 6px;
            position: relative;
        }
        .field label {
            display: block;
            color: rgba(255,255,255,0.2);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 6px;
            transition: color 0.2s;
        }
        .field:focus-within label {
            color: rgba(255,255,255,0.5);
        }
        .field input {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 28px;
            font-weight: 400;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            letter-spacing: 0.5px;
            direction: ltr;
            text-align: left;
        }
        .field input:focus {
            border-color: rgba(99,102,241,0.3);
            background: rgba(255,255,255,0.05);
        }
        .field input::placeholder {
            color: rgba(255,255,255,0.08);
        }
        .field-unit {
            position: relative;
        }
        .field-unit input {
            padding-left: 50px;
        }
        .field-unit .unit {
            position: absolute;
            left: 20px;
            bottom: 18px;
            color: rgba(255,255,255,0.15);
            font-size: 22px;
            font-weight: 300;
            pointer-events: none;
        }
        .sep {
            text-align: center;
            padding: 8px 0;
            color: rgba(255,255,255,0.06);
            font-size: 22px;
            font-weight: 300;
        }
        .result {
            margin-top: 28px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }
        .result.has-value {
            border-color: rgba(99,102,241,0.15);
        }
        .result-left {
            display: flex;
            flex-direction: column;
        }
        .result-left .rlabel {
            color: rgba(255,255,255,0.2);
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .result-left .rvalue {
            color: #fff;
            font-size: 40px;
            font-weight: 300;
            line-height: 1.2;
            margin-top: 2px;
        }
        .result-left .rvalue .pct {
            color: rgba(255,255,255,0.25);
            font-size: 24px;
            font-weight: 300;
        }
        .result-right {
            text-align: left;
            direction: ltr;
        }
        .result-right .frac {
            color: rgba(255,255,255,0.15);
            font-size: 14px;
            font-weight: 400;
        }
        .result-right .frac .num {
            color: rgba(255,255,255,0.4);
        }
        .result-right .frac .den {
            color: rgba(255,255,255,0.4);
        }
        .ring {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            flex-shrink: 0;
            background: conic-gradient(#6366f1 var(--pct, 0%), rgba(255,255,255,0.04) 0%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .ring::after {
            content: '';
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #111118;
            position: absolute;
        }
        .ring span {
            position: relative;
            z-index: 1;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
            font-weight: 500;
        }
        .empty-state {
            color: rgba(255,255,255,0.08);
            font-size: 14px;
            font-weight: 400;
        }
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
        @media (max-width: 420px) {
            .card { padding: 32px 24px; width: 94%; }
            .result { flex-wrap: wrap; gap: 16px; }
        }
    </style>
</head>
<body>
    <div class="card">
            <div class="badge">●  الثانوية العامة 2025</div>

        <div class="field field-unit">
            <label>المجموع الحاصل عليه</label>
            <input type="number" id="val" value="209" step="any" placeholder="0" autofocus>
            <span class="unit">/</span>
        </div>

        <div class="sep">—</div>

        <div class="field">
            <label>الدرجة الكلية (المجموع الكلى)</label>
            <input type="number" id="total" value="320" step="any" placeholder="0">
        </div>

        <div class="result" id="result">
            <div class="result-left">
                <span class="rlabel">نسبة النجاح</span>
                <span class="rvalue" id="rvalue">65.3<span class="pct">%</span></span>
            </div>
            <div class="ring" id="ring" style="--pct: 65.3%">
                <span id="ringLabel">65%</span>
            </div>
        </div>
    </div>

    <script>
        const valEl = document.getElementById('val');
        const totalEl = document.getElementById('total');
        const rvalue = document.getElementById('rvalue');
        const ring = document.getElementById('ring');
        const ringLabel = document.getElementById('ringLabel');
        const resultBox = document.getElementById('result');

        function update() {
            const v = parseFloat(valEl.value);
            const t = parseFloat(totalEl.value);
            const valid = !isNaN(v) && !isNaN(t) && t !== 0 && valEl.value !== '' && totalEl.value !== '';

            if (!valid) {
                rvalue.innerHTML = '<span style="color:rgba(255,255,255,0.08);font-size:16px;font-weight:400;">—</span>';
                ring.style.setProperty('--pct', '0%');
                ringLabel.textContent = '0%';
                resultBox.classList.remove('has-value');
                return;
            }

            const pct = (v / t) * 100;
            const clamped = Math.min(100, Math.max(0, pct));
            const display = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(1);

            rvalue.innerHTML = `${display}<span class="pct">%</span>`;
            ring.style.setProperty('--pct', `${clamped}%`);
            ringLabel.textContent = `${Math.round(clamped)}%`;
            resultBox.classList.add('has-value');
        }

        valEl.addEventListener('input', update);
        totalEl.addEventListener('input', update);
        update();
    </script>
</body>
</html>
