<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حارس الأرقام والمنطق</title>
<style>
:root{--bg:#eef0f3;--panel:#fff;--ink:#14161a;--mut:#5b6270;--line:#cfd4dc;--blk:#2f6fe4;--gold:#f0b000;--bad:#e5484d;--ok:#16a34a;--veil:rgba(238,240,243,.92);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12151b;--panel:#1b2029;--ink:#eceff4;--mut:#9aa3b2;--line:#2c3340;--blk:#4d8cff;--gold:#ffc83a;--bad:#ff5c63;--ok:#3ddc84;--veil:rgba(18,21,27,.93)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12151b;--panel:#1b2029;--ink:#eceff4;--mut:#9aa3b2;--line:#2c3340;--blk:#4d8cff;--gold:#ffc83a;--bad:#ff5c63;--ok:#3ddc84;--veil:rgba(18,21,27,.93)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);font-weight:700;flex-wrap:wrap}
#hud small{color:var(--mut);font-weight:500;margin-inline-end:4px}
#lives{color:var(--bad);letter-spacing:3px}
#stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#bar{display:flex;gap:8px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--line)}
#ans{flex:1;min-width:0;font:700 24px system-ui,Arial;text-align:center;padding:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:0;direction:ltr}
#ans:focus-visible,button:focus-visible{outline:3px solid var(--blk);outline-offset:2px}
#ans.sh{border-color:var(--bad);animation:sh .3s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
button{font:700 18px system-ui,"Segoe UI",Tahoma,Arial;padding:8px 22px;border:0;background:var(--blk);color:#fff;cursor:pointer;border-radius:0}
#ov{position:absolute;inset:0;background:var(--veil);display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;overflow:auto}
#ov>div{max-width:420px;width:100%}
#ov h1{margin:0 0 4px;font-size:30px}
#ov p{margin:6px 0;color:var(--mut)}
#ov .big{font-size:44px;font-weight:800;color:var(--ink);margin:4px 0}
#st{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
#st div{background:var(--panel);border:1px solid var(--line);padding:6px 2px;font-size:14px}
#st b{display:block;font-size:20px}
#st .top{border-color:var(--bad)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){#ans.sh{animation:none}}
</style>
</head>
<body>
<div id="hud">
  <span><small>النقاط</small><span id="sc">0</span></span>
  <span><small>المستوى</small><span id="lv">1</span></span>
  <span><small>الأعلى</small><span id="bs">0</span></span>
  <span id="lives" aria-label="الأرواح"></span>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ov"><div id="ovc"></div></div>
</div>
<div id="bar">
  <input id="ans" type="text" inputmode="numeric" autocomplete="off" placeholder="اكتب الإجابة ثم Enter" aria-label="الإجابة">
  <button id="go">أدخل</button>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d'),stage=$('#stage'),ans=$('#ans');
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const NAMES={'+':'جمع','−':'طرح','×':'ضرب','÷':'قسمة'};
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
let W,H,dpr,C={},best=0;
try{best=+localStorage.getItem('mg_best')||0}catch(e){}
function readC(){const s=getComputedStyle(document.documentElement);['bg','panel','ink','mut','line','blk','gold','bad','ok'].forEach(k=>C[k]=s.getPropertyValue('--'+k).trim())}
function fit(){dpr=window.devicePixelRatio||1;W=stage.clientWidth;H=stage.clientHeight;cv.width=W*dpr;cv.height=H*dpr;readC()}
addEventListener('resize',fit);
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',readC);

let S;
function fresh(){S={run:false,score:0,lives:3,combo:0,blocks:[],parts:[],texts:[],spawn:1,goldT:15,shake:0,flash:0,miss:{},wrong:0,solved:0,last:0}}
fresh();
const lvl=()=>Math.min(6,Math.floor(S.score/600));

function gen(gold){
  const L=lvl();
  if(gold){
    if(Math.random()<.5){const a=r(6,12),b=r(6,15);return{txt:a+' × '+b,ans:a*b,op:'×'}}
    const a=r(25,99),b=r(15,a-1);return Math.random()<.5?{txt:a+' + '+b,ans:a+b,op:'+'}:{txt:a+' − '+b,ans:a-b,op:'−'};
  }
  const ops=['+','−'];if(L>=2)ops.push('×');if(L>=3)ops.push('÷');
  const op=ops[r(0,ops.length-1)],mx=L==0?9:L==1?15:20;
  if(op=='+'){const a=r(1,mx),b=r(1,mx);return{txt:a+' + '+b,ans:a+b,op}}
  if(op=='−'){const a=r(2,mx+(L?0:0)),b=r(1,a-1);return{txt:a+' − '+b,ans:a-b,op}}
  const f=L<4?9:12;
  if(op=='×'){const a=r(2,f),b=r(2,f);return{txt:a+' × '+b,ans:a*b,op}}
  const b=r(2,f),q=r(2,f);return{txt:(b*q)+' ÷ '+b,ans:q,op:'÷'};
}
function addBlock(gold){
  const q=gen(gold),w=Math.max(70,Math.min(120,W/5))*(gold?1.2:1),h=w*.62;let x,k=0;
  do{x=r(w/2+4,W-w/2-4);k++}while(k<8&&S.blocks.some(b=>b.y<h*2&&Math.abs(b.x-x)<w));
  S.blocks.push({...q,gold,x,y:-h/2,w,h});
}
function burst(x,y,col){for(let i=0;i<18;i++)S.parts.push({x,y,vx:r(-240,240),vy:r(-320,-40),s:r(4,9),life:.8,col})}
function say(x,y,txt,col){S.texts.push({x,y,txt,col,life:1.1})}

function hud(){
  $('#sc').textContent=S.score;$('#lv').textContent=lvl()+1;$('#bs').textContent=best;
  $('#lives').textContent='■'.repeat(S.lives)+'□'.repeat(3-S.lives);
}
function pts(n){S.score+=n;if(S.score>best){best=S.score;try{localStorage.setItem('mg_best',best)}catch(e){}}}

function submit(){
  if(!S.run)return;
  const v=ans.value.trim();ans.value='';
  if(v===''||isNaN(+v))return;
  const n=+v;
  const gold=S.blocks.find(b=>b.gold&&b.ans===n);
  if(gold){
    S.combo++;
    const others=S.blocks.length-1;
    const g=3*(100+10*Math.min(S.combo,20))+50*others;
    S.blocks.forEach(b=>burst(b.x,b.y,b.gold?C.gold:C.blk));
    S.blocks=[];pts(g);S.solved++;
    S.shake=.5;say(W/2,H/2,'+'+g+' GOLD CLEAR!',C.gold);
    hud();return;
  }
  const m=S.blocks.filter(b=>!b.gold&&b.ans===n).sort((a,b)=>b.y-a.y)[0];
  if(m){
    S.combo++;const p=100+10*Math.min(S.combo-1,20);
    burst(m.x,m.y,C.blk);S.blocks.splice(S.blocks.indexOf(m),1);
    pts(p);S.solved++;S.shake=.25;
    say(m.x,m.y,'+'+p+(S.combo>1?' Combo x'+S.combo+'!':' Combo!'),C.ok);
    hud();
  }else{
    S.combo=0;S.wrong++;S.flash=.7;
    ans.classList.remove('sh');void ans.offsetWidth;ans.classList.add('sh');
  }
}
function lose(b){
  S.miss[b.op]=(S.miss[b.op]||0)+1;S.lives--;S.combo=0;S.flash=1;S.shake=.4;
  burst(b.x,H-14,C.bad);hud();
  if(S.lives<=0)over();
}

function update(dt){
  S.spawn-=dt;if(S.spawn<=0){addBlock(false);S.spawn=Math.max(.9,3-S.score/800)}
  S.goldT-=dt;if(S.goldT<=0){addBlock(true);S.goldT=r(14,20)}
  const sp=Math.min(3.5,1+S.score/1500)*H/12;
  for(const b of S.blocks.slice()){
    b.y+=sp*(b.gold?2.2:1)*dt;
    if(b.y+b.h/2>=H-12){S.blocks.splice(S.blocks.indexOf(b),1);lose(b);if(!S.run)return}
  }
}
function draw(dt){
  cx.setTransform(dpr,0,0,dpr,0,0);cx.fillStyle=C.bg;cx.fillRect(0,0,W,H);
  cx.save();
  if(S.shake>0&&!calm){const a=S.shake*18;cx.translate(r(-a,a),r(-a,a))}
  cx.fillStyle=C.line;cx.fillRect(0,H-12,W,12);
  cx.direction='ltr';cx.textAlign='center';cx.textBaseline='middle';
  for(const b of S.blocks){
    cx.fillStyle=b.gold?C.gold:C.blk;cx.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h);
    if(b.gold){cx.strokeStyle=C.ink;cx.lineWidth=3;cx.strokeRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h)}
    cx.fillStyle=b.gold?'#14161a':'#fff';cx.font='700 '+Math.round(b.w*.25)+'px system-ui,Arial';
    cx.fillText(b.txt,b.x,b.y+1);
  }
  for(const p of S.parts){cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.col;cx.fillRect(p.x,p.y,p.s,p.s)}
  cx.globalAlpha=1;
  for(const t of S.texts){cx.globalAlpha=Math.min(1,t.life);cx.fillStyle=t.col;cx.font='800 22px system-ui,Arial';cx.fillText(t.txt,Math.min(W-90,Math.max(90,t.x)),t.y)}
  cx.globalAlpha=1;cx.restore();
  if(S.flash>0){cx.fillStyle=C.bad;cx.globalAlpha=S.flash*.4;cx.fillRect(0,0,W,H);cx.globalAlpha=1}
}
function step(dt){
  S.shake=Math.max(0,S.shake-dt);S.flash=Math.max(0,S.flash-dt*2.2);
  for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=700*dt;p.life-=dt*1.3}
  S.parts=S.parts.filter(p=>p.life>0);
  for(const t of S.texts){t.y-=60*dt;t.life-=dt}
  S.texts=S.texts.filter(t=>t.life>0);
}
function loop(ts){
  const dt=Math.min(.05,(ts-(S.last||ts))/1000);S.last=ts;
  if(S.run)update(dt);
  step(dt);draw(dt);requestAnimationFrame(loop);
}

function showStart(){
  $('#ovc').innerHTML='<h1>حارس الأرقام والمنطق</h1><p>Math Guardian</p><p>معادلات تسقط من الأعلى. اكتب الإجابة واضغط Enter قبل أن تلمس الأرض. لديك 3 أرواح.</p><p>الكتلة الذهبية أسرع وأصعب، وحلها يعطي 3 أضعاف النقاط ويمسح الشاشة.</p><p>أعلى نتيجة: <b>'+best+'</b></p><button id="play">ابدأ</button>';
  $('#play').onclick=start;$('#ov').classList.remove('hide');$('#play').focus();
}
function over(){
  S.run=false;ans.blur();
  const e=Object.entries(S.miss).sort((a,b)=>b[1]-a[1]),top=e[0];
  const cells=['+','−','×','÷'].map(o=>'<div class="'+(top&&top[0]==o?'top':'')+'"><b>'+(S.miss[o]||0)+'</b>'+NAMES[o]+'</div>').join('');
  $('#ovc').innerHTML='<h1>انتهت اللعبة</h1><div class="big">'+S.score+'</div><p>'+(S.score>=best&&S.score>0?'رقم قياسي جديد!':'أعلى نتيجة: '+best)+'</p>'
   +'<p>معادلات حللتها: '+S.solved+' — إجابات خاطئة: '+S.wrong+'</p>'
   +'<p>'+(top?'أكثر نوع سقط منك: <b>'+NAMES[top[0]]+'</b> ('+top[1]+')':'لم تسقط أي معادلة')+'</p><div id="st">'+cells+'</div><button id="play">Try Again</button>';
  $('#play').onclick=start;$('#ov').classList.remove('hide');$('#play').focus();
}
function start(){fresh();S.run=true;$('#ov').classList.add('hide');hud();ans.value='';ans.focus()}

ans.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
$('#go').onclick=()=>{submit();if(S.run)ans.focus()};
addEventListener('keydown',e=>{if(!S.run&&e.key==='Enter'&&!$('#ov').classList.contains('hide')){const p=$('#play');if(p&&document.activeElement!==p){e.preventDefault();start()}}});
fit();hud();showStart();requestAnimationFrame(loop);
</script>
</body>
</html>
