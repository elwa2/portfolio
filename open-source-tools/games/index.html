<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>مكتبة الألعاب</title>
  <style>
    :root {
      --bg: #0f1026;
      --panel: #1c1f33;
      --card: #24273d;
      --ink: #f4f6fb;
      --mut: #b7bdd8;
      --accent: #7aa2ff;
      --border: rgba(255, 255, 255, .08);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, "Segoe UI", Tahoma, Arial, sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, rgba(122, 162, 255, .12), transparent 55%), var(--bg);
      color: var(--ink);
      line-height: 1.7;
    }

    header {
      text-align: center;
      padding: clamp(24px, 6vw, 64px) 16px 12px;
    }

    header h1 {
      margin: 0;
      font-size: clamp(28px, 6vw, 56px);
    }

    header p {
      margin: 8px 0 0;
      color: var(--mut);
      font-size: clamp(16px, 2vw, 18px);
    }

    main {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 0 clamp(16px, 4vw, 32px) clamp(48px, 10vw, 96px);
      display: grid;
      gap: clamp(16px, 4vw, 24px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: clamp(14px, 3vw, 20px);
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: clamp(18px, 4vw, 26px);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(122, 162, 255, .16) 0%, transparent 70%), var(--card);
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      overflow: hidden;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(122, 162, 255, .18), transparent 55%);
      pointer-events: none;
    }

    .card>* {
      position: relative;
      z-index: 1;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(122, 162, 255, .8);
      box-shadow: 0 30px 60px -40px rgba(122, 162, 255, .9);
    }

    .card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--mut);
      font-size: 14px;
    }

    .title {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
    }

    .desc {
      margin: 0;
      color: var(--mut);
    }

    .cta {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--accent);
      font-weight: 600;
    }

    .empty {
      text-align: center;
      padding: 40px 16px;
      border-radius: 18px;
      border: 1px dashed var(--border);
      color: var(--mut);
      display: none;
      flex-direction: column;
      gap: 8px;
    }

    .empty.show {
      display: flex;
    }

    footer {
      text-align: center;
      padding: 0 16px 40px;
      color: var(--mut);
    }

    code {
      font-family: "Cascadia Code", Consolas, monospace;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>

<body>
  <header>
    <h1>مكتبة الألعاب</h1>
    <p>كل ألعاب مجلد <code>open-source-tools/games</code> في مكان واحد</p>
  </header>
  <main>
    <div class="grid" id="games-grid"></div>
    <div class="empty" id="empty-state">
      <strong>مافيش ألعاب لسه</strong>
      <span>حط ملف <code>.html</code> جديد جوه المجلد وشغل <code>generate-games-list.ps1</code> يظهر تلقائياً</span>
    </div>
  </main>
  <footer>
    <small>يتم التحميل تلقائياً من <code>games-list.json</code> — لو ضفت لعبة جديدة فقط حدّث القائمة</small>
  </footer>

  <script>
    const grid = document.getElementById('games-grid');
    const empty = document.getElementById('empty-state');

    async function loadGames() {
      try {
        const res = await fetch('./games-list.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('فشل تحميل games-list.json');
        const games = await res.json();

        if (!Array.isArray(games) || games.length === 0) {
          empty.classList.add('show');
          return;
        }

        games
          .filter(g => g.file && g.file.toLowerCase().endsWith('.html') && !g.file.toLowerCase().includes('index.html'))
          .forEach(game => {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = game.file;
            card.innerHTML = `
              <span class="eyebrow">لعبة</span>
              <h2 class="title">${game.title || game.file.replace('.html', '')}</h2>
              <p class="desc">${game.desc || 'اضغط للعب مباشرةً'}</p>
              <div class="cta">
                <span>العب الآن</span>
                <span>←</span>
              </div>
            `;
            grid.appendChild(card);
          });

        if (grid.children.length === 0) {
          empty.classList.add('show');
        }
      } catch (err) {
        empty.innerHTML = `
          <strong>تعذر تحميل القائمة</strong>
          <span>تأكد إن <code>games-list.json</code> موجود بجانب <code>index.html</code></span>
        `;
        empty.classList.add('show');
        console.error(err);
      }
    }

    loadGames();
  </script>
</body>

</html>
