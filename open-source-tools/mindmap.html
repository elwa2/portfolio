<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>خريطة الأفكار الذهنية 🧠</title>
  <meta name="description" content="ارسم خرائط ذهنية تفاعلية: عقد ومنحنيات، تحرير فوري، ترتيب تلقائي، حفظ وتصدير PNG/SVG/JSON." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ===== أساسيات + ثيم داكن/فاتح ===== */
    *{ margin:0; padding:0; box-sizing:border-box; }
    :root{
      --bg:#101018; --panel:#1b1b26; --panel2:#262633; --line:rgba(255,255,255,.1);
      --txt:#eceaf4; --mut:#9a9aa8; --acc:#8b7cf6; --acc2:#6c5ce7;
      --grid:rgba(255,255,255,.05); --edge:#8f8fa3;
    }
    [data-theme="light"]{
      --bg:#f4f4f8; --panel:#ffffff; --panel2:#eceaf2; --line:rgba(20,20,40,.12);
      --txt:#23283a; --mut:#6a7085; --acc:#6c5ce7; --acc2:#5b4bd6;
      --grid:rgba(20,20,60,.07); --edge:#7a7a90;
    }
    html,body{ height:100%; }
    body{
      font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;
      background:var(--bg); color:var(--txt);
      height:100vh; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    }
    .hidden{ display:none !important; }
    /* ===== الشريط العلوي ===== */
    #topbar{
      display:flex; align-items:center; gap:8px; padding:8px 12px;
      background:var(--panel); border-bottom:1px solid var(--line);
      overflow-x:auto; flex:0 0 auto; scrollbar-width:thin; white-space:nowrap;
    }
    #topbar .brand{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:6px; flex:0 0 auto; }
    .tb{ border:1px solid var(--line); background:var(--panel2); color:var(--txt);
      border-radius:10px; padding:7px 12px; font-family:inherit; font-size:13px; font-weight:600;
      cursor:pointer; display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; transition:.15s; }
    .tb:hover{ border-color:var(--acc); transform:translateY(-1px); }
    .tb.on{ background:var(--acc2); border-color:transparent; color:#fff; }
    .tb:disabled{ opacity:.35; cursor:default; transform:none; }
    .tb.danger{ color:#ff8a8a; border-color:rgba(255,90,90,.4); }
    .seg{ display:inline-flex; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; flex:0 0 auto; }
    .seg button{ border:none; background:transparent; color:var(--txt); border-radius:7px; padding:6px 10px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; }
    .seg button.on{ background:var(--acc2); color:#fff; }
    .tsep{ width:1px; align-self:stretch; background:var(--line); flex:0 0 auto; margin:2px 0; }
    /* ===== منطقة اللوحة ===== */
    #wrap{ position:relative; flex:1; min-height:0; overflow:hidden;
      background-image:radial-gradient(var(--grid) 1.2px, transparent 1.2px);
      background-size:26px 26px; }
    #stage{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
    #handles{ position:absolute; inset:0; pointer-events:none; z-index:6; }
    .hbtn{ position:absolute; width:40px; height:40px; margin:-20px 0 0 -20px; border-radius:50%;
      border:2px solid #fff; background:var(--acc2); color:#fff; font-size:22px; font-weight:700; line-height:1;
      cursor:pointer; pointer-events:auto; display:grid; place-items:center;
      box-shadow:0 4px 14px rgba(0,0,0,.45); font-family:inherit; }
    .hbtn:active{ transform:scale(.92); }
    /* ===== لوحة العقدة المحددة ===== */
    #selpanel{ position:absolute; bottom:14px; left:50%; transform:translateX(-50%); z-index:7;
      display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
      border-radius:14px; padding:8px 12px; box-shadow:0 10px 30px rgba(0,0,0,.45); max-width:94vw; overflow-x:auto; }
    .cdot{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex:0 0 auto; padding:0; }
    .cdot.on{ border-color:#fff; }
    /* ===== محرر النص ===== */
    #editor{ position:absolute; z-index:8; background:var(--panel); border:2px solid var(--acc);
      border-radius:10px; padding:6px 8px; font-family:inherit; font-size:15px; color:var(--txt);
      outline:none; resize:none; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.5); }
    /* ===== تلميح ===== */
    #hint{ position:absolute; top:10px; right:12px; z-index:5; font-size:11px; color:var(--mut);
      background:color-mix(in srgb, var(--panel) 82%, transparent); border:1px solid var(--line);
      padding:5px 12px; border-radius:999px; pointer-events:none; }
    /* ===== عقد SVG ===== */
    .node{ cursor:grab; }
    .node text{ font-family:"Cairo","Segoe UI",Tahoma,sans-serif; pointer-events:none; user-select:none; }
    @media(max-width:640px){
      .tb{ padding:8px 10px; font-size:12px; }
      #hint{ display:none; }
    }
  </style>
</head>
<body>
  <!-- ===== الشريط العلوي: أدوات الصفحة ===== -->
  <header id="topbar">
    <span class="brand">🧠 <span id="brandName">خريطة الأفكار</span></span>
    <span class="tsep"></span>
    <button class="tb" id="addRootBtn" title="فكرة جديدة حرة في نص الشاشة">⊕ فكرة</button>
    <div class="seg" id="shapeSeg" title="شكل العقد الجديدة">
      <button data-nshape="circle" class="on">○ دائرة</button>
      <button data-nshape="round">▢ مربع</button>
    </div>
    <div class="seg" id="edgeSeg" title="شكل الأسهم">
      <button data-edge="curve" class="on">〰 منحني</button>
      <button data-edge="line">╲ مستقيم</button>
    </div>
    <button class="tb on" id="arrowBtn" title="إظهار/إخفاء رؤوس الأسهم">➤ سهم</button>
    <span class="tsep"></span>
    <button class="tb" id="undoBtn" title="تراجع Ctrl+Z">↩</button>
    <button class="tb" id="redoBtn" title="إعادة Ctrl+Shift+Z">↪</button>
    <button class="tb" id="layoutBtn" title="ترتيب تلقائي على شكل شجرة">🌳 ترتيب</button>
    <button class="tb" id="fitBtn" title="ملاءمة العرض">⤢</button>
    <span class="tsep"></span>
    <button class="tb" id="pngBtn" title="تصدير صورة">PNG</button>
    <button class="tb" id="svgBtn" title="تصدير فيكتور">SVG</button>
    <button class="tb" id="jsonBtn" title="تصدير نسخة احتياطية">JSON</button>
    <button class="tb" id="importBtn" title="استيراد نسخة">📁</button>
    <button class="tb danger" id="clearBtn" title="مسح كل الخريطة">🗑</button>
    <button class="tb" id="themeBtn" title="ليلي / نهاري">🌙</button>
  </header>

  <!-- ===== اللوحة ===== -->
  <main id="wrap">
    <svg id="stage">
      <defs>
        <filter id="nsh" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
        </filter>
      </defs>
      <rect id="bgrect" x="-100000" y="-100000" width="200000" height="200000" fill="transparent"></rect>
      <g id="vp"><g id="edges"></g><g id="nodes"></g></g>
    </svg>
    <div id="handles"></div>
    <div id="selpanel" class="hidden">
      <div class="seg" id="selShapeSeg">
        <button data-nshape="circle">○</button>
        <button data-nshape="round">▢</button>
      </div>
      <span id="selDots" style="display:flex;gap:6px"></span>
      <button class="tb danger" id="delNodeBtn" title="حذف العقدة (Delete)">🗑</button>
    </div>
    <div id="hint">اسحب الخلفية للتحريك • العجلة للزوم • مرر على عقدة لإضافة فروع +</div>
  </main>
  <input type="file" id="importFile" accept=".json" hidden />

<script>
(()=>{ "use strict";
/* ---------- أدوات مساعدة ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const LS="mindmap-v1"; // مفتاح الحفظ
const PALETTE=["#4dabf7","#69db7c","#ffa94d","#ff8787","#b197fc","#63e6be","#e599f7","#ffd43b"]; // ألوان هادية
const DIRS={top:{dx:0,dy:-1},bottom:{dx:0,dy:1},left:{dx:-1,dy:0},right:{dx:1,dy:0}}; // اتجاهات الجوانب
const OPP={top:"bottom",bottom:"top",left:"right",right:"left"}; // الجهة المقابلة

/* ---------- الحالة ---------- */
let state=null; // {nodes,edges,next,opts{shape,curve,arrows},uiColor,theme}
let cam={x:0,y:0,z:1}; // الكاميرا: إزاحة + زوم
let selId=null, hoverId=null; // المحدد / الواقف عليه الماوس
let undoStack=[], redoStack=[]; // التراجع
let dragNode=null, panning=null, pinch=null; // أوضاع التفاعل
const pointers=new Map(); // مؤشرات اللمس النشطة

/* ---------- عناصر SVG ---------- */
const stage=$("#stage"), vp=$("#vp"), gE=$("#edges"), gN=$("#nodes"),
      handles=$("#handles"), selpanel=$("#selpanel");

/* ---------- حفظ/تحميل ---------- */
function save(){ try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){} }
function blankState(){
  return {nodes:[],edges:[],next:1,opts:{shape:"circle",curve:true,arrows:true},
          uiColor:PALETTE[0],theme:document.documentElement.dataset.theme||"dark"};
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(LS));
    if(d&&Array.isArray(d.nodes)){ state=d; state.next=d.next||1;
      state.opts=Object.assign({shape:"circle",curve:true,arrows:true},d.opts);
      state.uiColor=d.uiColor||PALETTE[0]; return; }
  }catch(e){}
  state=blankState();
}
function N(id){ return state.nodes.find(n=>n.id===id); } // عقدة بالـ id
function uid(p){ return p+(state.next++); }
function snapshot(){ return JSON.stringify({nodes:state.nodes,edges:state.edges,next:state.next}); }
function pushUndo(){ undoStack.push(snapshot()); if(undoStack.length>60)undoStack.shift(); redoStack.length=0; syncUndo(); }
function applySnap(s){ const d=JSON.parse(s); state.nodes=d.nodes; state.edges=d.edges; state.next=d.next;
  if(selId&&!N(selId))selId=null; sizeCache.clear(); save(); renderAll(); }
function undo(){ if(!undoStack.length)return; redoStack.push(snapshot()); applySnap(undoStack.pop()); syncUndo(); }
function redo(){ if(!redoStack.length)return; undoStack.push(snapshot()); applySnap(redoStack.pop()); syncUndo(); }
function syncUndo(){ $("#undoBtn").disabled=!undoStack.length; $("#redoBtn").disabled=!redoStack.length; }

/* ---------- قياس النص وحجم العقد ---------- */
const mctx=document.createElement("canvas").getContext("2d");
const sizeCache=new Map(); // id+text -> {w,h,r}
function nodeSize(n){
  const key=n.id+"|"+n.shape+"|"+(n.text||"");
  let s=sizeCache.get(key);
  if(!s){
    mctx.font="600 15px Cairo, Tahoma, sans-serif";
    const lines=String(n.text||"فكرة").split("\n");
    let tw=0; lines.forEach(l=>{tw=Math.max(tw,mctx.measureText(l||" ").width)});
    const w=Math.max(104,tw+60), h=Math.max(60,lines.length*23+40);
    s={w,h,r:Math.max(48,Math.max(w,h)/2)};
    sizeCache.set(key,s);
  }
  return s;
}
function nodeRadius(n){ const s=nodeSize(n); return n.shape==="circle"?s.r:(Math.hypot(s.w,s.h)/2); }
// لون النص حسب لون العقدة (تباين)
function ink(hex){
  let c=String(hex||"#4dabf7").replace("#","");
  if(c.length===3)c=c.split("").map(x=>x+x).join("");
  const v=parseInt(c,16); const L=(0.299*(v>>16&255)+0.587*(v>>8&255)+0.114*(v&255))/255;
  return L>0.62?"#232838":"#ffffff";
}
// نقطة على حافة الشكل باتجاه جهة معينة (مش المركز)
function anchor(n,side){
  const s=nodeSize(n);
  if(n.shape==="circle"){ const d=DIRS[side]; return {x:n.x+d.dx*s.r, y:n.y+d.dy*s.r}; }
  const hw=s.w/2, hh=s.h/2;
  if(side==="top")return{x:n.x,y:n.y-hh};
  if(side==="bottom")return{x:n.x,y:n.y+hh};
  if(side==="left")return{x:n.x-hw,y:n.y};
  return{x:n.x+hw,y:n.y};
}

/* ---------- الرسم ---------- */
function edgePath(e){
  const a=N(e.from), b=N(e.to);
  if(!a||!b)return "";
  const p1=anchor(a,e.fromSide||"right"), p2=anchor(b,e.toSide||"left");
  if(!state.opts.curve)return "M "+p1.x+" "+p1.y+" L "+p2.x+" "+p2.y;
  const n1=DIRS[e.fromSide||"right"], n2=DIRS[e.toSide||"left"];
  const len=Math.max(40,Math.hypot(p2.x-p1.x,p2.y-p1.y)*0.45);
  return "M "+p1.x+" "+p1.y+" C "+(p1.x+n1.dx*len)+" "+(p1.y+n1.dy*len)+
         " "+(p2.x+n2.dx*len)+" "+(p2.y+n2.dy*len)+" "+p2.x+" "+p2.y;
}
// رأس سهم مرسوم يدويًا بنفس لون الخط
function arrowHead(p1,p2,color){
  const ang=Math.atan2(p2.y-p1.y,p2.x-p1.x), L=11, s=0.42;
  const q1={x:p2.x-L*Math.cos(ang-s),y:p2.y-L*Math.sin(ang-s)};
  const q2={x:p2.x-L*Math.cos(ang+s),y:p2.y-L*Math.sin(ang+s)};
  return "M "+q1.x+" "+q1.y+" L "+p2.x+" "+p2.y+" L "+q2.x+" "+q2.y;
}
function renderEdges(){
  let h="";
  state.edges.forEach(e=>{
    const a=N(e.from); if(!a)return;
    const d=edgePath(e); if(!d)return;
    const col=a.color||"#8f8fa3";
    h+='<path d="'+d+'" fill="none" stroke="'+esc(col)+'" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>';
    if(state.opts.arrows){ // مماس النهاية لرأس السهم
      const b=N(e.to); const p2=anchor(b,e.toSide||"left");
      let p0;
      if(!state.opts.curve){ const p1=anchor(a,e.fromSide||"right"); p0=p1; }
      else{ const n2=DIRS[e.toSide||"left"]; p0={x:p2.x-n2.dx*20,y:p2.y-n2.dy*20}; }
      h+='<path d="'+arrowHead(p0,p2,col)+'" fill="none" stroke="'+esc(col)+'" stroke-width="2.5" stroke-linecap="round"/>';
    }
  });
  gE.innerHTML=h;
}
function renderNodes(){
  let h="";
  state.nodes.forEach(n=>{
    const s=nodeSize(n), col=n.color||"#4dabf7", fg=ink(col);
    const cls="node"+(n.id===selId?" sel":"");
    h+='<g class="'+cls+'" data-node="'+n.id+'" transform="translate('+n.x+' '+n.y+')">';
    if(n.shape==="circle"){
      h+='<circle r="'+s.r+'" fill="'+esc(col)+'" stroke="'+(n.id===selId?"#ffffff":esc(col))+'" stroke-width="'+(n.id===selId?3:0)+'" filter="url(#nsh)"/>';
    }else{
      h+='<rect x="'+(-s.w/2)+'" y="'+(-s.h/2)+'" width="'+s.w+'" height="'+s.h+'" rx="16" fill="'+esc(col)+'" stroke="'+(n.id===selId?"#ffffff":esc(col))+'" stroke-width="'+(n.id===selId?3:0)+'" filter="url(#nsh)"/>';
    }
    const lines=String(n.text==null||n.text===""?"فكرة":n.text).split("\n");
    const tot=(lines.length-1)*23;
    h+='<text text-anchor="middle" font-size="15" font-weight="600" fill="'+fg+'">';
    lines.forEach((ln,i)=>{ h+='<tspan x="0" dy="'+(i===0?(-tot/2):23)+'" dominant-baseline="central">'+esc(ln||" ")+"</tspan>"; });
    h+="</text></g>";
  });
  gN.innerHTML=h;
}
// أزرار + حول العقدة النشطة (hover أو محددة)
function renderHandles(){
  const id=hoverId||selId;
  const n=id&&N(id);
  if(!n||dragNode){ handles.innerHTML=""; return; }
  const s=nodeSize(n);
  const pts=n.shape==="circle"
    ? {top:[n.x,n.y-s.r],bottom:[n.x,n.y+s.r],left:[n.x-s.r,n.y],right:[n.x+s.r,n.y]}
    : {top:[n.x,n.y-s.h/2],bottom:[n.x,n.y+s.h/2],left:[n.x-s.w/2,n.y],right:[n.x+s.w/2,n.y]};
  let h="";
  Object.keys(pts).forEach(side=>{
    const sc=toScreen(pts[side][0],pts[side][1]);
    h+='<button class="hbtn" data-add="'+n.id+'|'+side+'" style="left:'+sc.x+'px;top:'+sc.y+'px" title="فرع جديد '+side+'">+</button>';
  });
  handles.innerHTML=h;
}
function renderPanel(){
  const n=selId&&N(selId);
  selpanel.classList.toggle("hidden",!n);
  if(!n)return;
  [...selpanel.querySelectorAll("#selShapeSeg button")].forEach(b=>b.classList.toggle("on",b.dataset.nshape===n.shape));
  [...selpanel.querySelectorAll(".cdot")].forEach(b=>b.classList.toggle("on",b.dataset.c===n.color));
}
function renderAll(){ renderEdges(); renderNodes(); renderHandles(); renderPanel(); syncTop(); }
function syncTop(){
  [...document.querySelectorAll("#shapeSeg button")].forEach(b=>b.classList.toggle("on",b.dataset.nshape===state.opts.shape));
  [...document.querySelectorAll("#edgeSeg button")].forEach(b=>{
    const curve=b.dataset.edge==="curve";
    b.classList.toggle("on",curve?state.opts.curve:!state.opts.curve);
  });
  $("#arrowBtn").classList.toggle("on",!!state.opts.arrows);
  syncUndo();
}

/* ---------- الكاميرا: تحويل/زوم/ملاءمة ---------- */
function applyView(){ vp.setAttribute("transform","translate("+cam.x+" "+cam.y+") scale("+cam.z+")"); renderHandles(); }
function toScreen(x,y){ return {x:x*cam.z+cam.x, y:y*cam.z+cam.y}; } // إحداثيات بالنسبة للوحة (لتموضع الأزرار والمحرر)
function toWorld(px,py){ const r=stage.getBoundingClientRect(); return {x:(px-r.left-cam.x)/cam.z, y:(py-r.top-cam.y)/cam.z}; }
function zoomAt(cx,cy,f){
  const w=toWorld(cx,cy);
  cam.z=Math.min(3,Math.max(0.25,cam.z*f));
  const r=stage.getBoundingClientRect();
  cam.x=cx-r.left-w.x*cam.z; cam.y=cy-r.top-w.y*cam.z;
  applyView();
}
function fitView(){
  if(!state.nodes.length)return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  state.nodes.forEach(n=>{ const s=nodeSize(n);
    const rx=n.shape==="circle"?s.r:s.w/2, ry=n.shape==="circle"?s.r:s.h/2;
    x1=Math.min(x1,n.x-rx);y1=Math.min(y1,n.y-ry);x2=Math.max(x2,n.x+rx);y2=Math.max(y2,n.y+ry); });
  const r=stage.getBoundingClientRect(), pad=140;
  const z=Math.min(1.4,Math.max(0.25,Math.min((r.width-pad*2)/Math.max(1,x2-x1),(r.height-pad*2)/Math.max(1,y2-y1))));
  cam.z=z; cam.x=r.width/2-(x1+x2)/2*z; cam.y=r.height/2-(y1+y2)/2*z;
  applyView();
}

/* ---------- إضافة فرع + منع التراكب ---------- */
function collides(x,y,r,selfId){
  return state.nodes.some(n=>{
    if(n.id===selfId)return false;
    const nr=nodeRadius(n);
    return Math.hypot(n.x-x,n.y-y)<nr+r;
  });
}
function findFree(x,y,r){ // أقرب مكان فاضي (دوائر متوسعة)
  if(!collides(x,y,r))return{x,y};
  for(let d=70;d<=700;d+=50){
    for(let k=0;k<8;k++){
      const a=k/8*Math.PI*2;
      const nx=x+Math.cos(a)*d, ny=y+Math.sin(a)*d*0.8;
      if(!collides(nx,ny,r))return{x:nx,y:ny};
    }
  }
  return{x,y:y+700};
}
function addChild(pid,side){
  const p=N(pid); if(!p)return;
  pushUndo();
  const ps=nodeSize(p), dir=DIRS[side], gap=120;
  const guessR=70;
  const spot=findFree(p.x+dir.dx*(nodeRadius(p)+gap),p.y+dir.dy*(nodeRadius(p)+gap),guessR);
  const node={id:uid("n"),x:Math.round(spot.x),y:Math.round(spot.y),text:"",
              shape:state.opts.shape,color:state.uiColor};
  state.nodes.push(node);
  state.edges.push({id:uid("e"),from:pid,to:node.id,fromSide:side,toSide:OPP[side]});
  save(); renderAll();
  openEditor(node.id,true); // تحرير فوري للجديدة
}

/* ---------- محرر النص فوق العقدة ---------- */
let editorEl=null, editorId=null, editorIsNew=false, editorChanged=false;
function openEditor(id,isNew){
  closeEditor(true);
  const n=N(id); if(!n)return;
  selId=id; renderAll();
  const s=nodeSize(n);
  const hw=n.shape==="circle"?s.r:s.w/2, hh=n.shape==="circle"?s.r:s.h/2;
  const scx=(n.x*cam.z+cam.x), scy=(n.y*cam.z+cam.y);
  const ta=document.createElement("textarea");
  ta.id="editor"; ta.setAttribute("dir","auto"); ta.placeholder="اكتب الفكرة...";
  ta.value=n.text||"";
  ta.style.left=(scx-hw*cam.z-8)+"px";
  ta.style.top=(scy-hh*cam.z-8)+"px";
  ta.style.width=(hw*2*cam.z+16)+"px";
  ta.style.height=Math.max(70,(hh*2*cam.z+16))+"px";
  $("#wrap").appendChild(ta); ta.focus();
  editorEl=ta; editorId=id; editorIsNew=!!isNew; editorChanged=false;
  ta.oninput=()=>{editorChanged=true};
  ta.onkeydown=ev=>{
    if(ev.key==="Escape"){ev.preventDefault();cancelEditor();return}
    if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();commitEditor()}
  };
  ta.onblur=()=>{ if(editorEl===ta)commitEditor(); };
}
function finishEditorEl(){ if(editorEl&&editorEl.isConnected)editorEl.remove(); editorEl=null;editorId=null; }
function commitEditor(){
  const ta=editorEl,id=editorId,nw=editorIsNew;
  if(!ta){finishEditorEl();return}
  const n=id&&N(id);
  const v=ta.value.trim();
  finishEditorEl();
  if(!n)return;
  if(v===""&&nw){ // جديدة فاضية ملغية: احذفها بهدوء
    state.nodes=state.nodes.filter(x=>x.id!==id);
    state.edges=state.edges.filter(e=>e.from!==id&&e.to!==id);
    if(selId===id)selId=null;
    save(); renderAll(); return;
  }
  if(v===(n.text||""))return;
  pushUndo(); n.text=v; sizeCache.clear(); save(); renderAll();
}
function cancelEditor(){
  const id=editorId,nw=editorIsNew;
  finishEditorEl();
  if(nw&&id){ const n=N(id); // إلغاء الجديدة الفاضية يحذفها
    if(n&&!(n.text||"")){ state.nodes=state.nodes.filter(x=>x.id!==id);
      state.edges=state.edges.filter(e=>e.from!==id&&e.to!==id);
      if(selId===id)selId=null; save(); renderAll(); } }
}
function closeEditor(commit){ if(!editorEl)return; if(commit)commitEditor(); else cancelEditor(); }

/* ---------- سحب عقدة / تحريك خلفية / قرصة ---------- */
stage.addEventListener("pointerdown",e=>{
  stage.setPointerCapture&&e.pointerId!=null&&stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2){ // بدء قرصة: أوقف أي سحب
    const pts=[...pointers.values()];
    pinch={d:Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y),z:cam.z,
           mx:(pts[0].x+pts[1].x)/2,my:(pts[0].y+pts[1].y)/2,cx:cam.x,cy:cam.y};
    if(dragNode&&dragNode.moved)save();
    dragNode=null; panning=null; return;
  }
  closeEditor(true);
  const g=e.target.closest?e.target.closest("[data-node]"):null;
  if(g&&e.button!==1){
    const id=g.dataset.node, n=N(id);
    if(n){ dragNode={id,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false,pushed:false}; return; }
  }
  if(e.button===1||!g){ panning={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y}; stage.style.cursor="grabbing"; }
});
stage.addEventListener("pointermove",e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){ // قرصة للتكبير حول نقطة المنتصف
    const pts=[...pointers.values()];
    const d=Math.max(1,Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y));
    const mx=(pts[0].x+pts[1].x)/2, my=(pts[0].y+pts[1].y)/2;
    const w=toWorld(pinch.mx,pinch.my);
    cam.z=Math.min(3,Math.max(0.25,pinch.z*d/pinch.d));
    const r=stage.getBoundingClientRect();
    cam.x=mx-r.left-w.x*cam.z; cam.y=my-r.top-w.y*cam.z;
    applyView(); return;
  }
  if(dragNode){
    const dx=(e.clientX-dragNode.sx)/cam.z, dy=(e.clientY-dragNode.sy)/cam.z;
    if(!dragNode.moved&&Math.hypot(e.clientX-dragNode.sx,e.clientY-dragNode.sy)>5)dragNode.moved=true;
    if(dragNode.moved){
      if(!dragNode.pushed){pushUndo();dragNode.pushed=true}
      const n=N(dragNode.id);
      if(n){n.x=Math.round(dragNode.ox+dx);n.y=Math.round(dragNode.oy+dy);renderEdges();renderNodes();renderHandles()}
    }
    return;
  }
  if(panning){ cam.x=panning.cx+(e.clientX-panning.sx); cam.y=panning.cy+(e.clientY-panning.sy); applyView(); }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinch=null;
  if(dragNode){
    const wasMoved=dragNode.moved, id=dragNode.id;
    dragNode=null;
    if(wasMoved){save();renderAll()}
    else{ // ضغطة بدون سحب = تحديد (وإظهار +)
      selId=id; renderAll();
    }
    return;
  }
  if(panning){
    const moved=Math.hypot(e.clientX-panning.sx,e.clientY-panning.sy)>4;
    panning=null; stage.style.cursor="grab";
    if(!moved){ selId=null; renderAll(); } // ضغطة خلفية = إلغاء التحديد
    return;
  }
}
stage.addEventListener("pointerup",endPointer);
stage.addEventListener("pointercancel",endPointer);
// العجلة = زوم عند المؤشر (وإلغاء زوم الصفحة)
stage.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.12:1/1.12)},{passive:false});
// مرور الماوس يظهر أزرار +
gN.addEventListener("pointerover",e=>{
  const g=e.target.closest?e.target.closest("[data-node]"):null;
  const id=g&&g.dataset.node;
  if(id!==hoverId){hoverId=id||null;renderHandles()}
});
gN.addEventListener("pointerout",e=>{
  const g=e.target.closest?e.target.closest("[data-node]"):null;
  if(!g)return;
  if(g.contains&&e.relatedTarget&&g.contains(e.relatedTarget))return; // تنقل داخلي
  clearHoverSoon(); // مهلة قبل الإخفاء عشان تلحق تدوس +
});
let hoverTimer=null;
function clearHoverSoon(){
  clearTimeout(hoverTimer);
  hoverTimer=setTimeout(()=>{hoverTimer=null;hoverId=null;renderHandles()},800);
}
handles.addEventListener("pointerover",()=>{clearTimeout(hoverTimer);hoverTimer=null});
// دبل كليك = تحرير النص
stage.addEventListener("dblclick",e=>{
  const g=e.target.closest?e.target.closest("[data-node]"):null;
  if(g&&g.dataset.node){e.preventDefault();openEditor(g.dataset.node,false)}
});
// أزرار + (تفويض حدث واحد)
handles.addEventListener("pointerdown",e=>e.stopPropagation());
handles.addEventListener("click",e=>{
  const b=e.target.closest?e.target.closest("[data-add]"):null;
  if(!b)return;
  e.stopPropagation();
  const parts=(b.dataset.add||"").split("|");
  if(parts.length===2)addChild(parts[0],parts[1]);
});

/* ---------- حذف عقدة (مع فروعها) ---------- */
function deleteSelected(){
  const n=selId&&N(selId);
  if(!n)return;
  const kids=state.edges.filter(e=>e.from===n.id).length;
  if(kids>0&&!confirm("العقدة دي عندها "+kids+" فروع — حذفها هيمسح الفروع المتصلة بيها. متأكد؟"))return;
  pushUndo();
  state.nodes=state.nodes.filter(x=>x.id!==n.id);
  state.edges=state.edges.filter(e=>e.from!==n.id&&e.to!==n.id);
  selId=null; save(); renderAll();
}

/* ---------- لوحة العقدة المحددة: شكل + لون + حذف ---------- */

  const wrap=$("#selDots");
  PALETTE.forEach(c=>{

/* ---------- الشريط العلوي ---------- */

  if(!b)return;

$("#edgeSeg").addEventListener("click",e=>{
  const b=e.target.closest?e.target.closest("[data-edge]"):null;
  if(!b)return;
  state.opts.curve=(b.dataset.edge==="curve");save();renderAll();
});
$("#arrowBtn").onclick=()=>{state.opts.arrows=!state.opts.arrows;save();renderAll()};
$("#addRootBtn").onclick=()=>{
  pushUndo();
  const r=stage.getBoundingClientRect();
  const c=toWorld(r.left+r.width/2,r.top+r.height/2);
  const node={id:uid("n"),x:Math.round(c.x),y:Math.round(c.y),text:"",shape:state.opts.shape,color:state.uiColor};
  const spot=findFree(node.x,node.y,70);
  node.x=Math.round(spot.x);node.y=Math.round(spot.y);
  state.nodes.push(node);
  save();renderAll();openEditor(node.id,true);
};
$("#undoBtn").onclick=undo;$("#redoBtn").onclick=redo;
$("#fitBtn").onclick=fitView;
$("#layoutBtn").onclick=autoLayout;
$("#pngBtn").onclick=exportPNG;
$("#svgBtn").onclick=exportSVG;
$("#jsonBtn").onclick=downloadJSON;
$("#importBtn").onclick=()=>$("#importFile").click();
$("#importFile").onchange=importJSON;
$("#clearBtn").onclick=()=>{
  if(!state.nodes.length)return;
  if(!confirm("مسح كل الخريطة والبدء من جديد؟"))return;
  pushUndo();
  state.nodes=[];state.edges=[];selId=null;hoverId=null;
  seedRoot();save();renderAll();fitView();
};
$("#themeBtn").onclick=()=>{
  const root=document.documentElement;
  const next=(root.dataset.theme==="light")?"dark":"light";
  root.dataset.theme=next;state.theme=next;
  $("#themeBtn").textContent=next==="light"?"☀":"🌙";
  save();
};

/* ---------- ترتيب تلقائي على شكل شجرة ---------- */
function autoLayout(){
  if(!state.nodes.length)return;
  pushUndo();
  const kids={};state.nodes.forEach(n=>kids[n.id]=[]);
  state.edges.forEach(e=>{if(kids[e.from])kids[e.from].push(e.to)});
  const hasIn={};state.edges.forEach(e=>{hasIn[e.to]=true});
  let roots=state.nodes.filter(n=>!hasIn[n.id]);
  if(!roots.length)roots=[state.nodes[0]];
  const W=300,H=130,visited={};
  let slot=0;
  function place(id,depth){
    if(visited[id])return null;visited[id]=true;
    const ch=(kids[id]||[]).filter(c=>!visited[c]);
    const ys=ch.map(c=>place(c,depth+1)).filter(v=>v!==null);
    const n=N(id);
    const y=ys.length?ys.reduce((a,b)=>a+b,0)/ys.length:(slot++*H);
    n.x=depth*W;n.y=Math.round(y);
    return y;
  }
  roots.forEach((r,i)=>{if(i>0)slot+=1;place(r.id,0)});
  state.edges.forEach(e=>{e.fromSide="right";e.toSide="left"});
  const r0=N(roots[0].id); // تصفير الإحداثيات حول الجذر
  if(r0){const dx=r0.x,dy=r0.y;state.nodes.forEach(n=>{n.x-=dx;n.y-=dy})}
  save();renderAll();fitView();
}

/* ---------- تصدير مستقل (SVG/PNG) ---------- */
function contentBox(){
  if(!state.nodes.length)return{x:-400,y:-300,w:800,h:600};
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  state.nodes.forEach(n=>{const s=nodeSize(n);
    const rx=n.shape==="circle"?s.r:s.w/2, ry=n.shape==="circle"?s.r:s.h/2;
    x1=Math.min(x1,n.x-rx);y1=Math.min(y1,n.y-ry);x2=Math.max(x2,n.x+rx);y2=Math.max(y2,n.y+ry)});
  return{x:x1,y:y1,w:x2-x1,h:y2-y1};
}
function buildStandaloneSVG(){
  const box=contentBox(),pad=60;
  const W=Math.ceil(box.w+pad*2),H=Math.ceil(box.h+pad*2);
  const ox=box.x-pad,oy=box.y-pad;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("xmlns",NS);
  svg.setAttribute("width",W);svg.setAttribute("height",H);
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  const bgR=document.createElementNS(NS,"rect");
  bgR.setAttribute("width","100%");bgR.setAttribute("height","100%");
  bgR.setAttribute("fill",getComputedStyle(document.body).backgroundColor);
  svg.appendChild(bgR);
  const vp2=document.createElementNS(NS,"g");
  vp2.setAttribute("transform","translate("+(-ox)+" "+(-oy)+")");
  state.edges.forEach(e=>{
    const a=N(e.from);if(!a)return;
    const d=edgePath(e);if(!d)return;
    const col=a.color||"#8f8fa3";
    const p=document.createElementNS(NS,"path");
    p.setAttribute("d",d);p.setAttribute("fill","none");p.setAttribute("stroke",col);
    p.setAttribute("stroke-width","2.5");p.setAttribute("stroke-linecap","round");p.setAttribute("opacity","0.85");
    vp2.appendChild(p);
    if(state.opts.arrows){
      const b=N(e.to);const p2=anchor(b,e.toSide||"left");
      let p0;
      if(!state.opts.curve){const p1=anchor(a,e.fromSide||"right");p0=p1}
      else{const n2=DIRS[e.toSide||"left"];p0={x:p2.x-n2.dx*20,y:p2.y-n2.dy*20}}
      const ah=document.createElementNS(NS,"path");
      ah.setAttribute("d",arrowHead(p0,p2,col));ah.setAttribute("fill","none");
      ah.setAttribute("stroke",col);ah.setAttribute("stroke-width","2.5");ah.setAttribute("stroke-linecap","round");
      vp2.appendChild(ah);
    }
  });
  state.nodes.forEach(n=>{
    const s=nodeSize(n),col=n.color||"#4dabf7",fg=ink(col);
    const g=document.createElementNS(NS,"g");
    g.setAttribute("transform","translate("+n.x+" "+n.y+")");
    if(n.shape==="circle"){
      const c=document.createElementNS(NS,"circle");
      c.setAttribute("r",s.r);c.setAttribute("fill",col);
      g.appendChild(c);
    }else{
      const r2=document.createElementNS(NS,"rect");
      r2.setAttribute("x",-s.w/2);r2.setAttribute("y",-s.h/2);
      r2.setAttribute("width",s.w);r2.setAttribute("height",s.h);r2.setAttribute("rx",16);
      r2.setAttribute("fill",col);g.appendChild(r2);
    }
    const lines=String(n.text==null||n.text===""?"فكرة":n.text).split("\n");
    const tot=(lines.length-1)*23;
    const t=document.createElementNS(NS,"text");
    t.setAttribute("text-anchor","middle");t.setAttribute("font-size","15");
    t.setAttribute("font-weight","600");t.setAttribute("fill",fg);
    t.setAttribute("font-family","Cairo, Tahoma, sans-serif");
    lines.forEach((ln,i)=>{
      const ts=document.createElementNS(NS,"tspan");
      ts.setAttribute("x","0");ts.setAttribute("dy",i===0?(-tot/2):23);
      ts.setAttribute("dominant-baseline","central");
      ts.textContent=ln||" ";
      t.appendChild(ts);
    });
    g.appendChild(t);
    vp2.appendChild(g);
  });
  svg.appendChild(vp2);
  return{svg,w:W,h:H};
}
function exportPNG(){
  if(!state.nodes.length){alert("الخريطة فاضية");return}
  const built=buildStandaloneSVG();
  const xml=new XMLSerializer().serializeToString(built.svg);
  const url=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml;charset=utf-8"}));
  const img=new Image();
  img.onload=()=>{
    const sc=2,c=document.createElement("canvas");
    c.width=built.w*sc;c.height=built.h*sc;
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");a.download="mindmap.png";a.href=c.toDataURL("image/png");a.click();
  };
  img.onerror=()=>{URL.revokeObjectURL(url);alert("تعذر إنشاء الصورة")};
  img.src=url;
}
function exportSVG(){
  if(!state.nodes.length){alert("الخريطة فاضية");return}
  const built=buildStandaloneSVG();
  const xml=new XMLSerializer().serializeToString(built.svg);
  const a=document.createElement("a");a.download="mindmap.svg";
  a.href=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml;charset=utf-8"}));a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function downloadJSON(){
  const a=document.createElement("a");a.download="mindmap.json";
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function importJSON(e){
  const f=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw 0;
      pushUndo();
      state.nodes=d.nodes.filter(n=>n&&n.id!=null).map(n=>({
        id:String(n.id),x:+n.x||0,y:+n.y||0,text:String(n.text==null?"":n.text),
        shape:n.shape==="round"?"round":"circle",color:String(n.color||"#4dabf7")}));
      const ids={};state.nodes.forEach(n=>ids[n.id]=1);
      state.edges=d.edges.filter(x=>x&&ids[x.from]&&ids[x.to]).map(x=>({
        id:String(x.id||uid("e")),from:String(x.from),to:String(x.to),
        fromSide:DIRS[x.fromSide]?x.fromSide:"right",toSide:DIRS[x.toSide]?x.toSide:"left"}));
      let mx=0;state.nodes.forEach(n=>{const m=/^n(\d+)$/.exec(n.id);if(m)mx=Math.max(mx,+m[1])});
      let ex=0;state.edges.forEach(x=>{const m=/^e(\d+)$/.exec(x.id);if(m)ex=Math.max(ex,+m[1])});
      state.next=Math.max(state.next||1,mx+1,ex+1);
      if(d.opts)state.opts=Object.assign({shape:"circle",curve:true,arrows:true},d.opts);
      if(d.uiColor)state.uiColor=d.uiColor;
      selId=null;hoverId=null;sizeCache.clear();
      save();renderAll();fitView();
    }catch(_){alert("ملف غير صالح")}
  };
  r.readAsText(f);
}

/* ---------- الكيبورد ---------- */
addEventListener("keydown",e=>{
  const tag=document.activeElement&&document.activeElement.tagName||"";
  if(/INPUT|TEXTAREA|SELECT/.test(tag))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();undo();return}
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==="y"||(e.key.toLowerCase()==="z"&&e.shiftKey))){e.preventDefault();redo();return}
  if((e.key==="Delete"||e.key==="Backspace")&&selId){e.preventDefault();deleteSelected();return}
  if(e.key==="Escape"){closeEditor(false);selId=null;hoverId=null;renderAll();return}
  if((e.key==="+"||e.key==="=")&&selId){e.preventDefault();addChild(selId,"right")}
});

/* ---------- البداية ---------- */
function seedRoot(){
  state.nodes.push({id:uid("n"),x:0,y:0,text:"الفكرة الرئيسية",shape:"circle",color:"#5c7cfa"});
}
function init(){
  load();
  document.documentElement.dataset.theme=(state.theme==="light")?"light":"dark";
  $("#themeBtn").textContent=(state.theme==="light")?"☀":"🌙";
  const r=stage.getBoundingClientRect();
  cam.x=r.width/2;cam.y=r.height/2;cam.z=1;
  if(!state.nodes.length)seedRoot();
  save();renderAll();syncUndo();fitView();
}
addEventListener("resize",()=>{applyView()});
init();
})();
</script>
