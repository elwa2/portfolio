/* Layout: desktop note-taking shell. Top bar with sidebar buttons and tabs, left icon rail, file explorer, and a centered reading column. */

  --line:#363636; --fg:#dadada; --fg-strong:#f2f2f2; --muted:#9a9a9a; --faint:#6e6e6e;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}

.app{height:100%;display:grid;grid-template-rows:40px minmax(0,1fr);grid-template-columns:44px var(--side-w,300px) minmax(0,1fr);position:relative}

.ib.on{background:var(--bg-active);color:var(--fg-strong)}

.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;flex:none;color:var(--muted)}

.md>*:first-child{margin-top:0}

.pop .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}

هذا الملف هو دليل ومرجع حي لكافة التنسيقات والأدوات داخل Obsidian. يمكنك نسخ أي جزء منه واستخدامه مباشرة في ملاحظاتك اليومية.

---

## 1. قوالب المهام والقوائم الذكية (Advanced To-Do Lists) 📝
يمكنك استخدام الاختصار `Ctrl + L` لإنشاء المربعات، وتدعم أوبسيديان رموزاً مختلفة داخل المربع للحالات المتقدمة:

- [ ] مهمة عادية (غير مكتملة)
- [x] مهمة مكتملة ومقضية (تظهر مشطوبة)
- [/] مهمة قيد التنفيذ حالياً (In Progress)
- [-] مهمة تم إلغاؤها أو استبعادها
- [!] مهمة عاجلة جداً أو ذات أولوية قصوى
- [?] مهمة تحتاج إلى بحث أو استفسار المزيد عنها

---

## 2. صناديق التوجل الاحترافية (Advanced Collapsible Callouts) 📐
تتيح لك هذه الصناديق إخفاء كميات ضخمة من البيانات داخل عنوان واحد لتنظيم الملاحظة.

### أ) توجل مغلق افتراضياً ويحتوي على مربع أكواد بايثون 🐍
*استخدام `[-]` يجعل الصندوق مغلقاً حتى تضغط عليه بنفسك:*

> [!CODE]- 💻 اضغط هنا لعرض كود Python البرمجي
> هذا الكود مخفي بالكامل لحين الحاجة إليه:
> ```python
> def calculate_bonus(salary):
>     # حساب المكافأة السنوية للموظف
>     return salary * 0.15
>
> print("قيمة المكافأة الحالية:", calculate_bonus(5000))
> ```
> *ملاحظة: يمكنك كتابة أي شرح هنا أسفل الكود مباشرة.*

### ب) توجل مفتوح افتراضياً ويحتوي على أكواد الويب (HTML/CSS) 🌐
*استخدام `[+]` يجعل الصندوق يظهر مفتوحاً أول ما تفتح الصفحة:*

> [!EXAMPLE]+ 📄 اضغط لطي شيفرة تنسيق الويب
> ```html
> <div class="container">
>     <h1>مرحباً بك في موقعنا</h1>
>     <p style="color: blue;">هذا النص منسق عبر HTML مدمج.</p>
> </div>
> ```

---

## 3. التنسيقات النصية المتقدمة (Typography & Styles) ✨

* **نص سميك جداً (Bold):** `**نص عريض**` ➔ **نص عريض**
* *نص مائل مائل (Italic):* `*نص مائل*` ➔ *نص مائل*
* ***نص سميك ومائل معاً:*** `***نص مدمج***` ➔ ***نص مدمج***
* ==نص محدد بماركر فسفوري:== `==نص محدد==` ➔ ==نص محدد==
* ~~نص مشطوب عليه للتصحيح:~~ `~~نص مشطوب~~` ➔ ~~نص مشطوب~~
* نص في خلفية رمادية `كود مدمج في سطر (Inline Code)` ➔ `Notepad.exe`

---

## 4. الجداول المنظمة للبيانات (Data Tables) 📊
يمكنك إنشاء جداول برمجية بسيطة ومرتبة لتنظيم مقارناتك أو جداول مواعيدك:

| اسم الأداة | نوع التنسيق | الاختصار في لوحة المفاتيح |
| :--- | :---: | :---: |
| قائمة المهام | `[-]` أو `[x]` | `Ctrl + L` |
| وضع القراءة | تبديل العرض | `Ctrl + E` |
| البحث السريع | بحث داخلي | `Ctrl + F` |

---

## 5. روابط التنقل والوسوم (Internal Links & Tags) 🔗

* **ربط بملاحظة أخرى بالكامل:** `[[اسم الملاحظة]]` (يكفي كتابة الأقواس المزدوجة وسيظهر لك اقتراحات بكل الملاحظات لديك).

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  var codes=[];s=esc(s);
  s=s.replace(/`([^`]+)`/g,function(m,c){codes.push(c);return '\u0001'+(codes.length-1)+'\u0002'});
  s=s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
   .replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/==(.+?)==/g,'<mark>$1</mark>').replace(/~~(.+?)~~/g,'<del>$1</del>')
   .replace(/!?\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,function(m,t,a){return '<a class="wl">'+(a||t)+'</a>'})
   .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
   .replace(/(^|\s)#([\p{L}\p{N}_-]*\p{L}[\p{L}\p{N}_-]*)/gu,'$1<span class="tag">#$2</span>');
  return s.replace(/\u0001(\d+)\u0002/g,function(m,i){return '<code>'+codes[i]+'</code>'});
}
var KW={py:'def return print if elif else for in while import from class True False None and or not with as try except',js:'const let var function return if else for while new class true false null console await async',css:''};
function hl(code,lang){
  var h=esc(code);lang=(lang||'').toLowerCase();
  if(lang==='html'||lang==='xml'){
    return h.replace(/(&lt;\/?)([\w-]+)((?:\s+[\w-]+(?:="[^"]*")?)*)\s*(\/?&gt;)/g,function(m,a,t,at,e){
      at=at.replace(/([\w-]+)(=)("[^"]*")/g,'<span class="a">$1</span>$2<span class="s">$3</span>');
      return a+'<span class="t">'+t+'</span>'+at+e});
  }
  if(lang==='css'){
    return h.replace(/(\/\*[\s\S]*?\*\/)|("[^"\n]*")|([\w-]+)(\s*:)|(#[0-9a-fA-F]{3,8}\b|\b\d+(?:\.\d+)?(?:px|em|rem|%|vh|vw|s)?\b)/g,function(m,c,s,p,col,n){
      if(c)return '<span class="cm">'+c+'</span>';if(s)return '<span class="s">'+s+'</span>';
      if(p)return '<span class="a">'+p+'</span>'+col;return '<span class="n">'+n+'</span>'});
  }
  var key=lang==='python'||lang==='py'?KW.py:(lang==='javascript'||lang==='js'||lang==='ts'?KW.js:'');
  var kre=key?'|\\b('+key.split(' ').join('|')+')\\b':'';
  var re=new RegExp('((?:#|//).*$)|("[^"\\n]*"|\'[^\'\\n]*\')'+kre+'|\\b(\\d+(?:\\.\\d+)?)\\b','gm');
  return h.replace(re,function(m,c,s,k,n){
    if(c)return '<span class="cm">'+c+'</span>';if(s)return '<span class="s">'+s+'</span>';
    if(k)return '<span class="k">'+k+'</span>';if(n)return '<span class="n">'+n+'</span>';return m});
}
var TYPE_C={note:'blue',info:'blue',todo:'blue',code:'blue',abstract:'cyan',summary:'cyan',tip:'cyan',hint:'cyan',success:'green',check:'green',done:'green',question:'yellow',help:'yellow',warning:'yellow',caution:'yellow',failure:'red',fail:'red',danger:'red',error:'red',bug:'red',example:'purple',quote:'gray',cite:'gray'};

function isStart(l,next){
  return /^(`{3,}|~{3,})/.test(l)||/^#{1,6}\s/.test(l)||/^\s*([-*_])\1\1+\s*$/.test(l)||/^\s*>/.test(l)||/^\s*([-*+]|\d+\.)\s+/.test(l)||(l.indexOf('|')>-1&&next&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(next));
}
function render(md){
  var L=md.replace(/\r/g,'').split('\n'),i=0,out='',m;
  while(i<L.length){
    var l=L[i];
    if(!l.trim()){i++;continue}
    if((m=l.match(/^(`{3,}|~{3,})\s*([\w-]*)/))){
      var f=m[1],lang=m[2],buf=[];i++;
      while(i<L.length&&!(L[i].indexOf(f)===0&&!L[i].slice(f.length).trim())){buf.push(L[i]);i++}
      i++;out+='<div class="code"><button class="cp" type="button">نسخ</button><pre><code>'+hl(buf.join('\n'),lang)+'</code></pre></div>';continue;
    }
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){out+='<h'+m[1].length+'>'+inline(m[2])+'</h'+m[1].length+'>';i++;continue}
    if(/^\s*([-*_])\1\1+\s*$/.test(l)){out+='<hr>';i++;continue}
    if(/^\s*>/.test(l)){
      var q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}
      var cm=q[0].match(/^\[!([\w-]+)\]([+-]?)\s*(.*)$/);
      if(cm){
        var ty=cm[1].toLowerCase(),fold=cm[2],title=cm[3]||(cm[1].charAt(0).toUpperCase()+cm[1].slice(1).toLowerCase());
        var inner=q.slice(1).join('\n');
        out+='<div class="callout c-'+(TYPE_C[ty]||'blue')+(fold==='-'?' closed':'')+'"'+(fold?' data-fold="1"':'')+'><div class="ct" '+(fold?'role="button" tabindex="0" aria-expanded="'+(fold==='-'?'false':'true')+'"':'')+'>'+ic('edit')+'<span class="ctt">'+inline(title)+'</span>'+(fold?'<span class="chev">'+ic('chev')+'</span>':'')+'</div>'+(inner.trim()?'<div class="cc">'+render(inner)+'</div>':'')+'</div>';
      }else out+='<blockquote>'+render(q.join('\n'))+'</blockquote>';
      continue;
    }
    if(l.indexOf('|')>-1&&L[i+1]&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(L[i+1])){
      var cells=function(r){return r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(c){return c.trim()})};
      var head=cells(l),al=cells(L[i+1]).map(function(c){return /^:-+:$/.test(c)?'center':(/-:$/.test(c)?'left':'right')});
      i+=2;var rows=[];while(i<L.length&&L[i].indexOf('|')>-1&&L[i].trim()){rows.push(cells(L[i]));i++}
      out+='<div class="tablewrap"><table><thead><tr>'+head.map(function(c,k){return '<th style="text-align:'+al[k]+'">'+inline(c)+'</th>'}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,k){return '<td style="text-align:'+(al[k]||'right')+'">'+inline(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>';
      continue;
    }
    if(/^\s*([-*+]|\d+\.)\s+/.test(l)){
      var items=[];
      while(i<L.length&&/^\s*([-*+]|\d+\.)\s+/.test(L[i])){
        var mm=L[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
        items.push({d:mm[1].replace(/\t/g,'    ').length,o:/\d/.test(mm[2]),t:mm[3]});i++;
      }
      var pos=0;
      var build=function(d){
        var o=items[pos].o,s='<'+(o?'ol':'ul')+'>';
        while(pos<items.length&&items[pos].d>=d){
          if(items[pos].d>d){s+=build(items[pos].d);continue}
          var it=items[pos++],tk=it.t.match(/^\[(.)\](?:\s+(.*))?$/);
          if(tk){var n=taskN++;s+='<li class="task" data-s="'+(tk[1]===' '?' ':esc(tk[1]))+'" data-n="'+n+'"><span class="cb" role="checkbox" tabindex="0" aria-checked="'+(tk[1]==='x')+'">'+(/[\/!?-]/.test(tk[1])?esc(tk[1]==='/'?'◐':tk[1]):(tk[1]==='x'?'✓':''))+'</span><span class="tt">'+inline(tk[2]||'')+'</span></li>'}
          else s+='<li>'+inline(it.t)+'</li>';
        }
        return s+'</'+(o?'ol':'ul')+'>';
      };
      out+=build(items[0].d);continue;
    }
    var p=[l];i++;
    while(i<L.length&&L[i].trim()&&!isStart(L[i],L[i+1])){p.push(L[i]);i++}
    out+='<p>'+p.map(inline).join('<br>')+'</p>';
  }
  return out;
}
function toggleTaskInRaw(text,n){
  var L=text.split('\n'),c=0,fence=null;
  for(var i=0;i<L.length;i++){
    var s=L[i].replace(/^[\s>]*/,''),fm=s.match(/^(`{3,}|~{3,})/);
    if(fence){if(fm&&s.indexOf(fence)===0&&!s.slice(fence.length).trim())fence=null;continue}
    if(fm){fence=fm[1];continue}
    var t=L[i].match(/^([\s>]*[-*+]\s+)\[(.)\](\s|$)/);
    if(t){if(c===n){L[i]=L[i].replace(/\[(.)\]/,t[2]==='x'?'[ ]':'[x]');break}c++}
  }
  return L.join('\n');
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  var cl=t.closest('[data-close]');if(cl){e.stopPropagation();closeTab(+cl.dataset.close);return}
  var tab=t.closest('.tab');if(tab){state.active=+tab.dataset.id;renderAll();return}
  var fo=t.closest('[data-open]');if(fo){openNote(+fo.dataset.open);if(innerWidth<=760)$('app').classList.add('collapsed');return}
  if(t.closest('#btnPlus')||t.closest('#btnNew')||t.closest('#emptyNew')){newNote();return}
  var ct=t.closest('.callout[data-fold] .ct');
  if(ct){var c=ct.parentNode;c.classList.toggle('closed');ct.setAttribute('aria-expanded',String(!c.classList.contains('closed')));return}
  var cb=t.closest('.cb');
  if(cb){var li=cb.parentNode,n=cur();n.text=toggleTaskInRaw(n.text,+li.dataset.n);var y=$('scroll').scrollTop;renderMain();$('scroll').scrollTop=y;save();return}
  var cp=t.closest('.cp');
  if(cp){
    var txt=cp.parentNode.querySelector('code').textContent;
    var done=function(){cp.textContent='تم النسخ';setTimeout(function(){cp.textContent='نسخ'},1200)};
    var fb=function(){var r=document.createRange();r.selectNodeContents(cp.parentNode.querySelector('code'));var s=getSelection();s.removeAllRanges();s.addRange(r);cp.textContent='حدد النص ثم Ctrl+C';setTimeout(function(){cp.textContent='نسخ'},1800)};
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(err){fb()}
    return;
  }
});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='e'){e.preventDefault();toggleMode();return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.cb,.callout .ct,.tab')){e.preventDefault();e.target.click()}
  if(e.key==='Enter'&&e.target.id==='dt'){e.preventDefault();e.target.blur()}
});
document.addEventListener('dblclick',function(e){
  if(e.target.closest('#md')&&!e.target.closest('.ct,.cb,.cp,a')){var n=cur();if(n){n.mode='edit';renderAll()}}
});
document.addEventListener('keydown',function(e){
  var ta=e.target;if(!ta||ta.id!=='editor')return;
  var v=ta.value,s=ta.selectionStart,se=ta.selectionEnd;
  var ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',s);if(le<0)le=v.length;
  var line=v.slice(ls,le);
  function put(txt,from,to){
    ta.setSelectionRange(from,to);var ok=false;
    try{ok=document.execCommand('insertText',false,txt)}catch(x){}
    if(!ok){ta.setRangeText(txt,from,to,'end')}
    ta.dispatchEvent(new Event('input',{bubbles:true}));
  }
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    var kk=e.key.toLowerCase();
    if(kk==='b'){e.preventDefault();wrap('**','**','نص عريض');return}
    if(kk==='i'){e.preventDefault();wrap('*','*','نص مائل');return}
    if(kk==='k'){e.preventDefault();wrap('[','](https://)','نص الرابط');return}
  }
  var li=line.match(/^(\s*)([-*+]|\d+\.)\s+(\[.\]\s+)?(.*)$/);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='l'){
    e.preventDefault();
    var t=line.match(/^(\s*)[-*+]\s+\[.\]\s?(.*)$/),b=line.match(/^(\s*)[-*+]\s+(.*)$/),r;
    if(t)r=t[1]+t[2];else if(b)r=b[1]+'- [ ] '+b[2];else r='- '+line;
    put(r,ls,le);return;
  }
  if(e.key==='Enter'&&!e.shiftKey&&!e.ctrlKey&&!e.altKey&&s===se&&s===le){
    var q=line.match(/^(\s*>\s?)(.*)$/);
    if(li){
      e.preventDefault();
      if(!li[4].trim()){put('',ls,le);return}
      var mk=/\d/.test(li[2])?(parseInt(li[2],10)+1)+'.':li[2];
      put('\n'+li[1]+mk+' '+(li[3]?'[ ] ':''),s,se);return;
    }
    if(q&&q[2].trim()){e.preventDefault();put('\n'+q[1],s,se)}
  }
  if(e.key==='Tab'&&li){
    e.preventDefault();
    if(e.shiftKey){var rm=line.match(/^( {1,4}|\t)/);if(rm)put(line.slice(rm[0].length),ls,le)}
    else put('    '+line,ls,le);
  }
});
document.addEventListener('input',function(e){
  var n=cur();if(!n)return;
  if(e.target.id==='editor'){n.text=e.target.value;save()}
  if(e.target.id==='dt'){n.name=e.target.textContent.replace(/\n/g,'');$('crumb').textContent=n.name||'Untitled';renderTabs();renderFiles();save()}
});

  r.dataset.theme=dark?'light':'dark';state.theme=r.dataset.theme;save();

/* ---------- editing tools ---------- */
function ensureEdit(cb){
  var n=cur();if(!n||state.tabs.indexOf(n.id)<0)return;
  if(n.mode!=='edit'){n.mode='edit';renderAll()}
  var t=$('editor');if(t)cb(t);
}
function ins(t,from,to,txt,a,b){
  t.focus();t.setSelectionRange(from,to);var ok=false;
  try{ok=document.execCommand('insertText',false,txt)}catch(x){}
  if(!ok)t.setRangeText(txt,from,to,'end');
  t.setSelectionRange(a,b);t.dispatchEvent(new Event('input',{bubbles:true}));
}
function wrap(b,a,ph){ensureEdit(function(t){
  var v=t.value,s=t.selectionStart,e=t.selectionEnd,sel=v.slice(s,e),w=sel||ph;
  if(sel&&v.slice(s-b.length,s)===b&&v.slice(e,e+a.length)===a){ins(t,s-b.length,e+a.length,sel,s-b.length,s-b.length+sel.length);return}
  ins(t,s,e,b+w+a,s+b.length,s+b.length+w.length);
})}
function lineTool(mk,re,ph,same){ensureEdit(function(t){
  var v=t.value,s=t.selectionStart,e=t.selectionEnd,ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',e);if(le<0)le=v.length;
  var raw=v.slice(ls,le),lines=raw.split('\n');
  if(!raw.trim()){var p=mk(0);ins(t,ls,le,p+ph,ls+p.length,ls+p.length+ph.length);return}
  var chk=same||function(l){return re.test(l)};
  var all=lines.every(function(l,i){return !l.trim()||chk(l,i)});
  var res=lines.map(function(l,i){if(!l.trim())return l;var b=l.replace(re,'');return all?b:mk(i)+b}).join('\n');
  ins(t,ls,le,res,ls,ls+res.length);
})}
function block(tpl,ph){ensureEdit(function(t){
  var v=t.value,s=t.selectionStart,e=t.selectionEnd,w=v.slice(s,e)||ph;
  var pre=(s>0&&v.charAt(s-1)!=='\n')?'\n':'',post=(e<v.length&&v.charAt(e)!=='\n')?'\n':'';
  var at=pre.length+tpl.indexOf('@@');
  ins(t,s,e,pre+tpl.replace('@@',w)+post,s+at,s+at+w.length);
})}
function heading(n){var h=new Array(n+1).join('#')+' ';lineTool(function(){return h},/^#{1,6}\s+/,'العنوان',function(l){return l.indexOf(h)===0})}
var CALLOUTS=[['note','ملاحظة','blue'],['info','معلومة','blue'],['tip','نصيحة','cyan'],['abstract','ملخص','cyan'],['todo','مهمة','blue'],['success','نجاح','green'],['question','سؤال','yellow'],['warning','تحذير','yellow'],['failure','فشل','red'],['danger','خطر','red'],['bug','خطأ برمجي','red'],['example','مثال','purple'],['quote','اقتباس','gray']];
var STATES=[[' ','مهمة عادية'],['x','مكتملة'],['/','قيد التنفيذ'],['-','ملغاة'],['!','عاجلة'],['?','تحتاج بحث']];
var LANGS=[['python','Python'],['html','HTML'],['css','CSS'],['javascript','JavaScript'],['','نص عادي']];
var calloutFold='-',pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
function openPop(btn,html,pick){
  closePop();pop=document.createElement('div');pop.className='pop';pop.innerHTML=html;document.body.appendChild(pop);
  var r=btn.getBoundingClientRect(),w=pop.offsetWidth;
  pop.style.top=(r.bottom+4)+'px';pop.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  pop.addEventListener('mousedown',function(e){e.preventDefault()});
  pop.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(b&&pick(b.dataset.k,b)!==false)closePop()});
}
function foldHtml(){return '<div class="seg">'+[['-','مغلق'],['+','مفتوح'],['','ثابت']].map(function(f){return '<button type="button" data-k="fold:'+f[0]+'" class="'+(calloutFold===f[0]?'on':'')+'">'+f[1]+'</button>'}).join('')+'</div>'}
function openMenu(kind,btn){
  if(kind==='callout'){
    openPop(btn,foldHtml()+'<div class="grid">'+CALLOUTS.map(function(c){return '<button type="button" class="row c-'+c[2]+'" data-k="'+c[0]+'"><span class="dot"></span>'+c[1]+'</button>'}).join('')+'</div>',function(k,b){
      if(k.indexOf('fold:')===0){calloutFold=k.slice(5);[].forEach.call(pop.querySelectorAll('.seg button'),function(x){x.classList.toggle('on',x.dataset.k===k)});return false}
      block('> [!'+k+']'+calloutFold+' @@\n> المحتوى هنا','العنوان');
    });
  }else if(kind==='code'){
    openPop(btn,LANGS.map(function(l){return '<button type="button" class="row" data-k="'+l[0]+'" data-n="'+l[1]+'">'+l[1]+'<small>'+(l[0]||'text')+'</small></button>'}).join(''),function(k){
      block('```'+k+'\n@@\n```','اكتب الكود هنا');
    });
  }else if(kind==='task'){
    openPop(btn,STATES.map(function(s,i){return '<button type="button" class="row" data-k="'+i+'">'+s[1]+'<small>['+s[0]+']</small></button>'}).join(''),function(k){
      var st=STATES[+k][0],pre='- ['+st+'] ';
      lineTool(function(){return pre},/^[-*+]\s+\[.\]\s+/,'مهمة',function(l){return l.indexOf(pre)===0});
    });
  }
}
var TOOLS=[
 {i:'undo',t:'تراجع (Ctrl+Z)',a:function(){ensureEdit(function(t){t.focus();document.execCommand('undo')})}},
 {i:'redo',t:'إعادة (Ctrl+Y)',a:function(){ensureEdit(function(t){t.focus();document.execCommand('redo')})}},
 '|',
 {i:'h1',t:'عنوان رئيسي',a:function(){heading(1)}},
 {i:'h2',t:'عنوان فرعي',a:function(){heading(2)}},
 {i:'h3',t:'عنوان أصغر',a:function(){heading(3)}},
 '|',
 {i:'bold',t:'عريض (Ctrl+B)',a:function(){wrap('**','**','نص عريض')}},
 {i:'italic',t:'مائل (Ctrl+I)',a:function(){wrap('*','*','نص مائل')}},
 {i:'strike',t:'مشطوب',a:function(){wrap('~~','~~','نص مشطوب')}},
 {i:'hl',t:'تظليل',a:function(){wrap('==','==','نص مظلل')}},
 {i:'icode',t:'كود داخل السطر',a:function(){wrap('`','`','كود')}},
 '|',
 {i:'list',t:'قائمة نقطية',a:function(){lineTool(function(){return '- '},/^[-*+]\s+(?!\[.\])/,'عنصر')}},
 {i:'ol',t:'قائمة رقمية',a:function(){lineTool(function(i){return (i+1)+'. '},/^\d+\.\s+/,'عنصر')}},
 {i:'task',t:'مهمة (اختر الحالة)',m:'task'},
 {i:'quote',t:'اقتباس',a:function(){lineTool(function(){return '> '},/^>\s?/,'اقتباس')}},
 '|',
 {i:'callout',t:'صندوق توجل',m:'callout'},
 {i:'cblock',t:'مربع كود',m:'code'},
 {i:'table',t:'جدول',a:function(){block('| العمود 1 | العمود 2 | العمود 3 |\n| :--- | :---: | ---: |\n| @@ |  |  |\n|  |  |  |','بيانات')}},
 {i:'hr',t:'فاصل أفقي',a:function(){block('---\n@@','')}},
 '|',
 {i:'link',t:'رابط (Ctrl+K)',a:function(){wrap('[','](https://)','نص الرابط')}},
 {i:'wlink',t:'ربط بملاحظة',a:function(){wrap('[[',']]','اسم الملاحظة')}},
 {i:'tag',t:'وسم',a:function(){wrap('#','','وسم')}}
];
function buildToolbar(){
  $('toolbar').innerHTML=TOOLS.map(function(x,k){
    if(x==='|')return '<span class="tsep"></span>';
    return '<button type="button" class="ib" data-t="'+k+'"'+(x.m?' data-menu="1"':'')+' title="'+x.t+'" aria-label="'+x.t+'">'+ic(x.i)+'</button>';
  }).join('');
}
$('toolbar').addEventListener('mousedown',function(e){e.preventDefault()});
$('toolbar').addEventListener('click',function(e){
  var b=e.target.closest('[data-t]');if(!b)return;
  var x=TOOLS[+b.dataset.t];
  if(x.m){if(pop){closePop();return}openMenu(x.m,b)}else{closePop();x.a()}
});
