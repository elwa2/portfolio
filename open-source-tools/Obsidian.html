<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>مفكرة الملاحظات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop note-taking shell. Top bar with sidebar buttons and tabs, left icon rail, file explorer, and a centered reading column. */
:root{
  --bg:#1e1e1e; --bg-side:#262626; --bg-bar:#161616; --bg-hover:#323232; --bg-active:#3a3a3a;
  --line:#363636; --fg:#dadada; --fg-strong:#f2f2f2; --muted:#9a9a9a; --faint:#6e6e6e;
  --accent:#8b72f2; --accent-soft:rgba(139,114,242,.18); --mark:rgba(255,208,0,.25);
  --code-bg:#161616; --c-blue:68,138,255; --c-cyan:0,191,188; --c-green:68,207,110;
  --c-yellow:233,151,63; --c-red:251,70,76; --c-purple:168,130,255; --c-gray:158,158,158;
  --h-k:#c792ea; --h-s:#a5d68a; --h-c:#7f848e; --h-n:#f5a97f; --h-t:#f07178; --h-a:#ffcb6b;
  --font-ui:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --font-doc:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#ffffff; --bg-side:#f5f5f6; --bg-bar:#ebebed; --bg-hover:#e3e3e6; --bg-active:#d9d9de;
    --line:#dcdce0; --fg:#2b2b2f; --fg-strong:#111114; --muted:#6c6c74; --faint:#9a9aa2;
    --accent:#6b4fe0; --accent-soft:rgba(107,79,224,.12); --mark:rgba(255,208,0,.4);
    --code-bg:#f3f3f5; --c-blue:8,109,224; --c-cyan:0,150,150; --c-green:8,150,60;
    --c-yellow:200,110,10; --c-red:216,40,48; --c-purple:120,70,230; --c-gray:110,110,118;
    --h-k:#8a3fb8; --h-s:#3c7a1e; --h-c:#8a8f98; --h-n:#c4561a; --h-t:#c42b36; --h-a:#9a6a00;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#ffffff; --bg-side:#f5f5f6; --bg-bar:#ebebed; --bg-hover:#e3e3e6; --bg-active:#d9d9de;
  --line:#dcdce0; --fg:#2b2b2f; --fg-strong:#111114; --muted:#6c6c74; --faint:#9a9aa2;
  --accent:#6b4fe0; --accent-soft:rgba(107,79,224,.12); --mark:rgba(255,208,0,.4);
  --code-bg:#f3f3f5; --c-blue:8,109,224; --c-cyan:0,150,150; --c-green:8,150,60;
  --c-yellow:200,110,10; --c-red:216,40,48; --c-purple:120,70,230; --c-gray:110,110,118;
  --h-k:#8a3fb8; --h-s:#3c7a1e; --h-c:#8a8f98; --h-n:#c4561a; --h-t:#c42b36; --h-a:#9a6a00;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}

.app{height:100%;display:grid;grid-template-rows:40px minmax(0,1fr);grid-template-columns:44px var(--side-w,300px) minmax(0,1fr);position:relative}
.app.collapsed{--side-w:0px}
.topbar{grid-row:1;grid-column:1/-1;display:flex;background:var(--bg-bar);border-bottom:1px solid var(--line);min-width:0}
.topleft{display:flex;align-items:center;gap:2px;padding:0 4px;width:calc(44px + var(--side-w,300px));flex:none;overflow:hidden}
.app.collapsed .topleft{width:44px}
.app.collapsed .topleft .opt{display:none}
.ib{width:32px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--muted);flex:none}
.ib:hover{background:var(--bg-hover);color:var(--fg)}
.ib.on{background:var(--bg-active);color:var(--fg-strong)}
.tabs{display:flex;align-items:flex-end;gap:2px;flex:1;min-width:0;padding-top:6px;overflow:hidden}
.tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 6px 0 12px;border-radius:7px 7px 0 0;color:var(--muted);min-width:0;max-width:220px;flex:0 1 190px;cursor:pointer}
.tab:hover{background:var(--bg-hover)}
.tab.active{background:var(--bg);color:var(--fg-strong)}
.tab .tn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.tab .x{width:20px;height:20px;border-radius:4px;display:grid;place-items:center;flex:none;color:var(--muted)}
.tab .x:hover{background:var(--bg-active);color:var(--fg-strong)}
.tab .x svg{width:14px;height:14px}
.tabs .plus{margin-bottom:2px}

.rail{grid-row:2;grid-column:1;background:var(--bg-bar);display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;border-right:1px solid var(--line)}
.side{grid-row:2;grid-column:2;background:var(--bg-side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.app.collapsed .side{border-right:0}
.side-actions{display:flex;justify-content:center;gap:6px;padding:8px 6px;flex:none}
.files{flex:1;overflow-y:auto;padding:4px 8px}
.file{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:4px 8px;border-radius:5px;color:var(--fg);min-height:28px}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.file:hover{background:var(--bg-hover)}
.file.active{background:var(--bg-active);color:var(--fg-strong)}
.file svg{color:var(--muted);width:15px;height:15px}
.side-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--line);color:var(--muted);flex:none}
.side-foot b{font-weight:500;color:var(--fg)}

.main{grid-row:2;grid-column:3;background:var(--bg);display:flex;flex-direction:column;min-width:0;min-height:0}
.navbar{display:flex;align-items:center;gap:4px;height:36px;padding:0 10px;flex:none}
.navbar .crumb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12.5px;padding:0 6px}
.navbar .ib{width:28px;height:28px}
.scroll{flex:1;overflow-y:auto;min-height:0}
.doc{max-width:760px;margin:0 auto;padding:36px max(16px,4vw) 120px}
.doc-title{direction:rtl;text-align:right;font:700 28px/1.35 var(--font-doc);color:var(--fg-strong);margin:0 0 28px;outline:0;text-wrap:balance;min-height:1.35em}
.doc-title:empty::before{content:attr(data-ph);color:var(--faint)}
.editor{display:block;width:100%;min-height:60vh;height:calc(100vh - 220px);background:transparent;color:var(--fg);border:0;outline:0;resize:none;font:15px/1.8 var(--font-doc);padding:0}
.md[contenteditable]{outline:0;min-height:60vh;padding-bottom:30vh;caret-color:var(--accent)}
.md[contenteditable] .code code{display:block;outline:0;min-height:1.65em}
.md[contenteditable] .code code:empty::before{content:'\200b'}
.md[contenteditable] .callout .ctt{cursor:text}
.md[contenteditable] .callout[data-fold] .chev{cursor:pointer}
.md[contenteditable] th,.md[contenteditable] td{min-width:60px}
.doc.wide{max-width:1500px}
.doc.full{max-width:none}
.split{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.split .editor{height:calc(100vh - 230px);min-height:320px;overflow-y:auto;padding:18px 0 18px 22px;border-left:1px solid var(--line)}
.split .pv{height:calc(100vh - 230px);min-height:320px;overflow-y:auto;padding:18px 22px 18px 0}
.ib.on{background:var(--bg-active);color:var(--fg-strong)}
@media (max-width:900px){.split{grid-template-columns:1fr}.split .editor{height:42vh;min-height:200px;border-left:0;border-bottom:1px solid var(--line);padding:14px 0}.split .pv{height:auto;min-height:0;overflow:visible;padding:14px 0}}
.empty{height:100%;display:grid;place-content:center;gap:14px;text-align:center;color:var(--muted)}
.empty button{color:var(--accent);font-size:14px}
.empty button:hover{text-decoration:underline}

/* rendered note */
.md{direction:rtl;text-align:right;font:16px/1.85 var(--font-doc);color:var(--fg);overflow-wrap:anywhere}
.md>*:first-child{margin-top:0}
.md p{margin:0 0 .9em}
.md h1,.md h2,.md h3,.md h4{font-family:var(--font-doc);color:var(--fg-strong);line-height:1.4;margin:1.5em 0 .5em;text-wrap:balance}
.md h1{font-size:1.8em}.md h2{font-size:1.5em}.md h3{font-size:1.25em}.md h4{font-size:1.1em}
.md hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.md a.wl{color:var(--accent);cursor:pointer}
.md a{color:var(--accent)}
.md .tag{color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:1px 8px;font-size:.88em}
.md mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
.md code{font:.86em var(--font-mono);background:var(--code-bg);padding:.12em .4em;border-radius:4px;direction:ltr;unicode-bidi:isolate;color:var(--fg)}
.md ul,.md ol{margin:0 0 .9em;padding:0 1.5em 0 0}
.md ul ul,.md ul ol,.md ol ul,.md ol ol{margin:0}
.md li{margin:.15em 0}
.md li.task{list-style:none;display:flex;gap:10px;align-items:baseline;margin-right:-1.5em}
.cb{width:17px;height:17px;border:1.5px solid var(--faint);border-radius:5px;flex:none;display:grid;place-items:center;font:700 11px/1 var(--font-ui);color:#fff;cursor:pointer;position:relative;top:3px;user-select:none}
.cb:hover{border-color:var(--accent)}
.task[data-s="x"] .cb{background:var(--accent);border-color:var(--accent)}
.task[data-s="x"] .tt{text-decoration:line-through;color:var(--muted)}
.task[data-s="/"] .cb{border-color:var(--accent);color:var(--accent)}
.task[data-s="-"] .cb{color:var(--muted)}
.task[data-s="-"] .tt{text-decoration:line-through;color:var(--muted)}
.task[data-s="!"] .cb{border-color:rgb(var(--c-red));color:rgb(var(--c-red))}
.task[data-s="?"] .cb{border-color:rgb(var(--c-yellow));color:rgb(var(--c-yellow))}
.md blockquote{margin:0 0 1em;padding:2px 16px 2px 0;border-right:3px solid var(--accent);color:var(--muted)}
.tablewrap{overflow-x:auto;margin:0 0 1em}
.md table{border-collapse:collapse;min-width:60%}
.md th,.md td{border:1px solid var(--line);padding:6px 12px}
.md th{background:var(--bg-side);color:var(--fg-strong);font-weight:600}

.callout{--c:var(--c-blue);margin:0 0 1em;border-radius:6px;background:rgba(var(--c),.1);overflow:hidden;border:1px solid rgba(var(--c),.18)}
.callout.c-cyan{--c:var(--c-cyan)}.callout.c-green{--c:var(--c-green)}.callout.c-yellow{--c:var(--c-yellow)}
.callout.c-red{--c:var(--c-red)}.callout.c-purple{--c:var(--c-purple)}.callout.c-gray{--c:var(--c-gray)}
.ct{display:flex;align-items:center;gap:8px;padding:10px 14px;color:rgb(var(--c));font-weight:600;width:100%;text-align:right;cursor:default}
.callout[data-fold] .ct{cursor:pointer}
.ct .ctt{flex:1;min-width:0}
.ct svg.i{width:17px;height:17px}
.ct .chev{transition:transform .15s}
.callout.closed .chev{transform:rotate(90deg)}
.callout:not(.closed) .chev{transform:rotate(0)}
.cc{padding:0 14px 8px}
.callout.closed .cc{display:none}
.cc>*:first-child{margin-top:0}.cc>*:last-child{margin-bottom:0}

.code{--c:var(--c-blue);position:relative;margin:0 0 1em;direction:ltr;text-align:left;background:rgba(var(--c),.1);border:1px solid rgba(var(--c),.18);border-radius:6px;overflow:hidden}
.code .ch{display:flex;align-items:center;gap:8px;padding:9px 14px;color:rgb(var(--c));font:600 14px var(--font-ui);cursor:pointer;direction:rtl;text-align:right;user-select:none;width:100%}
.code .ch svg.i{width:17px;height:17px;flex:none}
.code .ch .cl{flex:1;min-width:0;outline:0;user-select:text;cursor:text;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code .ch .cl:empty::before{content:'\200b'}
.code .ch button{position:static;opacity:1;font:500 11.5px var(--font-ui);padding:2px 8px;border-radius:4px;background:rgba(var(--c),.16);color:inherit;display:inline-flex;align-items:center;gap:4px;cursor:pointer;flex:none}
.code .ch button svg.i{width:14px;height:14px}
.code .ch button:hover,.code .ch button.on{background:rgba(var(--c),.34)}
.code .ch .chev{display:inline-flex;transition:transform .15s;flex:none}
.code.closed .ch .chev{transform:rotate(90deg)}
.code pre{margin:0 12px 12px;background:var(--code-bg);border-radius:6px;padding:12px 14px;overflow-x:auto;font:13.5px/1.65 var(--font-mono);color:var(--fg);border:1px solid var(--line)}
.code pre code{background:none;padding:0;font:inherit}
.code.closed pre{display:none}
.code.plain{background:none;border:0;border-radius:0;overflow:visible}
.code.plain pre{margin:0}
.code .cp svg.i{width:15px;height:15px}
.code .ch .cp{padding:3px 6px}
.code.plain .cp{position:absolute;top:8px;right:8px;z-index:1;display:inline-flex;align-items:center;justify-content:center;padding:5px;border-radius:6px;background:var(--bg-active);color:var(--muted);cursor:pointer;opacity:.75;transition:opacity .12s,background .12s}
.code.plain:hover .cp,.code.plain .cp:focus-visible,.code.plain .cp.ok{opacity:1}
.code.plain .cp:hover{background:var(--bg-hover);color:var(--fg-strong)}
.code .cp.ok{color:rgb(var(--c-green))}
.code.wrap pre{overflow-x:hidden}
.code.wrap pre code{white-space:pre-wrap;overflow-wrap:anywhere}
.k{color:var(--h-k)}.s{color:var(--h-s)}.cm{color:var(--h-c);font-style:italic}.n{color:var(--h-n)}.t{color:var(--h-t)}.a{color:var(--h-a)}

/* ---- toggle with code (css / js) ---- */
.callout[data-ty="toggle"]{background:none;border:0;border-radius:0;overflow:visible}
.callout[data-ty="toggle"]>.ct{direction:rtl;color:var(--fg-strong);padding:6px 4px;font-weight:500}
.callout[data-ty="toggle"]>.ct>svg{display:none}
.callout[data-ty="toggle"] .chev{order:-1;transform:none!important}
.callout[data-ty="toggle"] .chev svg{display:none}
.callout[data-ty="toggle"] .chev::before{content:'\25BC';font-size:11px;line-height:1;display:inline-block;color:var(--fg-strong)}
.callout[data-ty="toggle"].closed>.ct .chev::before{content:'\25B6'}
.callout[data-ty="toggle"] .code.closed .chev::before{content:'\25B6'}
.callout[data-ty="toggle"]>.cc{padding:0 22px 4px 0}
.callout[data-ty="toggle"] .code{background:none;border:0;border-radius:0;overflow:visible;margin:0 0 6px}
.callout[data-ty="toggle"] .code .ch{direction:ltr;text-align:left;color:var(--fg-strong);padding:4px 4px;font-weight:500}
.callout[data-ty="toggle"] .code .ch>svg{display:none}
.callout[data-ty="toggle"] .code .ch .cl{text-transform:none}
.callout[data-ty="toggle"] .code .ch button{background:var(--bg-active);color:var(--muted)}
.callout[data-ty="toggle"] .code .ch button:hover,.callout[data-ty="toggle"] .code .ch button.on{background:var(--bg-hover);color:var(--fg-strong)}
.callout[data-ty="toggle"] .code pre{margin:4px 0 8px 22px;border:0;background:var(--code-bg);border-radius:8px;padding:14px 16px}
.hint{direction:rtl;text-align:right;color:var(--faint);font:12.5px var(--font-doc);margin:36px 0 0}
.toolbar{display:flex;align-items:center;gap:2px;padding:4px 10px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:thin}
.toolbar .ib{width:30px;height:28px}
.tsep{width:1px;height:18px;background:var(--line);margin:0 5px;flex:none}
.saved{font-size:11.5px;color:var(--faint);padding:0 8px;flex:none;white-space:nowrap}
.pop{position:fixed;z-index:50;background:var(--bg-side);border:1px solid var(--line);border-radius:8px;padding:6px;box-shadow:0 8px 28px rgba(0,0,0,.4);min-width:190px;max-width:min(340px,calc(100vw - 16px))}
.pop .row{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:5px;text-align:right;direction:rtl;font:13px var(--font-doc);color:var(--fg)}
.pop .row:hover{background:var(--bg-hover)}
.pop .row small{margin-right:auto;font:11px var(--font-mono);color:var(--faint);direction:ltr}
.pop .dot{width:10px;height:10px;border-radius:50%;background:rgb(var(--c,var(--c-blue)));flex:none}
.pop .c-blue{--c:var(--c-blue)}.pop .c-cyan{--c:var(--c-cyan)}.pop .c-green{--c:var(--c-green)}.pop .c-yellow{--c:var(--c-yellow)}.pop .c-red{--c:var(--c-red)}.pop .c-purple{--c:var(--c-purple)}.pop .c-gray{--c:var(--c-gray)}
.pop .grid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.pop .seg{display:flex;gap:2px;padding:2px;background:var(--bg-bar);border-radius:6px;margin-bottom:6px;direction:rtl}
.pop .seg button{flex:1;padding:4px 6px;border-radius:4px;font:12px var(--font-doc);color:var(--muted)}
.pop .seg button.on{background:var(--bg-active);color:var(--fg-strong)}
.side-scrim{display:none}
@media (max-width:760px){
  .app{grid-template-columns:44px 0 minmax(0,1fr)}
  .side{position:absolute;left:44px;top:40px;bottom:0;width:min(300px,calc(100% - 60px));z-index:20;box-shadow:6px 0 24px rgba(0,0,0,.35);border-right:1px solid var(--line)}
  .app.collapsed .side{display:none}
  .topleft,.app.collapsed .topleft{width:auto}
  .topleft .opt{display:none}
  .tab{flex-basis:140px}
  .doc{padding-top:22px}
  .doc-title{font-size:23px}
}
@media (prefers-reduced-motion:reduce){.ct .chev,.code .cp{transition:none}}
</style>

<div class="app" id="app">
  <div class="topbar">
    <div class="topleft">
      <button class="ib" id="btnSide" title="إظهار أو إخفاء الشريط الجانبي" aria-label="الشريط الجانبي"></button>
      <button class="ib opt on" id="btnFiles" title="الملفات" aria-label="الملفات"></button>
      <button class="ib opt" id="btnSearch" title="بحث" aria-label="بحث"></button>
      <button class="ib opt" id="btnMarks" title="العلامات" aria-label="العلامات"></button>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <nav class="rail" id="rail" aria-label="الشريط الأيسر"></nav>
  <aside class="side" id="side">
    <div class="side-actions">
      <button class="ib" id="btnNew" title="ملاحظة جديدة" aria-label="ملاحظة جديدة"></button>
      <button class="ib" id="btnNewFolder" title="مجلد جديد" aria-label="مجلد جديد"></button>
      <button class="ib" id="btnSort" title="ترتيب" aria-label="ترتيب"></button>
      <button class="ib" id="btnCollapse" title="طي الكل" aria-label="طي الكل"></button>
    </div>
    <div class="files" id="files"></div>
    <div class="side-foot"><b>my-vault</b><span id="footIcons" style="display:flex;gap:4px"></span></div>
  </aside>
  <main class="main">
    <div class="navbar">
      <button class="ib" id="btnBack" title="رجوع" aria-label="رجوع"></button>
      <button class="ib" id="btnFwd" title="للأمام" aria-label="للأمام"></button>
      <div class="crumb" id="crumb"></div>
      <span class="saved" id="saved" aria-live="polite"></span>
      <button class="ib" id="btnWidth" title="عرض الكتابة" aria-label="عرض الكتابة"></button>
      <button class="ib" id="btnSplit" title="عرض مقسوم: كتابة + معاينة مباشرة" aria-label="عرض مقسوم"></button>
      <button class="ib" id="btnMode" title="تبديل وضع القراءة والتحرير (Ctrl+E)" aria-label="تبديل وضع القراءة والتحرير"></button>

## 1. قوالب المهام والقوائم الذكية (Advanced To-Do Lists) 📝
يمكنك استخدام الاختصار `Ctrl + L` لإنشاء المربعات، وتدعم أوبسيديان رموزاً مختلفة داخل المربع للحالات المتقدمة:

- [ ] مهمة عادية (غير مكتملة)
- [x] مهمة مكتملة ومقضية (تظهر مشطوبة)
- [/] مهمة قيد التنفيذ حالياً (In Progress)
- [-] مهمة تم إلغاؤها أو استبعادها
- [!] مهمة عاجلة جداً أو ذات أولوية قصوى
- [?] مهمة تحتاج إلى بحث أو استفسار المزيد عنها

## 2. صناديق التوجل الاحترافية (Advanced Collapsible Callouts) 📐
تتيح لك هذه الصناديق إخفاء كميات ضخمة من البيانات داخل عنوان واحد لتنظيم الملاحظة.

### أ) توجل مغلق افتراضياً ويحتوي على مربع أكواد بايثون 🐍
*استخدام `[-]` يجعل الصندوق مغلقاً حتى تضغط عليه بنفسك:*

> هذا الكود مخفي بالكامل لحين الحاجة إليه:

>     # حساب المكافأة السنوية للموظف
>     return salary * 0.15
>
> print("قيمة المكافأة الحالية:", calculate_bonus(5000))
> ```
> *ملاحظة: يمكنك كتابة أي شرح هنا أسفل الكود مباشرة.*

### ب) توجل مفتوح افتراضياً ويحتوي على أكواد الويب (HTML/CSS) 🌐
*استخدام `[+]` يجعل الصندوق يظهر مفتوحاً أول ما تفتح الصفحة:*

> [!EXAMPLE]+ 📄 اضغط لطي شيفرة تنسيق الويب

## 3. التنسيقات النصية المتقدمة (Typography & Styles) ✨

* **نص سميك جداً (Bold):** `**نص عريض**` ➔ **نص عريض**
* *نص مائل مائل (Italic):* `*نص مائل*` ➔ *نص مائل*
* ***نص سميك ومائل معاً:*** `***نص مدمج***` ➔ ***نص مدمج***
* ==نص محدد بماركر فسفوري:== `==نص محدد==` ➔ ==نص محدد==
* ~~نص مشطوب عليه للتصحيح:~~ `~~نص مشطوب~~` ➔ ~~نص مشطوب~~
* نص في خلفية رمادية `كود مدمج في سطر (Inline Code)` ➔ `Notepad.exe`

## 4. الجداول المنظمة للبيانات (Data Tables) 📊

| وضع القراءة | تبديل العرض | `Ctrl + E` |

function inlNode(c){

  if(c.nodeType!==1)return '';

  var t=c.tagName;
  if(t==='BR')return '\n';
  if(t==='STRONG'||t==='B')return wrapI('**',c);
  if(t==='EM'||t==='I')return wrapI('*',c);
  if(t==='MARK')return wrapI('==',c);
  if(t==='DEL'||t==='S'||t==='STRIKE')return wrapI('~~',c);
  if(t==='CODE'){var x=c.textContent.replace(/`/g,'');return x?'`'+x+'`':''}
  if(t==='A'){
    if(c.classList.contains('wl')){var v=c.textContent;return(c.getAttribute('data-raw')&&c.getAttribute('data-vis')===v)?c.getAttribute('data-raw'):'[['+v+']]'}

function inl(el){var s='';for(var k=0;k<el.childNodes.length;k++)s+=inlNode(el.childNodes[k]);return s}
var BLK=/^(P|DIV|H[1-6]|UL|OL|LI|BLOCKQUOTE|PRE|TABLE|HR|SECTION|ARTICLE)$/;

function blocksMd(el){

  function flush(){if(buf.trim())out.push(buf.replace(/^\n+|\n+$/g,''));buf=''}

    var c=el.childNodes[k];

    else if(c.nodeType===1){flush();var s=blockMd(c);if(s&&s.trim())out.push(s)}

    }else if(c.tagName==='UL'||c.tagName==='OL')out.push(listMd(c,d+1));

function quoteMd(el){var inner=blocksMd(el);if(!inner.trim())return '';return inner.split('\n').map(function(l){return l?'> '+l:'>'}).join('\n')}
function calloutMd(el){
  var ty=el.getAttribute('data-ty')||'note',fold=el.hasAttribute('data-fold')?(el.hasAttribute('data-f0')?el.getAttribute('data-f0'):(el.classList.contains('closed')?'-':'+')):'';

function tableMd(tb){

function wysTask(st){
  var m=$('md');ensureSel();
  var li=findLi(getSelection().anchorNode);
  if(!li){wysList('UL');li=findLi(getSelection().anchorNode)}
  if(!li)return;
  var r=getSelection().getRangeAt(0),lis=[].filter.call(m.querySelectorAll('li'),function(x){return r.intersectsNode(x)&&!x.querySelector('li')});
  if(!lis.length)lis=[li];
  var allSame=lis.every(function(x){return x.classList.contains('task')&&x.getAttribute('data-s')===st});
  lis.forEach(function(x){
    if(allSame)unTask(x);
    else if(x.classList.contains('task'))setTaskState(x,st);

  });
  var f=lis[0].querySelector('.tt')||lis[0];setCaretEnd(f);markDirty();

function wys(name){
  var m=$('md');if(!m)return;
  ensureSel();m.focus({preventScroll:true});
  switch(name){
    case 'h1':case 'h2':case 'h3':wysHeading(+name.charAt(1));break;
    case 'bold':document.execCommand('bold');break;
    case 'italic':document.execCommand('italic');break;
    case 'strike':document.execCommand('strikeThrough');break;
    case 'hl':wrapSel('mark','','\u0646\u0635 \u0645\u0638\u0644\u0644');break;
    case 'icode':wrapSel('code','','\u0643\u0648\u062f');break;
    case 'link':wysLink();break;
    case 'wlink':wrapSel('a','wl','\u0627\u0633\u0645 \u0627\u0644\u0645\u0644\u0627\u062d\u0638\u0629');break;
    case 'tag':wrapSel('span','tag','\u0648\u0633\u0645','#');break;
    case 'list':wysList('UL');break;
    case 'ol':wysList('OL');break;
    case 'quote':wysQuote();break;
    case 'table':wysTable();break;
    case 'hr':wysHr();break;
  }
  markDirty();
}

/* ---------- editing tools ---------- */
function ensureEdit(cb){
  var n=cur();if(!n||state.tabs.indexOf(n.id)<0)return;
  if(n.mode==='read'){n.mode='edit';renderAll()}
  var t=$('editor');if(t)cb(t);
}
function ins(t,from,to,txt,a,b){
  t.focus();t.setSelectionRange(from,to);var ok=false;
  try{ok=document.execCommand('insertText',false,txt)}catch(x){}
  if(!ok)t.setRangeText(txt,from,to,'end');
  t.setSelectionRange(a,b);t.dispatchEvent(new Event('input',{bubbles:true}));
}
function wrap(b,a,ph){ensureEdit(function(t){
  var v=t.value,s=t.selectionStart,e=t.selectionEnd,sel=v.slice(s,e),w=sel||ph;
  if(sel&&v.slice(s-b.length,s)===b&&v.slice(e,e+a.length)===a){ins(t,s-b.length,e+a.length,sel,s-b.length,s-b.length+sel.length);return}
  ins(t,s,e,b+w+a,s+b.length,s+b.length+w.length);
})}
function lineTool(mk,re,ph,same){ensureEdit(function(t){
  var v=t.value,s=t.selectionStart,e=t.selectionEnd,ls=v.lastIndexOf('\n',s-1)+1,le=v.indexOf('\n',e);if(le<0)le=v.length;
  var raw=v.slice(ls,le),lines=raw.split('\n');
  if(!raw.trim()){var p=mk(0);ins(t,ls,le,p+ph,ls+p.length,ls+p.length+ph.length);return}
  var chk=same||function(l){return re.test(l)};
  var all=lines.every(function(l,i){return !l.trim()||chk(l,i)});
  var res=lines.map(function(l,i){if(!l.trim())return l;var b=l.replace(re,'');return all?b:mk(i)+b}).join('\n');
  ins(t,ls,le,res,ls,ls+res.length);
})}
function block(tpl,ph){ensureEdit(function(t){
  var v=t.value,s=t.selectionStart,e=t.selectionEnd,w=v.slice(s,e)||ph;
  var pre=(s>0&&v.charAt(s-1)!=='\n')?'\n':'',post=(e<v.length&&v.charAt(e)!=='\n')?'\n':'';
  var at=pre.length+tpl.indexOf('@@');
  ins(t,s,e,pre+tpl.replace('@@',w)+post,s+at,s+at+w.length);
})}
function heading(n){var h=new Array(n+1).join('#')+' ';lineTool(function(){return h},/^#{1,6}\s+/,'العنوان',function(l){return l.indexOf(h)===0})}
var CALLOUTS=[['note','ملاحظة','blue'],['info','معلومة','blue'],['tip','نصيحة','cyan'],['abstract','ملخص','cyan'],['todo','مهمة','blue'],['success','نجاح','green'],['question','سؤال','yellow'],['warning','تحذير','yellow'],['failure','فشل','red'],['danger','خطر','red'],['bug','خطأ برمجي','red'],['example','مثال','purple'],['quote','اقتباس','gray']];

var LANGS=[['python','Python'],['html','HTML'],['css','CSS'],['javascript','JavaScript'],['','نص عادي']];
var calloutFold='-',pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
function openPop(btn,html,pick){
  closePop();pop=document.createElement('div');pop.className='pop';pop.innerHTML=html;document.body.appendChild(pop);
  var r=btn.getBoundingClientRect(),w=pop.offsetWidth;

function foldHtml(){return '<div class="seg">'+[['-','مغلق'],['+','مفتوح'],['','ثابت']].map(function(f){return '<button type="button" data-k="fold:'+f[0]+'" class="'+(calloutFold===f[0]?'on':'')+'">'+f[1]+'</button>'}).join('')+'</div>'}
function openMenu(kind,btn){
  if(kind==='callout'){
    openPop(btn,foldHtml()+'<div class="grid">'+CALLOUTS.map(function(c){return '<button type="button" class="row c-'+c[2]+'" data-k="'+c[0]+'"><span class="dot"></span>'+c[1]+'</button>'}).join('')+'</div>',function(k,b){
      if(k.indexOf('fold:')===0){calloutFold=k.slice(5);[].forEach.call(pop.querySelectorAll('.seg button'),function(x){x.classList.toggle('on',x.dataset.k===k)});return false}
      if(W())return wysCallout(k,calloutFold);
      block('> [!'+k+']'+calloutFold+' @@\n> المحتوى هنا','العنوان');
    });
  }else if(kind==='code'){
    openPop(btn,LANGS.map(function(l){return '<button type="button" class="row" data-k="'+l[0]+'" data-n="'+l[1]+'">'+l[1]+'<small>'+(l[0]||'text')+'</small></button>'}).join(''),function(k){
      if(W())return wysCode(k);
      block('```'+k+'\n@@\n```','اكتب الكود هنا');
    });
  }else if(kind==='codebox'){
    openPop(btn,[['toggle','مربع كود بتوجل','عنوان + سهم + التفاف'],['plain','مربع كود فقط','بدون توجل']].map(function(o){return '<button type="button" class="row" data-k="'+o[0]+'">'+o[1]+'<small>'+o[2]+'</small></button>'}).join(''),function(k){
      if(W())return k==='plain'?wysCode('','',true):wysCode('','العنوان');
      block(k==='plain'?'``` plain\n@@\n```':'``` title="العنوان"\n@@\n```','اكتب الكود هنا');
    });
  }else if(kind==='tcode'){
    openPop(btn,[['both','CSS + JS','css / js'],['css','CSS \u0641\u0642\u0637','css'],['js','JS \u0641\u0642\u0637','js']].map(function(o){return '<button type="button" class="row" data-k="'+o[0]+'">'+o[1]+'<small>'+o[2]+'</small></button>'}).join(''),function(k){
      if(W())return wysToggleCode(k);
      block('> [!toggle]+ @@\n'+toggleCodeMd(k),'\u0627\u0644\u0639\u0646\u0648\u0627\u0646');
    });
  }else if(kind==='task'){
    openPop(btn,STATES.map(function(s,i){return '<button type="button" class="row" data-k="'+i+'">'+s[1]+'<small>['+s[0]+']</small></button>'}).join(''),function(k){
      var st=STATES[+k][0],pre='- ['+st+'] ';
      if(W())return wysTask(st);
      lineTool(function(){return pre},/^[-*+]\s+\[.\]\s+/,'مهمة',function(l){return l.indexOf(pre)===0});
    });
  }
}
