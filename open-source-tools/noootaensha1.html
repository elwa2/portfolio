<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إيصالات الإيداع - نقابة المهندسين والرعاية الصحية</title>
<style>
  :root {
    --navy: #1b2a4a;
    --navy-light: #2c4270;
    --muted: #6b7280;
    --border: #d8dbe2;
    --bad: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Tahoma", "Segoe UI", "Arial", sans-serif;
    background: #eef0f4;
    margin: 0;
    padding: 30px 16px;
    direction: rtl;
    color: #1a1a1a;
  }
  .wrapper { max-width: 900px; margin: 0 auto; }
  h2 { margin: 0 0 4px; font-size: 17px; color: var(--navy); text-align: center; }
  .sub { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 18px; }

  .panel {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 22px;
    box-shadow: 0 4px 18px rgba(20, 30, 60, 0.06);
  }
  .field label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: var(--navy); }
  .entries-list { display: flex; flex-direction: column; gap: 12px; }
  .entry-row {
    display: grid;
    grid-template-columns: 1.2fr 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: end;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .entry-row .hint { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: -6px; }
  @media (max-width: 640px) {
    .entry-row { grid-template-columns: 1fr 1fr; }
    .entry-row .remove-btn { grid-column: 1 / -1; }
  }
  .entry-row .field { margin: 0; }
  .entry-row input {
    width: 100%;
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    border: 1px solid #c7cbd4;
    border-radius: 7px;
    background: #fff;
  }
  .entry-row input:focus { outline: none; border-color: var(--navy-light); box-shadow: 0 0 0 3px rgba(44,66,112,.12); }
  .entry-row .remove-btn {
    background: #fbeceb; color: var(--bad); border: none; border-radius: 7px;
    padding: 8px 12px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .entry-row .remove-btn:hover { background: #f6d9d7; }
  .entries-actions { display: flex; gap: 10px; margin-top: 14px; }
  .add-btn, .print-btn {
    flex: 1; padding: 11px; border: none; border-radius: 9px;
    font-size: 14.5px; font-weight: bold; cursor: pointer; font-family: inherit;
  }
  .add-btn { background: #eef1f6; color: var(--navy); border: 1px solid var(--border); }
  .add-btn:hover { background: #e3e7ee; }
  .add-btn:disabled { opacity: .5; cursor: not-allowed; }
  .print-btn { background: var(--navy); color: #fff; }
  .print-btn:hover { background: var(--navy-light); }

  /* ================= A4 sheet ================= */
  .a4-sheet {
    background: #fff;
    border: 1px solid var(--border);
    box-shadow: 0 4px 18px rgba(20, 30, 60, 0.06);
    width: 210mm;
    max-width: 100%;
    margin: 0 auto;
    padding: 10mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: max-content;
    align-content: start;
    align-items: start;
    gap: 8mm 7mm;
  }
  .person-block {
    display: flex;
    flex-direction: column;
    gap: 5mm;
  }
  .person-block.empty { visibility: hidden; }

  /* ---- receipt box: thick outer border + thin inner line (like the original) ---- */
  .receipt {
    border: 1.6mm solid #000;
    padding: 1.4mm;
    background: #fff;
    display: flex;
  }
  .receipt-inner {
    flex: 1;
    border: 0.35mm solid #000;
    padding: 2.5mm 3.5mm 2.5mm;
    display: flex;
    flex-direction: column;
    font-family: "Arial", "Tahoma", sans-serif;
    font-weight: bold;
    font-size: 13pt;
    line-height: 1.5;
    color: #000;
  }
  .receipt .title { text-align: right; }
  .receipt .acc-row { text-align: right; }
  .receipt .acc-num { direction: ltr; unicode-bidi: isolate; display: inline-block; letter-spacing: .3px; }
  .receipt .amount-row { text-align: right; }
  .receipt .name-row { text-align: right; margin-top: 3mm; min-height: 1.5em; }
  .receipt .val { font-weight: bold; }

  @page { size: A4; margin: 0; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; padding: 0; margin: 0; }
    .wrapper { max-width: 100%; }
    .a4-sheet {
      box-shadow: none; border: none; margin: 0;
      width: 210mm; min-height: 297mm;
    }
    .person-block, .receipt { break-inside: avoid; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div class="wrapper">

  <div class="no-print">
    <h2>إيصالات الإيداع</h2>
    <div class="sub">نقابة المهندسين — الرعاية الصحية والاجتماعية غير المنتظمة</div>
  </div>

  <div class="panel no-print">
    <h2 style="text-align:right;font-size:15px;">الأسماء (حتى 4 أسماء في الورقة)</h2>
    <div class="entries-list" id="entriesList"></div>
    <div class="entries-actions">
      <button class="add-btn" id="addBtn" onclick="addEntry()">+ إضافة اسم</button>
      <button class="print-btn" onclick="window.print()">🖨️ طباعة</button>
    </div>
  </div>

  <div class="a4-sheet" id="a4Sheet"></div>
</div>

<script>
  const ENG_ACCOUNT = "0906013000421818";
  const CARE_ACCOUNT = "0900113001211818";
  const SYNDICATE_RATE = 0.0045;
  const DIFF = 50;

  function round2(n) { return Math.round(n * 100) / 100; }

  function parseAmount(value) {
    const normalized = String(value)
      .replace(/[٠-٩]/g, digit => String('٠١٢٣٤٥٦٧٨٩'.indexOf(digit)))
      .replace(/[۰-۹]/g, digit => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(digit)))
      .replace(/[٬,]/g, '')
      .replace(/[٫،]/g, '.')
      .trim();
    if (!normalized) return null;
    const amount = Number(normalized);
    return Number.isFinite(amount) ? amount : null;
  }

  // أرقام هندية زي الصورة
  function toAr(v) {
    return String(v).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]).replace('.', '٫');
  }

  let entries = [{ name: '', works: '', care: '', syn: '', synManual: false }];
  const MAX_ENTRIES = 4;

  function addEntry() {
    if (entries.length >= MAX_ENTRIES) return;
    entries.push({ name: '', works: '', care: '', syn: '', synManual: false });
    renderAll();
  }
  function removeEntry(i) {
    if (entries.length <= 1) return;
    entries.splice(i, 1);
    renderAll();
  }

  function renderInputs() {
    const list = document.getElementById('entriesList');
    list.innerHTML = '';
    entries.forEach((e, i) => {
      const row = document.createElement('div');
      row.className = 'entry-row';
      row.innerHTML = `
        <div class="field">
          <label>اسم المودع ${i + 1}</label>
          <input type="text" data-idx="${i}" data-key="name" value="${escapeHtml(e.name)}" placeholder="اكتب الاسم">
        </div>
        <div class="field">
          <label>قيمة الأعمال (اختياري)</label>
          <input type="text" inputmode="decimal" data-idx="${i}" data-key="works" value="${escapeHtml(e.works)}" placeholder="مثال: 200000">
        </div>
        <div class="field">
          <label>مبلغ الرعاية</label>
          <input type="text" inputmode="decimal" data-idx="${i}" data-key="care" value="${escapeHtml(e.care)}" placeholder="مثال: 780">
        </div>
        <div class="field">
          <label>مبلغ النقابة ${e.synManual ? '(مخصص)' : '(تلقائي)'}</label>
          <input type="text" inputmode="decimal" data-idx="${i}" data-key="syn" value="${escapeHtml(e.syn)}" placeholder="تلقائي أو اكتب مبلغ">
        </div>
        <button class="remove-btn" onclick="removeEntry(${i})" ${entries.length <= 1 ? 'style="visibility:hidden"' : ''}>حذف</button>
        <div class="hint">اكتب قيمة الأعمال هيتحسب مبلغ الرعاية والنقابة أوتوماتيك. ولو كتبت مبلغ النقابة بنفسك هيثبت ومش هيتغير؛ امسحه عشان يرجع تلقائي</div>
      `;
      list.appendChild(row);
    });

    list.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('input', (ev) => {
        const idx = parseInt(ev.target.dataset.idx);
        const key = ev.target.dataset.key;
        const en = entries[idx];
        en[key] = ev.target.value;
        const q = k => list.querySelector(`input[data-idx="${idx}"][data-key="${k}"]`);

        if (key === 'works') {
          const amount = parseAmount(ev.target.value);
          if (amount !== null) {
            en.care = String(round2(amount * SYNDICATE_RATE + DIFF));
            q('care').value = en.care;
          }
        }
        if (key === 'syn') {
          en.synManual = ev.target.value.trim() !== '';
        }
        if (key !== 'syn' && !en.synManual) {
          const care = parseAmount(en.care);
          en.syn = care !== null ? String(round2(care - DIFF)) : '';
          q('syn').value = en.syn;
        }
        if (key === 'syn' && !en.synManual) {
          const care = parseAmount(en.care);
          en.syn = care !== null ? String(round2(care - DIFF)) : '';
          q('syn').value = en.syn;
        }
        const lbl = q('syn').parentElement.querySelector('label');
        lbl.textContent = 'مبلغ النقابة ' + (en.synManual ? '(مخصص)' : '(تلقائي)');
        renderPreview();
      });
    });

    document.getElementById('addBtn').disabled = entries.length >= MAX_ENTRIES;
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function receipt(title, account, amount, name) {
    return `
      <div class="receipt"><div class="receipt-inner">
        <div class="title">${title}</div>
        <div class="acc-row">رقم الحساب <span class="acc-num">${toAr(account)}</span></div>
        <div class="amount-row">المبلغ المطلوب / <span class="val">${amount === null ? '' : toAr(Math.ceil(amount))}</span></div>
        <div class="name-row">أسم المودع / <span class="val">${escapeHtml(name)}</span></div>
      </div></div>`;
  }

  function renderPreview() {
    const sheet = document.getElementById('a4Sheet');
    sheet.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const cell = document.createElement('div');
      if (i < entries.length) {
        const e = entries[i];
        const name = e.name.trim();
        const careVal = parseAmount(e.care);
        const hasCare = careVal !== null;
        const synVal = parseAmount(e.syn) ?? (hasCare ? round2(careVal - DIFF) : null);

        cell.className = 'person-block';
        cell.innerHTML =
          receipt('فرع نقابة المهندسين كفر الشيخ بالبريد المصرى فرع كفر الشيخ', ENG_ACCOUNT, synVal, name) +
          receipt('الرعاية الصحية والاجتماعية للعمالة غير المنتظمة بالبريد المصرى فرع كفر الشيخ', CARE_ACCOUNT, careVal, name);
      } else {
        cell.className = 'person-block empty';
      }
      sheet.appendChild(cell);
    }
  }

  function renderAll() { renderInputs(); renderPreview(); }
  renderAll();
</script>
</body>
</html>
