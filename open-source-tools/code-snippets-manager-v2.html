<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدير الأكواد 🌶️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
   <link
      rel="icon"
      href="../assets/images/logo ico.svg"
      type="image/svg+xml"
    /><style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:      #0e0e10;
    --bg-raised:    #141417;
    --bg-elevated:  #1a1a1f;
    --bg-overlay:   #202026;
    --glass-sub:    rgba(255,255,255,0.03);
    --glass-mod:    rgba(255,255,255,0.055);
    --glass-str:    rgba(255,255,255,0.09);
    --border-sub:   rgba(255,255,255,0.06);
    --border-def:   rgba(255,255,255,0.10);
    --border-str:   rgba(255,255,255,0.17);
    --border-acc:   rgba(232,115,74,0.32);
    --text-1:       #f0ede8;
    --text-2:       #9b9693;
    --text-3:       #5c5855;
    --text-4:       #3a3835;
    --accent:       #e8734a;
    --accent-warm:  #d4a843;
    --accent-cool:  #6b9bd2;
    --accent-glow:  rgba(232,115,74,0.14);
    --shadow-sm:    0 2px 8px rgba(0,0,0,0.4);
    --shadow-md:    0 4px 20px rgba(0,0,0,0.5);
    --shadow-lg:    0 8px 40px rgba(0,0,0,0.6);
    --radius-sm:    8px;
    --radius-md:    12px;
    --radius-lg:    16px;
    --success:      #4ade80;
    --danger:       #f87171;
    --info:         #60a5fa;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-base);
    color: var(--text-1);
    min-height: 100vh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== TOPBAR ===== */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 16px;
    padding: 0 28px; height: 60px;
    background: rgba(14,14,16,0.85);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--border-sub);
    box-shadow: var(--shadow-sm);
  }

  .logo-wrap { display: flex; align-items: center; gap: 10px; }
  .logo-text {
    font-size: 18px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-1);
  }
  .logo-emoji { font-size: 20px; }
  .logo-sub { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 1px; }

  .search-wrap {
    flex: 1; max-width: 340px; margin-inline-start: auto; position: relative;
  }
  .search-input {
    width: 100%; height: 36px; padding: 0 36px 0 14px;
    border: 1px solid var(--border-sub); border-radius: var(--radius-sm);
    background: var(--bg-elevated); color: var(--text-1);
    font-family: 'Cairo', sans-serif; font-size: 13px; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    direction: rtl;
  }
  .search-input::placeholder { color: var(--text-3); }
  .search-input:focus {
    border-color: var(--border-def);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    font-size: 15px; color: var(--text-3); pointer-events: none;
  }

  .count-badge {
    font-size: 11px; font-weight: 500; padding: 4px 12px;
    background: var(--bg-elevated); border: 1px solid var(--border-sub);
    border-radius: 20px; color: var(--text-2); white-space: nowrap;
  }

  .topbar-actions { display: flex; gap: 8px; }
  .topbar-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-def); background: transparent;
    color: var(--text-2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; font-family: 'Cairo', sans-serif;
  }
  .topbar-btn:hover { background: var(--glass-mod); color: var(--text-1); border-color: var(--border-str); }
  .topbar-btn i { font-size: 14px; }

  /* ===== FILTER BAR ===== */
  .filter-bar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 28px; border-bottom: 1px solid var(--border-sub);
    background: var(--bg-raised);
  }
  .filter-label { font-size: 11px; color: var(--text-3); font-weight: 600; letter-spacing: 0.07em; margin-inline-end: 4px; }
  .filter-tag {
    font-size: 11px; font-weight: 500; padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--border-sub); background: transparent;
    color: var(--text-2); cursor: pointer; transition: all 0.15s;
    font-family: 'Cairo', sans-serif;
  }
  .filter-tag:hover { border-color: var(--border-def); color: var(--text-1); }
  .filter-tag.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
    box-shadow: 0 2px 12px rgba(232,115,74,0.3);
  }
  .filter-tag.starred-btn { display: flex; align-items: center; gap: 5px; }
  .filter-tag svg { vertical-align: -2px; margin-inline-end: 5px; }

  /* ===== MAIN BODY ===== */
  .main-body {
    max-width: 1200px; margin: 0 auto; padding: 20px 28px 60px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-items: start;
  }

  /* ===== SECTION ===== */
  .section {
    border-radius: var(--radius-md);
    border: 1px solid var(--border-sub);
    background: var(--bg-raised);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .section:hover { border-color: var(--border-def); }

  .section-head {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; cursor: pointer; user-select: none;
    transition: background 0.15s;
  }
  .section-head:hover { background: var(--glass-sub); }

  .chevron {
    font-size: 14px; color: var(--text-3);
    transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(90deg); color: var(--accent); }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text-2); flex: 1; }
  .section-head:hover .section-title { color: var(--text-1); }

  .section-tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .stag {
    font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 10px;
    border: 1px solid var(--border-sub); color: var(--text-3);
    letter-spacing: 0.04em;
  }

  .code-count { font-size: 11px; color: var(--text-3); font-weight: 400; }

  .section-actions { display: flex; align-items: center; gap: 2px; margin-inline-start: 4px; }
  .star-btn {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-3);
    cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s;
  }
  .star-btn:hover { background: var(--glass-mod); color: var(--accent-warm); }
  .star-btn.starred { color: var(--accent-warm); }
  .star-btn i { font-size: 16px; }

  .delete-btn {
    width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--text-4);
    cursor: pointer; border-radius: var(--radius-sm); transition: all 0.15s;
    opacity: 0;
  }
  .section:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { background: rgba(248,113,113,0.12); color: var(--danger); }
  .delete-btn i { font-size: 16px; }

  /* ===== SECTION BODY ===== */
  .section-body {
    display: none; padding: 0 14px 10px;
  }
  .section-body.open { display: block; animation: slideDown 0.2s cubic-bezier(0.4,0,0.2,1); }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-desc {
    font-size: 12px; color: var(--text-3); padding: 8px 0 8px;
    line-height: 1.6; border-bottom: 1px solid var(--border-sub); margin-bottom: 8px;
  }

  /* ===== CODE BLOCK ===== */
  .code-block {
    border-radius: 0; border: 1px solid var(--border-sub);
    background: var(--bg-elevated); overflow: hidden; margin-bottom: 0; border-bottom: none;
  }
  .code-block:last-child { border-bottom: 1px solid var(--border-sub); border-radius: 0 0 var(--radius-sm) var(--radius-sm); }
  .code-block:first-child { border-radius: var(--radius-sm) var(--radius-sm) 0 0; }

  .code-header {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    background: var(--bg-overlay); border-bottom: 1px solid var(--border-sub);
  }
  .lang-badge {
    font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 6px;
    border: 1px solid var(--border-sub); font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
  }
  .lang-badge.css  { color: var(--accent-cool); border-color: rgba(107,155,210,0.3); }
  .lang-badge.js   { color: var(--accent-warm); border-color: rgba(212,168,67,0.3); }
  .lang-badge.html { color: #f97316; border-color: rgba(249,115,22,0.3); }

  .code-actions { margin-inline-start: auto; display: flex; gap: 6px; }
  .copy-btn {
    display: flex; align-items: center; gap: 5px; padding: 5px 12px;
    border: 1px solid var(--border-def); border-radius: 6px;
    background: transparent; color: var(--text-2); font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; font-family: 'Cairo', sans-serif;
  }
  .copy-btn:hover { background: var(--glass-mod); color: var(--text-1); border-color: var(--border-str); }
  .copy-btn.copied { color: var(--success); border-color: rgba(74,222,128,0.35); }
  .copy-btn i { font-size: 13px; }

  .topbar-btn.active { background: var(--accent-glow); color: var(--accent); border-color: var(--border-acc); }

  .code-pre {
    padding: 12px 14px; overflow-x: auto; margin: 0;
    font-size: 12.5px; font-family: 'JetBrains Mono', monospace;
    line-height: 1.6; color: var(--text-2);
    direction: ltr; text-align: left;
    white-space: pre;
  }
  .code-pre.wrap { white-space: pre-wrap; word-break: break-word; overflow-x: hidden; }
  .code-pre::-webkit-scrollbar { height: 4px; }
  .code-pre::-webkit-scrollbar-track { background: transparent; }
  .code-pre::-webkit-scrollbar-thumb { background: var(--border-def); border-radius: 4px; }

  .kw  { color: var(--accent-cool); }
  .val { color: var(--accent-warm); }
  .sel { color: var(--accent); }
  .cmt { color: var(--text-3); font-style: italic; }
  .str { color: var(--success); }

  /* ===== HIGHLIGHT MATCH ===== */
  .hl { background: rgba(212,168,67,0.22); border-radius: 3px; color: var(--text-1); }

  /* ===== VAR PANEL ===== */
  .var-panel {
    background: var(--bg-overlay); border: 1px solid var(--border-sub);
    border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 10px;
  }
  .var-title { font-size: 11px; font-weight: 600; color: var(--text-2); margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
  .var-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .var-row:last-child { margin-bottom: 0; }
  .var-label { font-size: 11px; color: var(--text-3); min-width: 60px; direction: ltr; font-family: 'JetBrains Mono', monospace; }
  .var-input {
    flex: 1; padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border-sub);
    background: var(--bg-elevated); color: var(--text-1); font-size: 12px;
    font-family: 'Cairo', sans-serif; outline: none; transition: border-color 0.15s; direction: rtl;
  }
  .var-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
  .var-input[type="color"] { width: 36px; height: 30px; padding: 2px; cursor: pointer; flex: none; }
  .var-input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  .var-input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border-def); border-radius: 3px; }
  .var-input[type="range"] { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; border-radius: 2px; background: var(--border-def); outline: none; padding: 0; border: none; cursor: pointer; }
  .var-input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-raised); cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .var-input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-raised); cursor: pointer; }
  .var-val { font-size: 11px; color: var(--text-2); min-width: 32px; text-align: center; font-family: 'JetBrains Mono', monospace; direction: ltr; }
  .color-swatch { display: inline-block; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border-def); flex-shrink: 0; transition: background 0.15s; }

  .base-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-sub); margin-bottom: 8px; }
  .color-swatch-lg { display: inline-block; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-def); flex-shrink: 0; }
  .picker-lg { width: 44px !important; height: 36px !important; flex: none !important; }
  .base-hex { font-size: 13px; font-weight: 600; color: var(--text-1); font-family: 'JetBrains Mono', monospace; direction: ltr; min-width: 80px; }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text-3);
  }
  .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; color: var(--text-4); }
  .empty-state p { font-size: 14px; }

  /* ===== MODAL ADD ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px); z-index: 200;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--bg-elevated); border: 1px solid var(--border-def);
    border-radius: var(--radius-lg); padding: 28px; width: 100%; max-width: 560px;
    box-shadow: var(--shadow-lg);
    animation: scaleIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
    direction: rtl;
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 20px; color: var(--text-1); }

  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; display: block; letter-spacing: 0.04em; }
  .form-input, .form-textarea, .form-select {
    width: 100%; padding: 9px 13px; border: 1px solid var(--border-def);
    border-radius: var(--radius-sm); background: var(--bg-raised);
    color: var(--text-1); font-family: 'Cairo', sans-serif; font-size: 13px;
    outline: none; direction: rtl; transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus, .form-textarea:focus, .form-select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .form-textarea { resize: vertical; min-height: 100px; font-family: 'JetBrains Mono', monospace; font-size: 12px; direction: ltr; text-align: left; }
  .form-select { cursor: pointer; }
  .form-select option { background: var(--bg-elevated); }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-start; margin-top: 20px; }
  .btn-primary {
    padding: 9px 22px; border-radius: var(--radius-sm); border: none;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.2s;
  }
  .btn-primary:hover { filter: brightness(1.1); box-shadow: 0 4px 16px rgba(232,115,74,0.4); }
  .btn-cancel {
    padding: 9px 18px; border-radius: var(--radius-sm); border: 1px solid var(--border-def);
    background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.15s;
  }
  .btn-cancel:hover { background: var(--glass-mod); color: var(--text-1); }

  /* ===== CONFIRM MODAL ===== */
  .confirm-text { font-size: 14px; color: var(--text-2); margin-bottom: 16px; }
  .btn-danger {
    padding: 9px 22px; border-radius: var(--radius-sm); border: none;
    background: var(--danger); color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; font-family: 'Cairo', sans-serif; transition: all 0.2s;
  }
  .btn-danger:hover { filter: brightness(1.1); box-shadow: 0 4px 16px rgba(248,113,113,0.4); }

  /* ===== TOAST ===== */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-overlay); border: 1px solid var(--border-def);
    border-radius: var(--radius-sm); padding: 10px 20px;
    font-size: 13px; color: var(--text-1); z-index: 300;
    opacity: 0; transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
    box-shadow: var(--shadow-md);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast i { font-size: 15px; color: var(--success); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 820px) {
    .main-body { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .topbar { padding: 0 16px; gap: 10px; }
    .main-body { padding: 14px 16px 48px; }
    .filter-bar { padding: 8px 16px; }
    .search-wrap { max-width: 200px; }
    .topbar-btn span { display: none; }
    .logo-sub { display: none; }
  }

  /* ===== HAS DASHBOARD ===== */
  .has-dash {
    grid-column: 1 / -1;
  }

  .has-builder {
    background: var(--bg-raised);
    border: 1px solid var(--border-def);
    border-radius: var(--radius-lg);
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .has-builder-title {
    font-size: 15px; font-weight: 700; color: var(--text-1);
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .has-builder-title i { color: var(--accent); font-size: 18px; }

  .has-builder-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    margin-bottom: 10px;
  }

  .has-builder-grid .form-group { margin-bottom: 0; }

  .has-builder .form-label {
    font-size: 11px; font-weight: 600; color: var(--text-2);
    margin-bottom: 4px; display: flex; align-items: center; gap: 4px;
  }
  .has-builder .form-label code {
    font-size: 10px; background: var(--bg-overlay); padding: 1px 6px;
    border-radius: 4px; color: var(--accent); font-family: 'JetBrains Mono', monospace;
  }

  .has-input {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border-def);
    border-radius: var(--radius-sm); background: var(--bg-elevated);
    color: var(--text-1); font-family: 'JetBrains Mono', monospace;
    font-size: 12px; outline: none; direction: ltr; text-align: left;
    transition: border-color 0.2s;
  }
  .has-input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .has-preview-wrap {
    background: var(--bg-overlay); border: 1px solid var(--border-sub);
    border-radius: var(--radius-sm); padding: 12px 14px; margin: 10px 0 14px;
    position: relative;
  }
  .has-preview-label {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .has-preview {
    font-family: 'JetBrains Mono', monospace; font-size: 12.5px;
    color: var(--accent); direction: ltr; text-align: left;
    word-break: break-all; line-height: 1.7; white-space: pre-wrap;
    min-height: 20px;
  }
  .has-preview .has-base-part { color: var(--text-2); }
  .has-preview .has-has-part { color: var(--accent-cool); }

  .has-actions { display: flex; gap: 8px; margin-top: 4px; }

  .has-section-title {
    font-size: 13px; font-weight: 700; color: var(--text-2);
    margin: 20px 0 10px; display: flex; align-items: center; gap: 6px;
  }
  .has-section-title span { color: var(--text-3); font-weight: 400; }

  .has-empty {
    text-align: center; padding: 32px 20px; color: var(--text-3);
    border: 1px dashed var(--border-sub); border-radius: var(--radius-md);
  }
  .has-empty i { font-size: 28px; display: block; margin-bottom: 6px; color: var(--text-4); }
  .has-empty p { font-size: 13px; }

  .filter-tag.has-active {
    background: var(--accent-cool); color: #fff; border-color: var(--accent-cool);
    box-shadow: 0 2px 12px rgba(107,155,210,0.3);
  }

  .filter-tag.scrollbar-active {
    background: #8b5cf6; color: #fff; border-color: #8b5cf6;
    box-shadow: 0 2px 12px rgba(139,92,246,0.3);
  }

<body>

<!-- TOPBAR -->
<header class="topbar">
  <div class="logo-wrap">
    <div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="logo-text">مدير الأكواد</span>
        <span class="logo-emoji">🌶️</span>
      </div>
      <div class="logo-sub">اضغط للفتح · انسخ بنقرة واحدة</div>
    </div>
  </div>

  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="ابحث عن كود..." autocomplete="off" oninput="renderAll()">
    <i class="ti ti-search search-icon" aria-hidden="true"></i>
  </div>

  <span class="count-badge" id="countBadge">0 كود</span>

  <div class="topbar-actions">
    <button class="topbar-btn" onclick="openModal()" title="إضافة كود جديد">
      <i class="ti ti-plus" aria-hidden="true"></i>
      <span>إضافة</span>
    </button>
    <button class="topbar-btn" onclick="toggleAll()" title="فتح الكل">
      <i class="ti ti-arrows-maximize" aria-hidden="true"></i>
      <span>فتح الكل</span>
    </button>
    <button class="topbar-btn" id="wrapBtn" onclick="toggleWrap()" title="لف الكود الطويل">
      <i class="ti ti-text-wrap" aria-hidden="true"></i>
      <span>لف</span>
    </button>
    <button class="topbar-btn" onclick="toggleAll(false)" title="إغلاق الكل">
      <i class="ti ti-arrows-minimize" aria-hidden="true"></i>
      <span>إغلاق الكل</span>
    </button>
    <button class="topbar-btn" onclick="exportData()" title="تصدير JSON">
      <i class="ti ti-download" aria-hidden="true"></i>
      <span>تصدير</span>
    </button>
    <label class="topbar-btn" style="cursor:pointer" title="استيراد JSON">
      <i class="ti ti-upload" aria-hidden="true"></i>
      <span>استيراد</span>
      <input type="file" accept=".json" style="display:none" onchange="importData(event)">
    </label>
  </div>
</header>

<!-- FILTER BAR -->
<div class="filter-bar" id="filterBar">
  <span class="filter-label">فلتر</span>
  <button class="filter-tag active" data-tag="all" onclick="setTag(this)">الكل</button>
  <button class="filter-tag" data-tag="css" onclick="setTag(this)">CSS</button>
  <button class="filter-tag" data-tag="responsive" onclick="setTag(this)">Responsive</button>
  <button class="filter-tag" data-tag="brand" onclick="setTag(this)">Brand</button>
  <button class="filter-tag" data-tag="salla" onclick="setTag(this)">Salla</button>
  <button class="filter-tag" data-tag="has" onclick="setTag(this)">:has()</button>
  <button class="filter-tag" data-tag="javascript" onclick="setTag(this)">JavaScript</button>
  <button class="filter-tag starred-btn" data-tag="starred" onclick="setTag(this)">
    <i class="ti ti-star" aria-hidden="true"></i> محفوظ
  </button>
    <button class="filter-tag" id="hasDashBtn" onclick="toggleHasDash()" title="مُحددات :has()">
      <i class="ti ti-code" aria-hidden="true"></i> :has()
    </button>
    <button class="filter-tag" id="sbDashBtn" onclick="toggleScrollbarDash()" title="لوحة تحكم السكرول بار">
      <i class="ti ti-scroll" aria-hidden="true"></i> Scrollbar
    </button>
    <button class="filter-tag" id="cvDashBtn" onclick="toggleCvDash()" title="محول HTML/CSS إلى كود صحيح">
      <i class="ti ti-arrows-shuffle" aria-hidden="true"></i> محول
    </button>
    <button class="filter-tag" id="vdDashBtn" onclick="toggleVdDash()" title="نسخ ومقارنة الأكواد">
      <i class="ti ti-versions" aria-hidden="true"></i> النسخ
    </button>
    <button class="filter-tag" id="edDashBtn" onclick="toggleEdDash()" title="محرر أكواد بترقيم الأسطر">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg> المحرر
    </button>
    <button class="filter-tag" id="devDashBtn" onclick="toggleDevDash()" title="ضاغط CSS وJS، تعمية JS، تشفير SVG">
      <i class="ti ti-tools" aria-hidden="true"></i> أدوات
    </button>
    <button class="filter-tag" id="b64DashBtn" onclick="toggleB64Dash()" title="ترميز وفك ترميز Base64 وتحويل الصور إلى Base64">
      <i class="ti ti-binary" aria-hidden="true"></i> Base64
    </button>
    <button class="filter-tag" id="qrDashBtn" onclick="toggleQrDash()" title="مولد رموز QR">
      <i class="ti ti-qrcode" aria-hidden="true"></i> QR
    </button>

      <i class="ti ti-palette" aria-hidden="true"></i> الألوان
    </button>
    <button class="filter-tag" id="rtDashBtn" onclick="toggleRtDash()" title="لوحة التحكم - باقة الثيم وكود HTML بروت مخصص">
      <i class="ti ti-adjustments-horizontal" aria-hidden="true"></i> التحكم
    </button>
    <button class="filter-tag" id="pvDashBtn" onclick="togglePvDash()" title="معاينة الموقع للكمبيوتر والموبايل جنباً إلى جنب مع سكرول متزامن وتلقائي">
      <i class="ti ti-device-mobile-desktop" aria-hidden="true"></i> معاينة
    </button>
  </div>

<!-- MAIN BODY -->
<main class="main-body" id="mainBody"></main>

<!-- ADD MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-label="إضافة كود جديد">
    <div class="modal-title">إضافة كود جديد</div>

    <div class="form-group">
      <label class="form-label" for="inp-title">عنوان القسم</label>
      <input class="form-input" id="inp-title" type="text" placeholder="مثال: Custom Logo - تغيير اللوجو">
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-desc">وصف مختصر</label>
      <input class="form-input" id="inp-desc" type="text" placeholder="ما الذي يفعله هذا الكود؟">
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-tags">التاجات (مفصولة بفاصلة)</label>
      <input class="form-input" id="inp-tags" type="text" placeholder="css, salla, brand">
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-lang">لغة الكود</label>
      <select class="form-select" id="inp-lang">
        <option value="CSS">CSS</option>
        <option value="JS">JavaScript</option>
        <option value="HTML">HTML</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label" for="inp-code">الكود</label>
      <textarea class="form-textarea" id="inp-code" placeholder="الصق الكود هنا..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-primary" onclick="addSection()">حفظ الكود</button>
      <button class="btn-cancel" onclick="closeModal()">إلغاء</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="modal-overlay" id="confirmOverlay" onclick="closeConfirmOutside(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-label="تأكيد الحذف" style="max-width:400px">
    <div class="modal-title" style="color:var(--danger)">حذف الكود</div>
    <p class="confirm-text" id="confirmText">هل أنت متأكد من حذف هذا الكود؟</p>
    <div class="modal-actions">
      <button class="btn-danger" id="confirmDeleteBtn">حذف</button>
      <button class="btn-cancel" onclick="closeConfirm()">إلغاء</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast" role="status" aria-live="polite">

  <span id="toastMsg">تم النسخ!</span>
</div>

  // ── HELPERS ──
  function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function genId(s){ return s.id || s.title.replace(/[^a-z0-9]/gi,'_').substring(0,30) + '_' + Date.now(); }
  function isJS(c){ return /function|const |let |var |fetch\(|allowedDomains|\.log\(|=>/.test(c); }
  function detectTag(t){ if(isJS(t.c)) return 'javascript'; if(t.g.some(x=>['layout','responsive','media'].includes(x))) return 'responsive'; if(t.g.some(x=>['brand','logo'].includes(x))) return 'brand'; if(t.g.some(x=>['has'].includes(x))) return 'has'; if(t.g.some(x=>['salla','zid','cart','product','footer','button'].includes(x))) return 'salla'; return 'css'; }

  let DATA = SRC.map((s,i) => {
    const std = {
      id: 's' + i,
      title: s.t,
      tags: s.g,
      starred: false,
      desc: s.t.split(' - ')[1] || s.t.split(' - ')[0] || 'مقطع كود'
    };
    if (s.p) return { ...std, patterns: s.p, selectedPattern: 0, codes: [{ lang: isJS(s.p[0].code) ? 'JS' : 'CSS', code: s.p[0].code }] };
    return { ...std, codes: [{ lang: isJS(s.c) ? 'JS' : 'CSS', code: s.c }] };
  });

  let openIds  = new Set();
  let starredIds = new Set();
  let activeTag = 'all';
  let wrapMode = true;
  let _deleteTargetId = null;
  let _deleteSnippetId = null;
  let _initDone = false;
  let varValues = new Map();
  let showHasDash = false;
  let showVdDash = false;
  let showEdDash = false;
  let showCpDash = false;
  let showRtDash = false;
  let showPvDash = false;

  // ── SYNTAX HIGHLIGHT ──
  function syntaxHL(code){
    let s = escHtml(code);
    s = s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/g, m => `<span class="cmt">${m}</span>`);
    s = s.replace(/(&quot;[^&]*&quot;|&#39;[^&]*&#39;|url\([^)]*\))/g, m => `<span class="str">${m}</span>`);
    const kws = ['@media','@keyframes','@font-face','@import','@supports','!important','content','display','background','border','padding','margin','color','height','width','max-height','direction','box-sizing','font-family','border-radius','overflow','position','transform','transition','animation','flex','grid','gap','aspect-ratio','scroll-behavior','filter','backdrop-filter','accent-color'];
    kws.forEach(k => { s = s.replace(new RegExp(`\\b(${k})\\b`, 'g'), '<span class="kw">$1</span>'); });
    s = s.replace(/((?:[\.\#\:][a-zA-Z][^\{<\n]*|\*)\s*(?=\{))/g, m => `<span class="sel">${m}</span>`);
    return s;
  }

  function hlQuery(text, q){
    if(!q) return escHtml(text);
    const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return escHtml(text).replace(re, '<span class="hl">$1</span>');
  }

  // ── COLOR HELPERS ──
  const colorNames = {
    black:'#000000', silver:'#c0c0c0', gray:'#808080', white:'#ffffff',
    maroon:'#800000', red:'#ff0000', purple:'#800080', fuchsia:'#ff00ff',
    green:'#008000', lime:'#00ff00', olive:'#808000', yellow:'#ffff00',
    navy:'#000080', blue:'#0000ff', teal:'#008080', aqua:'#00ffff',
    orange:'#ffa500', cyan:'#00ffff', pink:'#ffc0cb', brown:'#a52a2a'
  };

  function parseColor(str) {
    if (!str) return null;
    str = str.trim().toLowerCase();
    if (colorNames[str]) str = colorNames[str];
    const m = str.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/);
    if (!m) return null;
    let hex = m[1];
    if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    return { r: parseInt(hex.substring(0,2), 16), g: parseInt(hex.substring(2,4), 16), b: parseInt(hex.substring(4,6), 16) };
  }

  function mixColors(c1, c2, pct) {
    const a = parseColor(c1), b = parseColor(c2);
    if (!a || !b) return null;
    const f = Math.min(100, Math.max(0, Number(pct))) / 100;
    const r = Math.round(a.r + (b.r - a.r) * f);
    const g = Math.round(a.g + (b.g - a.g) * f);
    const b_ = Math.round(a.b + (b.b - a.b) * f);
    return '#' + [r,g,b_].map(v => v.toString(16).padStart(2,'0')).join('');
  }

  // ── VARIABLE DETECTION ──
  function detectVars(code){
    const vars = [];
    const seen = new Set();
    let urlIdx = 0, textIdx = 0, pctIdx = 0;

    const allDefRe = /(--[\w-]+)\s*:\s*([^;{]+);/g;
    let m;
    while ((m = allDefRe.exec(code)) !== null) {
      const key = m[1], val = m[2].trim();
      seen.add(key);
      const cmRe = /color-mix\(in\s+srgb,\s*var\((--\d+)\),\s*([^,)]+?)\s+(\d+)%\s*\)/;
      const cm = val.match(cmRe);
      if (cm) {
        pctIdx++;
        const pctKey = '__pct_' + pctIdx;
        const short = key.replace(/^--color-|^--/, '');
        vars.push({ key: pctKey, label: short + ' (' + cm[2].trim() + ' ' + cm[3] + '%)', value: cm[3], type: 'range', baseVar: cm[1], secondColor: cm[2].trim(), varName: key });
      } else if (/^--\d+$/.test(key) || /^#[0-9a-fA-F]{3,8}$/.test(val)) {
        vars.push({ key, label: key, value: val, type: /^#[0-9a-fA-F]{3,8}$/.test(val) ? 'color' : 'text' });
      }
    }

    const refRe = /var\(\s*(--[\w-]+)\s*\)/g;
    while ((m = refRe.exec(code)) !== null) {
      const key = m[1];
      if (!seen.has(key)) { seen.add(key); vars.push({ key, label: key, value: '', type: 'text' }); }
    }

    const urlRe = /(url\s*\()\s*["']?([^)"']*)["']?\s*(\))/g;
    while ((m = urlRe.exec(code)) !== null) {
      let inner = m[2].trim();
      const hasProto = /^https?:\/\//i.test(inner);
      if (!inner || /^(IMAGE|BANNER|LOGO|NEW_|YOUR)/i.test(inner) || hasProto) {
        urlIdx++;
        if (hasProto) inner = inner.replace(/^https?:\/\//i, '');
        const key = '__url_' + urlIdx;
        vars.push({ key, label: 'رابط ' + urlIdx, value: inner, type: 'url' });
      }
    }

    const txtRe = /(:\s*)["']([^"']{2,})["']/g;
    while ((m = txtRe.exec(code)) !== null) {
      const pre = m[1], val = m[2].trim();
      if (val && !/^(https?:\/\/|#|var\(|data:)/.test(val)) {
        textIdx++;
        const key = '__txt_' + textIdx;
        vars.push({ key, label: 'نص ' + textIdx, value: val, type: 'text' });
      }
    }
    return vars;
  }

  function getLiveCode(code, values){
    if (!values) return code;
    let r = code;
    const pctKeys = Object.keys(values).filter(k => k.startsWith('__pct_'));
    if (pctKeys.length) {
      let pi = 0;
      r = r.replace(/color-mix\(in\s+srgb,\s*var\((--\d+)\),\s*([^,)]+?)\s+(\d+)%\s*\)/g, (_m, baseVar, secondColor, pct) => {
        const val = pctKeys[pi] !== undefined ? values[pctKeys[pi]] : pct;
        pi++;
        return 'color-mix(in srgb, var(' + baseVar + '), ' + secondColor.trim() + ' ' + val + '%)';
      });
    }
    const urlKeys = Object.keys(values).filter(k => k.startsWith('__url_'));
    const textKeys = Object.keys(values).filter(k => k.startsWith('__txt_'));
    let ui = 0, ti = 0;

    r = r.replace(/(url\s*\()\s*["']?([^)"']*)["']?\s*(\))/g, (m, pre, inner, post) => {
      const trimmed = inner.trim();
      if (!trimmed || /^(IMAGE|BANNER|LOGO|NEW_|YOUR)/i.test(trimmed) || /^https?:\/\//i.test(trimmed)) {
        const val = urlKeys[ui] !== undefined ? values[urlKeys[ui]] : '';
        ui++;
        return 'url("' + (val ? (trimmed.match(/^https?:\/\//i) && !val.match(/^https?:\/\//i) ? 'https://' + val : val) : '') + '")';
      }
      return m;
    });

    r = r.replace(/:\s*["']([^"']+)["']/g, (m, inner) => {
      const trimmed = inner.trim();
      if (trimmed && !/^(https?:\/\/|#|var\()/.test(trimmed)) {
        const val = textKeys[ti] !== undefined ? values[textKeys[ti]] : trimmed;
        ti++;
        return ': "' + val + '"';
      }
      return m;
    });

    for (const [key, val] of Object.entries(values)) {
      if (key.startsWith('__url_') || key.startsWith('__txt_')) continue;
      const esc = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      r = r.replace(new RegExp('(' + esc + '\\s*:\\s*)[^;]+;', 'g'), (_, p) => p + val + ';');
      r = r.replace(new RegExp('var\\(\\s*' + esc + '\\s*\\)', 'g'), val);
    }
    return r;
  }

  function updateVar(sectionId, key, value){
    if (!varValues.has(sectionId)) varValues.set(sectionId, {});
    varValues.get(sectionId)[key] = value;
    const section = DATA.find(s => s.id === sectionId);
    if (!section) return;
    const values = varValues.get(sectionId) || {};
    const card = document.querySelector(`.section[data-id="${sectionId}"]`);
    if (!card) return;
    card.querySelectorAll('.code-block').forEach((block, i) => {
      const pre = block.querySelector('.code-pre');
      const btn = block.querySelector('.copy-btn');
      if (pre && i < section.codes.length) {
        const liveCode = getLiveCode(section.codes[i].code, values);
        pre.innerHTML = syntaxHL(liveCode);
        if (btn) {
          const enc = encodeURIComponent(liveCode).replace(/'/g,"\\'");
          btn.setAttribute('onclick', "copyCode(this,'" + enc + "')");
        }
      }
    });
    updateColorPreview(sectionId);
  }

  function updateColorPreview(sectionId) {
    const values = varValues.get(sectionId) || {};
    const section = DATA.find(s => s.id === sectionId);
    if (!section) return;
    const vars = detectVars(section.codes.map(c => c.code).join('\n'));
    const baseDef = vars.find(x => x.key === '--1');
    const baseColor = values['--1'] || (baseDef ? baseDef.value : null);

    const baseSwatch = document.getElementById('swatch_' + sectionId + '_base');
    if (baseSwatch && baseColor) baseSwatch.style.background = baseColor;

    const baseHex = baseSwatch && baseSwatch.parentElement ? baseSwatch.parentElement.querySelector('.base-hex') : null;
    if (baseHex && baseColor) baseHex.textContent = baseColor;

    vars.forEach(v => {
      if (v.type !== 'range') return;
      const swatch = document.getElementById('swatch_' + sectionId + '_' + v.key);
      if (!swatch) return;
      const pct = values[v.key] !== undefined ? values[v.key] : v.value;
      const c1 = baseColor || v.secondColor;
      const mixed = mixColors(c1, v.secondColor, pct);
      swatch.style.background = mixed || 'var(--bg-elevated)';
    });
  }

  function selectPattern(sectionId, idx){
    const section = DATA.find(s => s.id === sectionId);
    if (!section || !section.patterns) return;
    section.selectedPattern = idx;
    section.codes[0] = { lang: isJS(section.patterns[idx].code) ? 'JS' : 'CSS', code: section.patterns[idx].code };
    renderAll();
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ── COPY ──
  function copyCode(btn, encodedCode){
    const code = decodeURIComponent(encodedCode);
    navigator.clipboard.writeText(code).then(()=>{
      btn.classList.add('copied');
      btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> تم النسخ';
      showToast('تم نسخ الكود!');
      setTimeout(()=>{
        btn.classList.remove('copied');

  function highlightScrollbarCSS(css){
    let s = escHtml(css);
    s = s.replace(/(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/g, m => `<span class="sb-css-cmt">${m}</span>`);
    s = s.replace(/(--[\w-]+)/g, m => `<span class="sb-css-var">${m}</span>`);
    s = s.replace(/(:root|\*|::-webkit-scrollbar(?:-track|-thumb)?|:hover)/g, m => `<span class="sb-css-sel">${m}</span>`);
    s = s.replace(/(scrollbar-color|scrollbar-width|background|border-radius|width)\s*:/g, (m, p) => `<span class="sb-css-prop">${p}</span> :`);
    s = s.replace(/:\s*([^;{}\n]+)(?=[;}\n])/g, (m, val) => {
      if (val.includes('var(')) return ': ' + val.replace(/var\(\s*(--[\w-]+)\s*\)/g, (_, v) => `<span class="sb-css-var">var(${v})</span>`);
      if (val.trim().match(/^#[0-9a-fA-F]{3,8}$/) || val.trim().match(/^\d+px$/)) return `: <span class="sb-css-val">${val}</span>`;
      return m;
    });
    return s;
  }

    const id = 'has_' + Date.now();
    DATA.unshift({

      tags: ['has', 'css'],
      desc: ':has() selector' + (parent ? ' — ' + parent : ''),

  function uniqueKey(url){
    if(!url) return '';
    const clean = url.replace(/^https?:\/\//i,'').split('?')[0].split('#')[0];
    const uuid = clean.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    if(uuid) return uuid[0];
    const name = clean.split('/').pop() || clean;
    const noExt = name.replace(/\.[a-z0-9]{2,6}$/i,'');
    if(noExt && noExt.length > 2) return noExt;
    return clean;
  }

  function extractImgsFromHtml(html){
    const imgs = [];
    const re = /<img\b[^>]*>/gi;
    let m;
    while((m = re.exec(html)) !== null){
      const tag = m[0];
      const src = (tag.match(/\bsrc\s*=\s*["']([^"']*?)["']/i)||[])[1] || '';
      const dataSrc = (tag.match(/\bdata-src\s*=\s*["']([^"']*?)["']/i)||[])[1] || '';
      if(src || dataSrc) imgs.push({ src, dataSrc, newUrl: '', enabled: true });
    }
    return imgs;
  }

  function parseCssRule(css){
    const out = [];
    const re = /([^{}]+)\{([^}]*)\}/g;
    let m;
    while((m = re.exec(css)) !== null){
      const sel = m[1].trim();
      const body = m[2];
      const urlM = body.match(/content\s*:\s*url\(\s*["']?([^"')]*)["']?\s*\)/i);
      if(urlM && /img/i.test(sel)){
        const srcM = sel.match(/img\[src\*=\s*["']([^"']*)["']\]/i);
        const dsM  = sel.match(/img\[data-src\*=\s*["']([^"']*)["']\]/i);
        out.push({
          src: srcM ? srcM[1] : '',
          dataSrc: dsM ? dsM[1] : '',
          newUrl: urlM[1] || '',
          enabled: true
        });
      }
    }
    return out;
  }

  function analyzeCv(){
    const html = document.getElementById('cvHtmlInput').value;
    const css  = document.getElementById('cvCssInput').value;

    const htmlImgs = html.trim() ? extractImgsFromHtml(html) : [];
    const cssImgs  = css.trim()  ? parseCssRule(css) : [];

    if(!htmlImgs.length && !cssImgs.length){
      showToast('لم يتم العثور على صور — تحقق من الكود');
      cvImgs = [];
      renderCvDash();
      return;
    }

    cvImgs = htmlImgs.length ? htmlImgs : cssImgs;
    if(htmlImgs.length && cssImgs.length){
      htmlImgs.forEach(im => {
        const k = uniqueKey(im.src || im.dataSrc);
        const match = cssImgs.find(c => uniqueKey(c.src || c.dataSrc) === k);
        if(match){
          if(!im.src && match.src) im.src = match.src;
          if(!im.dataSrc && match.dataSrc) im.dataSrc = match.dataSrc;
          if(match.newUrl) im.newUrl = match.newUrl;
        }
      });
    }

    renderCvDash();
    showToast('تم استخراج ' + cvImgs.length + ' صورة');
  }

  function generateCvCSS(){
    const rules = [];
    cvImgs.forEach((img, i) => {
      if(!img.enabled) return;
      const key = uniqueKey(img.src || img.dataSrc);
      if(!key) return;
      const newUrl = img.newUrl.trim() || 'NEW_IMAGE_URL';
      const sels = [];
      if(img.src) sels.push('img[src*="' + key + '"]');
      if(img.dataSrc) sels.push('img[data-src*="' + key + '"]');
      const sel = sels.length ? sels.join(',\n') : 'img[src*="' + key + '"]';
      rules.push('/* استبدال الصورة ' + (i + 1) + ' */\n' + sel + ' {\n  content: url("' + newUrl + '");\n}');
    });
    return rules.join('\n\n');
  }

  function highlightCvCSS(css){
    let s = escHtml(css);
    s = s.replace(/(\/\*[\s\S]*?\*\/)/g, m => '<span class="sb-css-cmt">' + m + '</span>');
    s = s.replace(/(img\[(?:src|data-src)\*=[^\n\]]*\](\s*,\s*\n\s*img\[(?:src|data-src)\*=[^\n\]]*\])*)/g, m => '<span class="sb-css-sel">' + m + '</span>');
    s = s.replace(/(content)\s*:/g, (m, p) => '<span class="sb-css-prop">' + p + '</span> :');
    s = s.replace(/:\s*([^;{}\n]+)(?=[;}\n])/g, (m, val) => {
      if(val.trim().match(/^url\(/)) return ': <span class="sb-css-val">' + val + '</span>';
      return m;
    });
    return s;
  }

  const VD_KEY = 'csman_v2_versions_v1';

  function defaultVdStore(){
    return { snippets: [], activeSnippetId: null };
  }

  let vdStore = loadVd();
  let vdActiveSnippetId = vdStore.activeSnippetId || null;

  function loadVd(){
    try {
      const d = JSON.parse(localStorage.getItem(VD_KEY));
      if (d && Array.isArray(d.snippets)) return d;
    } catch (e) {}
    return defaultVdStore();
  }

  function saveVd(){
    vdStore.activeSnippetId = vdActiveSnippetId;
    try { localStorage.setItem(VD_KEY, JSON.stringify(vdStore)); return true; }
    catch (e) { return false; }
  }

  function newVdSnippet(name){
    const id = 'vd_' + Date.now() + Math.random().toString(36).slice(2,5);
    const sn = { id, name: name || ('مربع ' + (vdStore.snippets.length + 1)), versions: [], draft: '' };
    vdStore.snippets.unshift(sn);
    vdActiveSnippetId = id;
    return sn;
  }

  function activeVdSnippet(){
    let sn = vdStore.snippets.find(s => s.id === vdActiveSnippetId);
    if (!sn) {
      if (vdStore.snippets.length) { sn = vdStore.snippets[0]; vdActiveSnippetId = sn.id; }
      else sn = newVdSnippet();
    }
    return sn;
  }

  function inlineRenameSnippet(){
    const el = document.querySelector('.vd-tab.active .vd-tab-name');
    const sn = activeVdSnippet();
    if (!el || !sn) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.value = sn.name;
    input.className = 'vd-tab-input';
    input.setAttribute('aria-label', 'اسم المربع');
    el.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const commit = () => {
      if (done) return; done = true;
      const v = input.value.trim();
      if (v) { sn.name = v; saveVd(); }
      renderAll();
    };
    const cancel = () => {
      if (done) return; done = true;
      renderAll();
    };
    input.addEventListener('click', e => e.stopPropagation());
    input.addEventListener('keydown', e => {
      e.stopPropagation();
      if (e.key === 'Enter') commit();
      else if (e.key === 'Escape') cancel();
    });
    input.addEventListener('blur', commit);
  }

    vdActiveSnippetId = id;

  function vdSaveVersion(opts){
    const silent = !!(opts && opts.silent);
    const sn = activeVdSnippet();
    const ed = document.getElementById('vdEditor');
    const content = ed ? ed.value : (sn.draft || '');
    if (!content.trim()) { if (!silent) showToast('المربع فارغ — الصق كود أولاً'); return false; }
    const last = sn.versions[sn.versions.length - 1];
    if (last && last.content === content) {
      if (silent) showToast('تم اللصق — لا تغيير عن آخر نسخة');
      else showToast('لا تغيير عن النسخة الأخيرة');
      return false;
    }
    const had = sn.versions.length;
    const v = { id: 'vv_' + Date.now() + Math.random().toString(36).slice(2,5), n: had + 1, time: Date.now(), content };
    sn.versions.push(v);
    sn.draft = content;
    const prevId = had ? sn.versions[had - 1].id : null;
    const wasDefaultBase = had >= 2 && sn.baseId === sn.versions[had - 2].id;
    if (sn.baseId == null || wasDefaultBase) sn.baseId = prevId;
    if (!saveVd()) { sn.versions.pop(); showToast('مساحة التخزين ممتلئة'); return false; }
    renderVdDash();
    showToast('تم حفظ نسخة V' + v.n + (silent ? ' تلقائيًا' : ''));
    return true;
  }

  function vdDelete(id){

    sn.versions = sn.versions.filter(x => x.id !== id);
    if (sn.baseId === id) sn.baseId = null;
    sn.versions.forEach((x, i) => x.n = i + 1);
    saveVd();
    renderVdDash();

  function fillVdCompareSelects(sn){
    const oldSel = document.getElementById('vdOldSel');
    const newSel = document.getElementById('vdNewSel');
    if (!oldSel || !newSel) return;
    const opts = sn.versions.map(v => {
      const t = new Date(v.time).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
      return `<option value="${v.id}">V${v.n} · ${t}</option>`;
    }).join('');
    oldSel.innerHTML = opts;
    newSel.innerHTML = opts + `<option value="__editor__">المحرر (الحالي)</option>`;
    if (sn.versions.length >= 2) {
      oldSel.value = sn.versions[sn.versions.length - 2].id;
      newSel.value = sn.versions[sn.versions.length - 1].id;
    } else if (sn.versions.length === 1) {
      newSel.value = sn.versions[0].id;
    }
  }

      ? '<i class="ti ti-arrows-left-right"></i> إخفاء المخصصة'
      : '<i class="ti ti-arrows-left-right"></i> مقارنة مخصصة';

  function vdRunCompare(){
    const sn = activeVdSnippet();
    const aId = document.getElementById('vdOldSel').value;
    const bId = document.getElementById('vdNewSel').value;
    if (!aId || !bId) { showToast('اختر نسختين'); return; }
    const a = sn.versions.find(v => v.id === aId);
    if (!a) return;
    if (bId === '__editor__') {
      const ed = document.getElementById('vdEditor');
      const current = ed ? ed.value : (sn.draft || '');
      if (!current.trim()) { showToast('المربع فارغ'); return; }
      document.getElementById('vdCustomOut').innerHTML = vdDiffHTML(a.content, current, 'V' + a.n + ' (قاعدة)', 'المحرر (الحالي)');
      return;
    }
    const b = sn.versions.find(v => v.id === bId);
    if (!b) return;
    document.getElementById('vdCustomOut').innerHTML = vdDiffHTML(a.content, b.content, 'V' + a.n + ' (قبل)', 'V' + b.n + ' (بعد)');
  }

  function vdSetBase(id){
    const sn = activeVdSnippet();
    const latest = sn.versions[sn.versions.length - 1];
    if (latest && id === latest.id) { showToast('اختر قاعدة أقدم من الأحدث'); renderVdDash(); return; }
    sn.baseId = id;
    saveVd();
    renderVdDash();
    showToast('تم تحديد القاعدة للمقارنة');
  }

  function resolveVdBase(sn){
    const latest = sn.versions[sn.versions.length - 1];
    let base = null;
    if (sn.baseId) base = sn.versions.find(v => v.id === sn.baseId) || null;
    if (!base && sn.versions.length >= 2) base = sn.versions[sn.versions.length - 2];
    if (base && latest && base.id === latest.id && sn.versions.length >= 2) base = sn.versions[sn.versions.length - 2];
    return base;
  }

  function vdLineDiff(aLines, bLines){
    const n = aLines.length, m = bLines.length;
    if (n * m <= 4000000) {
      const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          if (aLines[i] === bLines[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
          else dp[i][j] = dp[i + 1][j] > dp[i][j + 1] ? dp[i + 1][j] : dp[i][j + 1];
        }
      }
      const ops = []; let i = 0, j = 0;
      while (i < n && j < m) {
        if (aLines[i] === bLines[j]) { ops.push([0, i, j]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push([-1, i, -1]); i++; }
        else { ops.push([1, -1, j]); j++; }
      }
      while (i < n) { ops.push([-1, i, -1]); i++; }
      while (j < m) { ops.push([1, -1, j]); j++; }
      return ops;
    }
    let start = 0;
    while (start < n && start < m && aLines[start] === bLines[start]) start++;
    let endA = n, endB = m;
    while (endA > start && endB > start && aLines[endA - 1] === bLines[endB - 1]) { endA--; endB--; }
    const ops = [];
    for (let i = 0; i < start; i++) ops.push([0, i, i]);
    for (let i = start; i < endA; i++) ops.push([-1, i, -1]);
    for (let j = start; j < endB; j++) ops.push([1, -1, j]);
    for (let i = endA; i < n; i++) ops.push([0, i, i]);
    return ops;
  }

  function vdDiffHTML(a, b, aName, bName){
    const aLines = a.split('\n');
    const bLines = b.split('\n');
    const ops = vdLineDiff(aLines, bLines);

    const rows = [];
    const changeSet = [];
    for (let i = 0; i < ops.length; i++) if (ops[i][0] !== 0) changeSet.push(i);

    if (!changeSet.length) {
      rows.push({ t: 'fold', text: 'لا تغيير بين النسختين — الأكواد متطابقة' });
    } else {
      const CONTEXT = 2;
      const showIdx = new Set(changeSet);
      changeSet.forEach(idx => {
        for (let k = 1; k <= CONTEXT; k++) {
          if (idx - k >= 0 && ops[idx - k][0] === 0) showIdx.add(idx - k);
          if (idx + k < ops.length && ops[idx + k][0] === 0) showIdx.add(idx + k);
        }
      });
      const sorted = Array.from(showIdx).sort((x, y) => x - y);
      let prevShown = -1;
      sorted.forEach(idx => {
        if (prevShown !== -1 && idx > prevShown + 1) {
          let count = 0;
          for (let k = prevShown + 1; k < idx; k++) if (ops[k][0] === 0) count++;
          if (count > 0) rows.push({ t: 'fold', text: count + ' سطر متطابق مخفي' });
        }
        const op = ops[idx];
        if (op[0] === 0) rows.push({ t: 'eq', text: aLines[op[1]] });
        else if (op[0] === -1) rows.push({ t: 'del', text: aLines[op[1]] });
        else rows.push({ t: 'add', text: bLines[op[2]] });
        prevShown = idx;
      });
    }

    let added = 0, removed = 0, same = 0;
    ops.forEach(op => { if (op[0] === 1) added++; else if (op[0] === -1) removed++; else same++; });

    const rowsHtml = rows.map(r => {
      if (r.t === 'fold') return `<div class="vd-fold">${escHtml(r.text)}</div>`;
      if (r.t === 'del') return `<div class="vd-dl vd-dl-del"><span class="vd-dl-mark">−</span><span class="vd-dl-code">${escHtml(r.text) || ' '}</span></div>`;
      if (r.t === 'add') return `<div class="vd-dl vd-dl-add"><span class="vd-dl-mark">+</span><span class="vd-dl-code">${escHtml(r.text) || ' '}</span></div>`;
      return `<div class="vd-dl vd-dl-ctx"><span class="vd-dl-mark"> </span><span class="vd-dl-code">${escHtml(r.text) || ' '}</span></div>`;
    }).join('');

    const statHtml = `<div class="vd-summary">
      <span class="vd-stat added">+ ${added} مضافة</span>
      <span class="vd-stat removed">− ${removed} محذوفة</span>
      <span class="vd-stat same">${same} متطابقة</span>
    </div>`;

    return statHtml + `<div class="vd-diff">
      <div class="vd-diff-head">
        <span class="vd-file-old">— ${escHtml(aName)}</span>
        <span class="vd-file-new">+ ${escHtml(bName)}</span>
      </div>
      <div class="vd-diff-body">${rowsHtml}</div>
    </div>`;
  }

  function edSaveVersion(opts){
    const silent = !!(opts && opts.silent);
    const sn = activeVdSnippet();
    const input = document.getElementById('edInput');
    const content = input ? input.value : (sn.draft || '');
    if (!content.trim()) { if (!silent) showToast('المحرر فارغ — اكتب أو الصق كود أولاً'); return false; }
    const last = sn.versions[sn.versions.length - 1];
    if (last && last.content === content) {
      if (silent) showToast('تم اللصق — لا تغيير عن آخر نسخة');
      else showToast('لا تغيير عن النسخة الأخيرة');
      return false;
    }
    const had = sn.versions.length;
    const v = { id: 'vv_' + Date.now() + Math.random().toString(36).slice(2,5), n: had + 1, time: Date.now(), content };
    sn.versions.push(v);
    sn.draft = content;
    const prevId = had ? sn.versions[had - 1].id : null;
    const wasDefaultBase = had >= 2 && sn.baseId === sn.versions[had - 2].id;
    if (sn.baseId == null || wasDefaultBase) sn.baseId = prevId;
    if (!saveVd()) { sn.versions.pop(); showToast('مساحة التخزين ممتلئة'); return false; }
    const totalVersions = vdStore.snippets.reduce((a, s) => a + s.versions.length, 0);
    document.getElementById('countBadge').textContent = totalVersions + ' نسخة · محرر';
    const tabNum = document.querySelector('.vd-tab.active .vd-tab-num');
    if (tabNum) tabNum.textContent = sn.versions.length;
    showToast('تم حفظ نسخة V' + v.n + (silent ? ' تلقائيًا' : ''));
    return true;
  }

  // ── RENDER ──
  function renderAll(){
    if(showPvDash && (showHasDash || showScrollbarDash || showCvDash || showVdDash || showEdDash || showDevDash || showB64Dash || showQrDash || showCpDash || showRtDash)){
      showPvDash = false;
      const b = document.getElementById('pvDashBtn');
      if (b) b.classList.remove('pv-active');
    }
    document.body.classList.toggle('editor-active', !!showEdDash);
    document.body.classList.toggle('pv-active', !!showPvDash);
    persistDashState();
    setDashHash(currentDashId());
    if(showHasDash) return renderHasDashboard();
    if(showScrollbarDash) return renderScrollbarDash();
    if(showCvDash) return renderCvDash();
    if(showVdDash) return renderVdDash();
    if(showEdDash) return renderEdDash();
    if(showDevDash) return renderDevDash();
    if(showB64Dash) return renderB64Dash();
    if(showQrDash) return renderQrDash();
    if(showCpDash) return renderCpDash();
    if(showRtDash) return renderRtDash();
    if(showPvDash) return renderPvDash();
    const body  = document.getElementById('mainBody');
    const badge = document.getElementById('countBadge');
    const q     = (document.getElementById('searchInput')||{}).value?.trim().toLowerCase()||'';
    const list  = getFiltered();

    badge.textContent = list.length + ' كود';

    if(!list.length){
      body.innerHTML = `<div class="empty-state"><i class="ti ti-mood-empty" aria-hidden="true"></i><p>لا توجد أكواد مطابقة</p></div>`;
      return;
    }

    body.innerHTML = list.map(s=>{
      const isOpen  = openIds.has(s.id);
      const isStar  = starredIds.has(s.id);
      const tagsHtml = s.tags.map(t=>`<span class="stag">${escHtml(t)}</span>`).join('');
      const countLabel = s.codes.length > 1 ? `<span class="code-count">${s.codes.length} أكواد</span>` : '';

      let bodyHtml = '';
      if(isOpen){
        const vars = detectVars(s.codes.map(c=>c.code).join('\n'));
        const values = varValues.get(s.id) || {};

        let varPanelHtml = '';
        if (vars.length) {
          const baseVarDef = vars.find(x => x.key === '--1');
          const baseVal = values['--1'] !== undefined ? values['--1'] : (baseVarDef ? baseVarDef.value : '');

          varPanelHtml = `<div class="var-panel">
            <div class="var-title"><i class="ti ti-adjustments" aria-hidden="true"></i> تعديل المتغيرات</div>`;

          if (baseVarDef) {
            varPanelHtml += `<div class="base-row">
              <span class="color-swatch-lg" id="swatch_${s.id}_base" style="background:${escHtml(baseVal)}"></span>
              <input class="var-input picker-lg" type="color" value="${escHtml(baseVal)}"
                oninput="updateVar('${s.id}','--1',this.value)">
              <span class="base-hex">${escHtml(baseVal)}</span>
            </div>`;
          }

          vars.forEach(v => {
            if (v.key === '--1') return;
            const val = values[v.key] !== undefined ? values[v.key] : v.value;
            if (v.type === 'range') {
              const baseSrc = baseVal || v.secondColor;
              const initMixed = mixColors(baseSrc, v.secondColor, val);
              varPanelHtml += `<div class="var-row">
                <span class="var-label" title="${escHtml(v.varName||'')}">${escHtml(v.label)}</span>
                <input type="range" min="0" max="100" value="${escHtml(val)}"
                  oninput="updateVar('${s.id}','${v.key}',this.value); document.getElementById('pctVal_${s.id}_${v.key}').textContent=this.value+'%'">
                <span class="var-val" id="pctVal_${s.id}_${v.key}">${val}%</span>
                <span class="color-swatch" id="swatch_${s.id}_${v.key}" style="background:${initMixed||'var(--bg-elevated)'}"></span>
              </div>`;
            } else {
              varPanelHtml += `<div class="var-row">
                <span class="var-label">${escHtml(v.label)}</span>
                <input class="var-input" type="${v.type === 'color' ? 'color' : 'text'}" value="${escHtml(val)}"
                  placeholder="${v.type === 'url' ? 'https://...' : ''}"
                  oninput="updateVar('${s.id}','${v.key}',this.value)" ${v.type === 'url' ? 'dir="ltr"' : ''}>
              </div>`;
            }
          });
          varPanelHtml += `</div>`;
        }

        const codesHtml = s.codes.map((c,i)=>{
          const liveCode = vars.length ? getLiveCode(c.code, values) : c.code;
          const enc = encodeURIComponent(liveCode);
          return `<div class="code-block">
            <div class="code-header">
              <span class="lang-badge ${c.lang.toLowerCase()}">${escHtml(c.lang)}</span>
              <div class="code-actions">
                <button class="copy-btn" onclick="copyCode(this,'${escHtml(enc)}')" title="نسخ الكود">
                  <i class="ti ti-copy" aria-hidden="true"></i> نسخ
                </button>
              </div>
            </div>
            <pre class="code-pre${wrapMode?' wrap':''}">${syntaxHL(liveCode)}</pre>
          </div>`;
        }).join('');

        let patternBarHtml = '';
        if (s.patterns) {
          patternBarHtml = `<div class="pattern-bar">${
            s.patterns.map((p,i) =>
              `<button class="pattern-tab${i === (s.selectedPattern||0) ? ' active' : ''}" onclick="event.stopPropagation(); selectPattern('${s.id}',${i})">${escHtml(p.name)}</button>`
            ).join('')
          }</div>`;
        }
        bodyHtml = `<div class="section-body open">
          <p class="section-desc">${escHtml(s.desc)}</p>
          ${patternBarHtml}
          ${varPanelHtml}
          ${codesHtml}
        </div>`;
      }

      return `<div class="section" data-id="${s.id}">
        <div class="section-head" onclick="toggleSection('${s.id}')">
          <i class="ti ti-chevron-left chevron${isOpen?' open':''}" aria-hidden="true"></i>
          <span class="section-title">${hlQuery(s.title, q)}</span>
          ${countLabel}
          <div class="section-tags">${tagsHtml}</div>
          <div class="section-actions">
            <button class="star-btn${isStar?' starred':''}" onclick="toggleStar('${s.id}',this,event)" title="${isStar?'تم الحفظ':'حفظ'}" aria-label="${isStar?'إزالة من المحفوظات':'حفظ'}">
              <i class="ti ti-star" aria-hidden="true"></i>
            </button>
            <button class="delete-btn" onclick="confirmDelete('${s.id}',event)" title="حذف">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        ${bodyHtml}
      </div>`;
    }).join('');
  }

  // ── MODAL ──
  function openModal(){
    document.getElementById('modalOverlay').classList.add('open');
    document.getElementById('inp-title').focus();
  }
  function closeModal(){
    document.getElementById('modalOverlay').classList.remove('open');
    ['inp-title','inp-desc','inp-tags','inp-code'].forEach(id=>{ document.getElementById(id).value=''; });
    document.getElementById('inp-lang').value = 'CSS';
  }
  function closeModalOutside(e){ if(e.target===document.getElementById('modalOverlay')) closeModal(); }
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

  function addSection(){
    const title = document.getElementById('inp-title').value.trim();
    const desc  = document.getElementById('inp-desc').value.trim();
    const tagsRaw = document.getElementById('inp-tags').value.trim();
    const lang  = document.getElementById('inp-lang').value;
    const code  = document.getElementById('inp-code').value.trim();

    if(!title || !code){ showToast('العنوان والكود مطلوبان'); return; }

    const id = 'sec_' + Date.now();
    const tags = tagsRaw ? tagsRaw.split(',').map(t=>t.trim()).filter(Boolean) : ['css'];

    DATA.unshift({ id, title, desc: desc||'لا يوجد وصف', tags, starred:false, codes:[{ lang, code }] });
    openIds.add(id);
    closeModal();
    renderAll();
    if(wrapMode) document.querySelectorAll('.code-pre').forEach(el => el.classList.add('wrap'));
    showToast('تم إضافة الكود!');
  }

  // ── EXPORT / IMPORT ──
  function exportData(){
    const exportArr = DATA.map(s => ({ title:s.title, tags:s.tags, desc:s.desc, codes:s.codes, patterns:s.patterns, selectedPattern:s.selectedPattern, starred:starredIds.has(s.id) }));
    const json = JSON.stringify(exportArr, null, 2);
    const blob = new Blob([json], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'code-manager-backup.json';
    a.click(); URL.revokeObjectURL(url);
    showToast('تم التصدير!');
  }

  function importData(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if(!Array.isArray(imported)) throw new Error();
        imported.forEach(item => {
          if(!item.id) item.id = 'imp_' + Date.now() + Math.random().toString(36).slice(2,6);
          if(item.starred) starredIds.add(item.id);
          openIds.add(item.id);
        });
        DATA = imported;
        renderAll();
        if(wrapMode) document.querySelectorAll('.code-pre').forEach(el => el.classList.add('wrap'));
        showToast('تم الاستيراد بنجاح!');
      } catch {
        showToast('ملف JSON غير صالح');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  }

  // ── CSS Minifier ──
  function dtCompressCSS(){
    const input = document.getElementById('dtCssInput');
    const output = document.getElementById('dtCssOutput');
    if (!input || !output || !input.value.trim()) return;
    let n = input.value;
    const stripCustom = document.getElementById('dtCssStripCustom').checked;
    const stripAll = document.getElementById('dtCssStripAll').checked;
    const superCompact = document.getElementById('dtCssSuperCompact').checked;
    const betterIndentation = document.getElementById('dtCssIndent').checked;
    const removeLastSemi = document.getElementById('dtCssNoLastSemi').checked;

    if (stripCustom) n = n.replace(/\/\*\/\/\*[\s\S]*?\/\*\/\//g, '');
    if (stripAll || superCompact) n = n.replace(/\/\*[\w\W]*?\*\//gm, '');
    else n = n.replace(/(\n+)?(\/\*[\w\W]*?\*\/)(\n+)?/gm, '\n$2\n');
    n = n.replace(/([\n\r\t\s ]+)?([,\:;\{\}]+?)([\n\r\t\s ]+)?/g, '$2');
    if (!superCompact) n = n.replace(/\}(?!\})/g, '}\n');
    const mediaKeyframesRegex = /@(media|-w|-m|-o|keyframes|page)(.*?)\{([\s\S]+?)?\}\}/gi;
    if (betterIndentation) {
      n = n.replace(mediaKeyframesRegex, (e) => e.replace(/\n+/g, '\n  '));
      if (!superCompact) {
        n = n.replace(/\}\}/g, '}\n}');
        n = n.replace(/@(media|-w|-m|-o|keyframes)(.*?)\{/g, '@$1$2{\n  ');
      }
    } else {
      n = n.replace(mediaKeyframesRegex, (e) => e.replace(/\n+/g, ''));
    }
    if (removeLastSemi) n = n.replace(/;\}/g, '}');
    else n = n.replace(/\}/g, ';}').replace(/;+\}/g, ';}').replace(/\};\}/g, '}}');
    n = n.replace(/\:0(px|em|pt)/gi, ':0').replace(/ 0(px|em|pt)/gi, ' 0');
    n = n.replace(/\s+\!important/gi, '!important').replace(/(^\n+|\n+$)/, '');
    output.value = n;
    showToast('تم ضغط CSS');
  }

  // ── JS Minifier ──
  function dtFallbackMinifyJS(code, keepComments){
    let minified = code;
    if (!keepComments) {
      minified = minified
        .replace(/\/\*[\s\S]*?\*\//g, '')
        .replace(/(^|[^:])\/\/.*$/gm, '$1');
    }
    return minified
      .replace(/\s+/g, ' ')
      .replace(/\s*([{}();,:=<>+\-*\/])\s*/g, '$1')
      .trim();
  }

  async function dtMinifyJS(){
    const input = document.getElementById('dtJsMinInput');
    const output = document.getElementById('dtJsMinOutput');
    if (!input || !output || !input.value.trim()) return;

    const keepComments = document.getElementById('dtJsKeepComments').checked;
    const dropConsole = document.getElementById('dtJsDropConsole').checked;
    const dropDebugger = document.getElementById('dtJsDropDebugger').checked;
    const mangleNames = document.getElementById('dtJsMangle').checked;
    const superCompact = document.getElementById('dtJsSuperCompact').checked;

    const minifyOptions = {
      compress: { drop_console: !!dropConsole, drop_debugger: !!dropDebugger, passes: superCompact ? 2 : 1 },
      mangle: !!mangleNames,
      format: { comments: keepComments ? 'some' : false }
    };

    try {
      if (window.Terser && typeof window.Terser.minify === 'function') {
        const result = await window.Terser.minify(input.value, minifyOptions);
        if (result.error) throw result.error;
        output.value = result.code || '';
      } else {
        output.value = dtFallbackMinifyJS(input.value, !!keepComments);
        showToast('تم الضغط ببساطة — مكتبة الضغط غير متاحة');
        return;
      }
      showToast('تم ضغط JS');
    } catch (err) {
      console.error('JS minify failed:', err);
      showToast('حدث خطأ — تأكد من صحة الكود');
    }
  }

  function dtSvgUpdate(){
    const input = document.getElementById('dtSvgInput');
    const result = document.getElementById('dtSvgResult');
    const cssOut = document.getElementById('dtSvgCss');
    const varOut = document.getElementById('dtSvgVar');
    const demo = document.getElementById('dtSvgDemoBg');
    if (!input || !result || !cssOut || !demo) return;
    if (!input.value.trim()) {
      result.value = cssOut.value = '';
      if (varOut) varOut.value = '';
      demo.style.backgroundImage = '';
      return;
    }
    let data = input.value;
    const q = dtSvgQuotesObj();
    if (data.indexOf('http://www.w3.org/2000/svg') < 0) {
      data = data.replace(/<svg/g, '<svg xmlns=' + q.level2 + 'http://www.w3.org/2000/svg' + q.level2);
    }
    const symbols = /[\r\n#()<>?\[\\\]^`{|}]/g;
    if (dtSvgQuotes === 'double') data = data.replace(/"/g, "'");
    else data = data.replace(/'/g, '"');
    data = data.replace(/>\s{1,}</g, '><').replace(/\s{2,}/g, ' ');
    const escaped = data.replace(symbols, encodeURIComponent);
    result.value = escaped;
    cssOut.value = 'background-image: url(' + q.level1 + 'data:image/svg+xml,' + escaped + q.level1 + ');';
    if (varOut) {
      const varName = (document.getElementById('dtSvgVarName').value || 'logo').trim();
      varOut.value = ':root {\n  --' + varName + ': url(' + q.level1 + 'data:image/svg+xml,' + escaped + q.level1 + ');\n}';
    }
    demo.style.backgroundImage = 'url("data:image/svg+xml,' + escaped + '")';
  }

  // ── COLOR PALETTE TOOL ──
  let cpBase        = { h: 39, s: 0.67, v: 0.71 };
  let cpHarmonyMode = 'complementary';
  let cpGradType    = 'linear';
  let cpGradAngle   = 225;
  let cpGradStops   = [{ hex: '#B58A3B', pos: 0 }, { hex: '#D0AD6D', pos: 100 }];
  let cfSourceHex   = '#000000';
  let cfTargetHex   = '#E8734A';
  let cfPickMode    = false;

  let cfLastRaw     = '';

  let cvgPrimary    = '#EF8015';
  let cvgDarkPct    = 30, cvgLightPct = 40, cvgRevPct = 60, cvgSecPct = 100;
  let cvgRevColor   = '#FF0000', cvgSecColor = '#00FFFF';
  let cvgVars       = [{ name: '3', color: '#FFFFFF', pct: 94 }, { name: '4', color: '#00FF00', pct: 50 }];
  let cvgShowBoxes  = true;

  function cpClamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
  function cpWrapHue(h){ return ((h % 360) + 360) % 360; }
  function cpHexToRgb(hex){
    if (!hex) return null;
    let s = String(hex).trim().replace('#','');
    if (s.length === 3) s = s[0]+s[0]+s[1]+s[1]+s[2]+s[2];
    if (!/^[0-9a-fA-F]{6}$/.test(s)) return null;
    return { r: parseInt(s.slice(0,2),16), g: parseInt(s.slice(2,4),16), b: parseInt(s.slice(4,6),16) };
  }
  function cpRgbToHex(r, g, b){
    return '#' + [r,g,b].map(v => cpClamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  function cpHsvToRgb(h, s, v){
    h = cpWrapHue(h) / 60;
    const i = Math.floor(h), f = h - i;
    const p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
    let r, g, b;
    switch(i % 6){
      case 0: r=v; g=t; b=p; break;
      case 1: r=q; g=v; b=p; break;
      case 2: r=p; g=v; b=t; break;
      case 3: r=p; g=q; b=v; break;
      case 4: r=t; g=p; b=v; break;
      default: r=v; g=p; b=q;
    }
    return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
  }
  function cpRgbToHsv(r, g, b){
    r/=255; g/=255; b/=255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b), d = mx - mn;
    let h = 0;
    if (d){
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s: mx ? d / mx : 0, v: mx };
  }
  function cpHslToRgb(h, s, l){
    h = cpWrapHue(h);
    const c = (1 - Math.abs(2*l - 1)) * s;
    const x = c * (1 - Math.abs(((h/60) % 2) - 1));
    const m = l - c/2;
    let r=0, g=0, b=0;
    if (h < 60){ r=c; g=x; } else if (h < 120){ r=x; g=c; }
    else if (h < 180){ g=c; b=x; } else if (h < 240){ g=x; b=c; }
    else if (h < 300){ r=x; b=c; } else { r=c; b=x; }
    return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
  }
  function cpRgbToHsl(r, g, b){
    r/=255; g/=255; b/=255;
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    const l = (mx + mn) / 2, d = mx - mn;
    let h = 0, s = 0;
    if (d){
      s = d / (1 - Math.abs(2*l - 1));
      if (mx === r) h = ((g - b) / d) % 6;
      else if (mx === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
      if (h < 0) h += 360;
    }
    return { h, s, l };
  }
  function cpHsvToHex(base){
    const [r,g,b] = cpHsvToRgb(base.h, base.s, base.v);
    return cpRgbToHex(r,g,b);
  }
  function cpBaseHsl(){
    const [r,g,b] = cpHsvToRgb(cpBase.h, cpBase.s, cpBase.v);
    return cpRgbToHsl(r,g,b);
  }
  function cpHslItem(a){ const [r,g,b] = cpHslToRgb(a.c[0], a.c[1], a.c[2]); return { hex: cpRgbToHex(r,g,b), n: a.n || '' }; }

  function cpCopyText(text, msg){
    const done = () => showToast(msg || 'تم النسخ!');
    const fail = () => showToast('تعذّر النسخ');
    // Legacy path for non-secure contexts (file://) or rejected permissions —
    // without it the button dies silently when navigator.clipboard is missing.
    const legacy = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0;';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) done(); else fail();
      } catch(e){ fail(); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, legacy);
      } else legacy();
    } catch(e){ legacy(); }
  }

  function cpHarmonyList(){
    const b = cpBaseHsl(), h = b.h, s = b.s, l = b.l;
    switch(cpHarmonyMode){
      case 'analogous': return [
        { c:[cpWrapHue(h-30), s, l] }, { c:[h, s, l] }, { c:[cpWrapHue(h+30), s, l] }
      ];
      case 'triadic': return [
        { c:[h, s, l] }, { c:[cpWrapHue(h+120), s, l], n:'+120°' }, { c:[cpWrapHue(h+240), s, l], n:'+240°' }
      ];
      case 'split': return [
        { c:[h, s, l] }, { c:[cpWrapHue(h+150), s, l], n:'+150°' }, { c:[cpWrapHue(h+210), s, l], n:'+210°' }
      ];
      case 'square': return [
        { c:[h, s, l] }, { c:[cpWrapHue(h+90), s, l], n:'+90°' },
        { c:[cpWrapHue(h+180), s, l], n:'+180°' }, { c:[cpWrapHue(h+270), s, l], n:'+270°' }
      ];
      case 'shades': return [
        { c:[h, s, cpClamp(l+0.28, 0, 0.92)], n:'فاتح جداً' },
        { c:[h, s, cpClamp(l+0.14, 0, 1)], n:'فاتح' },
        { c:[h, s, l], n:'أساسي' },
        { c:[h, s, cpClamp(l-0.14, 0, 1)], n:'غامق' },
        { c:[h, cpClamp(s*1.1, 0, 1), cpClamp(l-0.28, 0, 1)], n:'غامق جداً' }
      ];
      default: return [
        { c:[h, s, l] }, { c:[cpWrapHue(h+180), s, l], n:'مكمل' }
      ];
    }
  }

  function cpDrawWheel(){
    const cv = document.getElementById('cp-wheel');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const size = cv.width, R = size / 2;
    const img = ctx.createImageData(size, size), d = img.data;
    for (let y = 0; y < size; y++){
      for (let x = 0; x < size; x++){
        const dx = x - R + 0.5, dy = y - R + 0.5;
        const dist = Math.sqrt(dx*dx + dy*dy) / R;
        const i = (y*size + x) * 4;
        if (dist <= 1){
          let ang = Math.atan2(dy, dx) * 180 / Math.PI;
          if (ang < 0) ang += 360;
          const [r,g,b] = cpHsvToRgb(ang, Math.min(dist, 1), 1);
          d[i] = r; d[i+1] = g; d[i+2] = b; d[i+3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    const mr = cpBase.s * (R - 6), ma = cpBase.h * Math.PI / 180;
    const mx = R + Math.cos(ma) * mr, my = R + Math.sin(ma) * mr;
    ctx.beginPath();
    ctx.arc(mx, my, 6, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.beginPath();
    ctx.arc(mx, my, 8, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.65)'; ctx.lineWidth = 1; ctx.stroke();
  }
  function cpWheelPick(e){
    const cv = document.getElementById('cp-wheel');
    if (!cv) return;
    const rect = cv.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (cv.width / rect.width) - cv.width/2;
    const y = (e.clientY - rect.top) * (cv.height / rect.height) - cv.height/2;
    let ang = Math.atan2(y, x) * 180 / Math.PI;
    if (ang < 0) ang += 360;
    cpBase.h = ang;
    cpBase.s = Math.min(Math.sqrt(x*x + y*y) / (cv.width/2), 1);
    cpRefresh();
  }

  function cpCurrentHex(){ return cpHsvToHex(cpBase); }

    const rgb = cpHexToRgb(hex);

    return true;
  }

  function cpRenderChips(){

    const seen = new Set();

    items.forEach(it => {

    });
    el.innerHTML = uniq.map(it =>
      `<div class="cp-qac" style="background:${it.hex}" title="${it.hex}" data-hex="${it.hex}">

  function cpNextPos(){
    const ps = cpGradStops.map(s => s.pos).sort((a,b) => a - b);
    if (!ps.length) return 50;
    const bounds = [[0, ps[0]]];
    for (let i = 1; i < ps.length; i++) bounds.push([ps[i-1], ps[i]]);
    bounds.push([ps[ps.length-1], 100]);
    let bestGap = -1, bestPos = 50;
    bounds.forEach(([a, b]) => {
      const gap = b - a;
      if (gap > bestGap){ bestGap = gap; bestPos = Math.round((a+b)/2); }
    });
    return cpClamp(bestPos, 0, 100);
  }
  function cpAddStopHex(hex){
    if (cpGradStops.length >= 8){ showToast('الحد الأقصى 8 ألوان للتدرج'); return; }
    cpGradStops.push({ hex: hex.toUpperCase(), pos: cpNextPos() });
    cpRenderStops();
    cpRenderGradBar();
  }

  function cpGradValue(){
